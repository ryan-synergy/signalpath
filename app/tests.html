import { pageFlags, sheetCount, renderChannelMap, renderTakeoff, renderWireSchedule, renderExtraPages, renderBomCompare, wireRuns, takeoffItems, takeoffCSV } from "./pages.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
const t = (name, cond, detail = "") => {
  const li = document.createElement("li");
  li.className = cond ? "pass" : "fail";
  li.textContent = (cond ? "✓ " : "✗ ") + name + (cond || !detail ? "" : " — " + detail);
  out.appendChild(li);
  cond ? pass++ : fail++;
};

const fixtures = {};
for (const name of ["residence", "estate", "stress"]) {
  fixtures[name] = await (await fetch(`../mock-system-${name}.json`)).json();
}

/* unit: channel expansion */
t("expandChannels '1-2'", JSON.stringify(expandChannels("1-2")) === "[1,2]");
t("expandChannels '11'", JSON.stringify(expandChannels("11")) === "[11]");
t("expandChannels '9-10'", JSON.stringify(expandChannels("9-10")) === "[9,10]");

/* every fixture: loads, validates with zero errors */

  const v = validate(job, ix);

  t(`${name}: zero errors`, v.errors.length === 0, JSON.stringify(v.errors.slice(0, 3)));

}

/* residence expectations */
{

  const m8 = a.amps.find(x => x.amp === "mdx8");

  t("estate: MDX-8 3/4 used", m8 && m8.zonesUsed === 3 && m8.spare === 1, JSON.stringify(m8));

/* stress expectations */
{

  const v = validate(job, ix), a = advise(job, ix);
  t(`stress: readability warning fires (25 > ${READABILITY_ZONE_CEILING})`, v.warnings.some(w => w.code === "readability"));
  const used = a.amps.filter(x => x.amp.startsWith("mdx")).reduce((n, x) => n + x.zonesUsed, 0);
  const spare = a.amps.filter(x => x.amp.startsWith("mdx")).reduce((n, x) => n + x.spare, 0);
  t("stress: MDX fleet 21 zones used, 3 spare", used === 21 && spare === 3, `used=${used} spare=${spare}`);
  t("stress: future-scope feed tallied as reserved", a.amps.find(x => x.amp === "mdx-c")?.reserved === 1);
  t("stress: Savant host note says Pro Host (25 > 16)", a.notes.some(n => n.code === "savant-host" && n.msg.includes("Pro Host")));

/* ---------- placer: geometry properties, not pixel-perfect mocks ---------- */

const overlaps = (a, b) =>
  a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
/* Chips are allowed inside a rack CONTAINER (the mxnet mock draws ENC chips
   there) but never on a device, a zone card, or another chip. Everything else
   is solid vs everything. */
function firstOverlap(p) {
  const zones = p.zones.map(z => ({ ...z, _k: "zone " + z.id }));
  const racks = p.racks.map(r => ({ ...r, _k: "rack " + r.id }));
  const devices = p.racks.flatMap(r => r.devices.map(d => ({ ...d, _k: "device " + d.id })));
  const chips = p.chips.map(c => ({ ...c, _k: "chip " + c.id }));
  const solidPairs = [];
  const cross = (as, bs) => { for (const a of as) for (const b of bs) if (a !== b && a.id !== b.id) solidPairs.push([a, b]); };
  cross(zones, zones); cross(racks, racks); cross(zones, racks);
  cross(chips, zones); cross(chips, devices); cross(chips, chips);
  for (const [a, b] of solidPairs) if (overlaps(a, b)) return `${a._k} ⇄ ${b._k}`;
  return null;
}

/* every fixture: places clean, deterministic, no overlapping tiles */
for (const [name, raw] of Object.entries(fixtures)) {
  const { job, ix } = loadJob(raw);
  const p = place(job, ix);
  t(`${name}: places (${p.zones.length} zones, ${p.racks.length} racks, ${p.chips.length} chips)`,
    p.zones.length === job.house.zones.length && p.racks.length === (job.solutions[0].racks || []).length);
  t(`${name}: no overlapping tiles`, firstOverlap(p) === null, firstOverlap(p) || "");
  t(`${name}: deterministic`, JSON.stringify(p) === JSON.stringify(place(job, ix)));
  t(`${name}: racks all in left column`, p.racks.every(r => r.x === p.racks[0]?.x ?? true));
  t(`${name}: bounds within sheet after fitScale`,
    p.bounds.w * p.fitScale <= SHEET.content.w + 1 && p.bounds.h * p.fitScale <= SHEET.content.h + 1,
    JSON.stringify({ bounds: p.bounds, fitScale: p.fitScale }));
}

/* residence: banding, corridor reservation, boundary-aligned chips, local source */
{
  const { job, ix } = loadJob(fixtures.residence);
  const p = place(job, ix);
  const bandOf = id => p.zones.find(z => z.id === id).band;
  t("residence: video zones ride the top band",
    ["z-family", "z-master", "z-patio"].every(id => bandOf(id) === "top"));
  t("residence: audio-only zones in the audio band",
    ["z-kitchen", "z-office", "z-dining", "z-gym"].every(id => bandOf(id) === "audio"));
  const rack = p.racks[0];
  t("residence: top band sits above rack, audio band right of rack",
    p.zones.filter(z => z.band === "top").every(z => z.y + z.h <= rack.y) &&
    p.zones.filter(z => z.band === "audio").every(z => z.x >= rack.x + rack.w));
  const top = p.corridors.find(c => c.id === "top"), right = p.corridors.find(c => c.id === "right");
  t("residence: corridors reserve lane capacity",
    top.h >= top.lanes * top.pitch && right.w >= right.lanes * right.pitch,
    JSON.stringify({ top: { lanes: top.lanes, h: top.h }, right: { lanes: right.lanes, w: right.w } }));
  const fam = p.zones.find(z => z.id === "z-family");
  const famTv = fam.groups.find(g => g.epId === "family-tv");
  const balun = p.chips.find(c => c.id === "balun-family");
  t("residence: balun chip aligned under its display, just below the border",
    Math.abs((balun.x + balun.w / 2) - (fam.x + famTv.cx)) < 1 && balun.y === fam.y + fam.h + 20,
    JSON.stringify(balun));
  const patio = p.zones.find(z => z.id === "z-patio");
  const patioTv = patio.groups.find(g => g.epId === "patio-tv");
  t("residence: local Apple TV slotted inside Patio card at the display",
    patioTv.local?.deviceId === "atv-patio" &&
    patioTv.local.y + patioTv.local.h < patio.h && patioTv.local.x > 0);
  t("residence: sources in col A, amp in col C, distribution in col B",
    rack.devices.find(d => d.id === "cablebox").col === "A" &&
    rack.devices.find(d => d.id === "mdx16").col === "C" &&
    rack.devices.find(d => d.id === "axion8").col === "B");
  t("residence: legend = all five signal rows",
    JSON.stringify(p.legend.rows) === JSON.stringify(["video", "audio", "audioReturn", "network", "prewire"]),
    JSON.stringify(p.legend.rows));
  /* layout stability: appending a zone must not move existing top-band cards */
  const grown = structuredClone(fixtures.residence);
  grown.house.zones.push({ id: "z-new", name: "Den", scope: "included",
    endpoints: [{ id: "den-spk", type: "speakers", config: "stereo", count: 2, status: "new" }] });
  grown.solutions[0].connections.push({ from: "mdx16", to: "den-spk", signal: "speaker", channels: "13-14" });
  const g = loadJob(grown);
  const p2 = place(g.job, g.ix);
  t("residence: appending a zone leaves existing top-band cards in place",
    p.zones.filter(z => z.band === "top").every(z => {
      const z2 = p2.zones.find(q => q.id === z.id);
      return z2 && z2.x === z.x && z2.y === z.y;
    }));
}

/* estate: multi-rack alignment + area clustering (the mxnet-mock properties) */
{
  const { job, ix } = loadJob(fixtures.estate);
  const p = place(job, ix);
  const dev = id => p.racks.flatMap(r => r.devices).find(d => d.id === id);
  t("estate: two racks stacked, vertically aligned columns (switch under switch, amp under amp)",
    p.racks[1].y > p.racks[0].y + p.racks[0].h &&
    dev("sw-pool").x === dev("sw-main").x && dev("mdx8").x === dev("mdx16").x);
  t("estate: pool-house zones cluster on the right with area header",
    ["z-pool", "z-patio1", "z-patio2"].every(id => p.zones.find(z => z.id === id).band === "cluster") &&
    p.areaHeaders.length === 2 && p.areaHeaders.some(h => h.name === "POOL HOUSE"));
  const mainRight = Math.max(...p.zones.filter(z => z.band !== "cluster").map(z => z.x + z.w), p.racks[0].x + p.racks[0].w);
  t("estate: cluster starts clear of the main-house field",
    p.zones.filter(z => z.band === "cluster").every(z => z.x >= mainRight));
  t("estate: legend rows = video/audio/network only (dynamic legend)",
    JSON.stringify(p.legend.rows) === JSON.stringify(["video", "audio", "network"]), JSON.stringify(p.legend.rows));
  const encChip = p.chips.find(c => c.id === "enc-atv1"), atv = dev("atv1");
  t("estate: ENC chip beside its rack source", encChip.x > atv.x + atv.w && Math.abs((encChip.y + encChip.h / 2) - (atv.y + atv.h / 2)) < 1);
}

/* stress: 25 zones still place, drawing shrinks to fit (one-page rule) */
{
  const { job, ix } = loadJob(fixtures.stress);
  const p = place(job, ix);
  t("stress: fitScale shrinks the drawing onto one page", p.fitScale < 1 && p.fitScale > 0.3, String(p.fitScale));
  t("stress: every endpoint owns a placed group slot",
    job.house.zones.every(z => (z.endpoints || []).every(e =>
      p.zones.find(pz => pz.id === z.id)?.groups.some(g => g.epId === e.id))));
}

/* ---------- router: the §4 rule set as machine-checked properties ---------- */

function segsOf(w) {
  const segs = [];
  for (let i = 1; i < w.pts.length; i++) {
    const [x1, y1] = w.pts[i - 1], [x2, y2] = w.pts[i];
    segs.push({ x1, y1, x2, y2, vert: x1 === x2, w });
  }
  return segs;
}
function findCrossings(wires) {
  const all = wires.flatMap(segsOf);
  const found = [];
  for (const a of all) for (const b of all) {
    if (a.w.net >= b.w.net || a.vert === b.vert) continue;
    const v = a.vert ? a : b, h = a.vert ? b : a;
    const hx1 = Math.min(h.x1, h.x2), hx2 = Math.max(h.x1, h.x2);
    const vy1 = Math.min(v.y1, v.y2), vy2 = Math.max(v.y1, v.y2);
    if (v.x1 > hx1 + 1 && v.x1 < hx2 - 1 && h.y1 > vy1 + 1 && h.y1 < vy2 - 1)
      found.push({ v, h, x: v.x1, y: h.y1 });
  }
  return found;
}
function routerChecks(name, raw) {
  const { job, ix } = loadJob(raw);
  const p = place(job, ix);
  const r = route(job, ix, p);
  const conns = job.solutions[0].connections;

  t(`${name}: every connection routed (${r.wires.length}/${conns.length})`, r.wires.length === conns.length);
  t(`${name}: no unrouted warnings`, !r.warnings.some(w => w.code === "unrouted"), JSON.stringify(r.warnings));
  t(`${name}: all wires orthogonal`, r.wires.every(w => w.pts.every((pt, i) =>
    i === 0 || pt[0] === w.pts[i - 1][0] || pt[1] === w.pts[i - 1][1])));
  t(`${name}: deterministic routing`, JSON.stringify(r) === JSON.stringify(route(job, ix, p)));

  /* wires never pierce devices, chips, or cards (borders are fair game) */
  const obstacles = [
    ...p.racks.flatMap(rk => rk.devices.map(d => ({ id: d.id, ...d }))),
    ...p.chips, ...p.zones,
  ];
  let pierce = null;
  for (const w of r.wires) {
    const skip = new Set([w.from, w.to, w.insideCard]);
    if (w.cls === "stub" || w.cls === "local") {
      const comp = job.solutions[0].companions?.find(c => c.id === w.from);
      if (comp) skip.add(ix.endpointZone[comp.serves]);
      skip.add(ix.endpointZone[w.to]);
    }
    for (const s of segsOf(w)) {
      const sx = Math.min(s.x1, s.x2), ex = Math.max(s.x1, s.x2);
      const sy = Math.min(s.y1, s.y2), ey = Math.max(s.y1, s.y2);
      for (const o of obstacles) {
        if (skip.has(o.id)) continue;
        if (sx < o.x + o.w - 2 && ex > o.x + 2 && sy < o.y + o.h - 2 && ey > o.y + 2)
          pierce ??= `${w.id} pierces ${o.id}`;
      }
    }
  }
  t(`${name}: no wire pierces a device/chip/card`, pierce === null, pierce || "");

  /* no co-linear overlap: parallel same-axis segments of different nets keep ≥9px */
  const all = r.wires.flatMap(segsOf);
  let laneClash = null;
  for (const a of all) for (const b of all) {
    if (a.w.net >= b.w.net || a.vert !== b.vert) continue;
    const [ac, a1, a2] = a.vert ? [a.x1, Math.min(a.y1, a.y2), Math.max(a.y1, a.y2)] : [a.y1, Math.min(a.x1, a.x2), Math.max(a.x1, a.x2)];
    const [bc, b1, b2] = b.vert ? [b.x1, Math.min(b.y1, b.y2), Math.max(b.y1, b.y2)] : [b.y1, Math.min(b.x1, b.x2), Math.max(b.x1, b.x2)];
    if (Math.abs(ac - bc) < 9 && Math.min(a2, b2) - Math.max(a1, b1) > 2)
      laneClash ??= `${a.w.id} ∥ ${b.w.id} @ ${ac}`;
  }
  t(`${name}: no co-linear wire overlaps`, laneClash === null, laneClash || "");

  /* every crossing carries a hop on exactly one of the two wires */
  const crossings = findCrossings(r.wires);
  let unhopped = null;
  for (const c of crossings) {
    const covered = [c.v.w, c.h.w].some(w => w.hops.some(h =>
      Math.abs(h.x - c.x) <= (h.orient === "h" ? h.w / 2 + 1 : 2) &&
      Math.abs(h.y - c.y) <= (h.orient === "v" ? h.w / 2 + 1 : 2)));
    if (!covered) unhopped ??= `${c.v.w.id} × ${c.h.w.id} @ ${c.x},${c.y}`;
  }
  t(`${name}: every crossing is bridged (${crossings.length} crossings)`, unhopped === null, unhopped || "");

  /* sibling nesting: wires of one fan-out never cross each other */
  let sibling = null;
  for (const g of r.groups) {
    const members = r.wires.filter(w => g.nets.includes(w.net));
    for (const c of findCrossings(members)) sibling ??= `${g.dev}: ${c.v.w.id} × ${c.h.w.id}`;
  }
  t(`${name}: no sibling crossings within a fan-out`, sibling === null, sibling || "");

  /* port sides: rack outputs exit RIGHT edges, rack inputs land LEFT edges */
  const dev = id => p.racks.flatMap(rk => rk.devices).find(d => d.id === id);
  let portBad = null;
  for (const w of r.wires) {
    const fd = dev(w.from), td = dev(w.to);
    // exceptions: a west-wrap exits the LEFT edge heading west (2026-09-20 redline)
    const westExit = fd && w.pts[0][0] === fd.x && w.pts[1][0] < fd.x;
    if (fd && !westExit && w.pts[0][0] !== fd.x + fd.w) portBad ??= `${w.id} leaves ${w.from} not on right edge`;
    // exception: staples (inter-rack trunk / stacked same-column neighbors) enter the RIGHT edge
    if (td && w.cls !== "staple" && w.pts[w.pts.length - 1][0] !== td.x) portBad ??= `${w.id} enters ${w.to} not on left edge`;
  }
  t(`${name}: outputs right / inputs left on all rack devices (staple + west-wrap exempt)`, portBad === null, portBad || "");

  /* boundary principle: zone feeds die ON the card border, x-aligned with
     their endpoint (or its chip); only stubs/locals live inside cards */
  let boundary = null;
  for (const w of r.wires) {
    if (!w.cls.startsWith("zone")) continue;
    const [ex, ey] = w.pts[w.pts.length - 1];
    const chip = p.chips.find(c => c.id === w.to);
    if (chip) {
      if (Math.abs(ex - (chip.x + chip.w / 2)) > 1 || Math.abs(ey - (chip.y + chip.h)) > 1)
        boundary ??= `${w.id} misses its chip`;
    } else {
      const pz = p.zones.find(z => z.id === ix.endpointZone[w.to]);
      const g = pz.groups.find(g => g.epId === w.to);
      const onBorder = Math.abs(ey - pz.y) <= 1 || Math.abs(ey - (pz.y + pz.h)) <= 1;
      const aligned = Math.abs(ex - (pz.x + g.cx)) <= 13; // centerline or straddle offset
      if (!onBorder || !aligned) boundary ??= `${w.id} lands at ${ex},${ey}`;
    }
  }
  t(`${name}: feeds terminate on borders aligned with their endpoints`, boundary === null, boundary || "");

  return { p, r };
}

const routed = {};
for (const [name, raw] of Object.entries(fixtures)) routed[name] = routerChecks(name, raw);

/* hop-count regression guards (polish round 2026-09-19: returns route last
   and pick the least-crossing lane) */
{
  const ceiling = { residence: 5, estate: 17, stress: 188 };  // 2026-09-28 input order (ports in source order, ranked risers): estate 18→17, stress 192→188  // 2026-09-27 untwist pass (lane / riser swaps): estate 25→18, stress 272→191  // 2026-09-27 route audit: cheapest-of shapes for top-band + east feeds, chips approached from below — stress 308→272  // 2026-09-27 tighter zone spacing (gap 20 / row 24) + span grid: stress 319→308  // 2026-09-27 audit: col-C escape no longer cuts through its own amp — estate 24→25, stress 309→319 (the old counts were subsidized by 8 body-piercing wires)  // re-baselined 2026-09-21: AVB/switching bottom-anchored in col A — residence 7→5 (trunk to output module is now a straight neighbor run)
  for (const [name, raw] of Object.entries(fixtures)) {
    const { job, ix } = loadJob(raw);
    const p = place(job, ix);
    const r = route(job, ix, p);
    t(`${name}: hop count holds the polish ceiling (${r.crossings} ≤ ${ceiling[name]})`, r.crossings <= ceiling[name]);
  }
}

/* residence router specifics */
{
  const { p, r } = routed.residence;
  const ret = r.wires.find(w => w.signal === "audioReturn");
  const savIn = p.racks[0].devices.find(d => d.id === "sav-in");
  t("residence: audio return wraps to the input module's left edge",
    ret && ret.pts[ret.pts.length - 1][0] === savIn.x && ret.pts[0][1] === (() => {
      const pz = p.zones.find(z => z.id === "z-master"); return pz.y + pz.h; })());
  const local = r.wires.find(w => w.cls === "local");
  t("residence: Patio local source links to its display inside the card", !!local);
  const stubs = r.wires.filter(w => w.cls === "stub");
  t("residence: balun stubs are straight verticals into the border",
    stubs.length === 2 && stubs.every(w => w.pts.length === 2 && w.pts[0][0] === w.pts[1][0]));
  const gymFeed = r.wires.find(w => w.to === "gym-spk");
  t("residence: prewire scope rides the wire (gray Gym feed)", gymFeed.scope === "prewire");
}

/* estate router specifics */
{
  const { p, r } = routed.estate;
  const trunk = r.wires.find(w => w.from === "sw-main" && w.to === "sw-pool");
  const swM = p.racks[0].devices.find(d => d.id === "sw-main");
  const swP = p.racks[1].devices.find(d => d.id === "sw-pool");
  t("estate: inter-switch trunk staples right edge to right edge",
    trunk && trunk.pts[0][0] === swM.x + swM.w && trunk.pts[trunk.pts.length - 1][0] === swP.x + swP.w,
    JSON.stringify(trunk?.pts));
  const kitchen = r.wires.find(w => w.to === "kitchen-spk"), office = r.wires.find(w => w.to === "office-spk");
  const cxOf = w => w.pts[w.pts.length - 1][0];
  t("estate: channel order matches zone order (Kitchen ch3-4 west of Office ch5-6)",
    cxOf(kitchen) < cxOf(office));
}

/* ---------- hide-signals view (tech-view slice: hide network wires) ---------- */
{
  const { job, ix } = loadJob(fixtures.residence);
  const opts = { hideSignals: ["network"] };
  const p = place(job, ix, opts);
  const rt = route(job, ix, p, opts);
  const nNet = job.solutions[0].connections.filter(c => c.signal === "network").length;
  t("hideNet: network wires drop from the drawing",
    nNet > 0 && rt.wires.length === job.solutions[0].connections.length - nNet,
    `${rt.wires.length} wires, ${nNet} network`);
  t("hideNet: legend drops its Network row",
    !p.legend.rows.includes("network") && p.legend.rows.includes("video"), JSON.stringify(p.legend.rows));
  t("hideNet: nothing green in the rendered sheet",
    !render(job, ix, p, rt).includes('stroke="#2f9e44"'));
  t("hideNet: validation still sees the full system (no view side effects)",
    validate(job, ix).ok);
  const p0 = place(job, ix);
  t("hideNet: default view unchanged (option is opt-in)",
    JSON.stringify(p0.legend.rows).includes("network"));
}

/* ---------- quick-add shorthand parser ---------- */
{
  const { parseQuick, parseQuickZone } = await import("./quickadd.js");
  const one = t => parseQuickZone(t).zone;
  {
    const z = one("family room 5.1 75 sony matrix");
    t("quickadd: 'family room 5.1 75 sony matrix' → full zone",
      z.name === "Family Room" &&
      z.endpoints.some(e => e.config === "surround-5.1" && e.status === "new") &&
      z.endpoints.some(e => e.type === "display" && e.size === 75 && e.brand === "Sony") &&
      z._hints.matrix, JSON.stringify(z));
  }
  {
    const z = one("master bed stereo ofe 65 tv");
    t("quickadd: 'ofe' marks both endpoints owner-furnished",
      z.endpoints.every(e => e.status === "ofe") && z.endpoints.find(e => e.type === "display").size === 65);
  }
  {
    const z = one("gym 2 speakers prewire");
    t("quickadd: prewire scope + N speakers",
      // pre-wire lives on the zone's scope; the speaker itself stays "new" so
      // switching the zone to included later doesn't leave it filed as PRE-WIRE
      z.scope === "prewire" && z.endpoints[0].config === "stereo" && z.endpoints[0].status === "new" &&
      !z.endpoints.some(e => e.type === "display"));
  }
  {
    const z = one("backyard landscape 8");
    t("quickadd: landscape with sat count",
      z.endpoints[0].config === "landscape" && z.endpoints[0].satCount === 8 && z.endpoints[0].buriedSub);
  }
  {
    const z = one("theater projector 120 7.1");
    t("quickadd: projector with screen size + 7.1",
      z.endpoints.some(e => e.displayType === "projector" && e.size === 120) &&
      z.endpoints.some(e => e.config === "surround-7.1"));
  }
  {
    const z = one("patio soundbar local samsung");
    t("quickadd: soundbar + brand-only TV (size → confirm flag) + local hint",
      z.endpoints.some(e => e.config === "soundbar") &&
      z.endpoints.find(e => e.type === "display")?.confirm?.includes("size") && z._hints.local);
  }
  {
    const z = one("office five one 55 audio only");
    t("quickadd: spoken 'five one' → 5.1; 'audio only' suppresses the TV",
      z.endpoints.length === 1 && z.endpoints[0].config === "surround-5.1");
  }
  {
    const many = parseQuick("kitchen stereo ofe, dining 2.1, loft mono prewire");
    t("quickadd: commas split into multiple zones",
      many.length === 3 && many[0].zone.name === "Kitchen" && many[1].zone.endpoints[0].config === "2.1" &&
      many[2].zone.scope === "prewire");
  }
  t("quickadd: garbage input parses empty, never throws",
    parseQuickZone("").empty && parseQuickZone("xyzzy").empty === false ? parseQuickZone("xyzzy").empty === false : true);
}

/* ---------- print pages 2–4 (per approved mock-pages.svg) ---------- */
{
  const { job, ix } = loadJob(fixtures.residence);
  const CATP = await (await fetch("./catalog.json")).json();
  const a = advise(job, ix, CATP);
  const parseOk = svg => !new DOMParser().parseFromString(svg, "image/svg+xml").querySelector("parsererror");

  t("pages: default flags = channel map + equipment + network + audio setup on, wire schedule + comparison opt-in",
    JSON.stringify(pageFlags(fixtures.residence)) === JSON.stringify({ channelMap: true, equipment: true, wireSchedule: false, bomCompare: false, network: true, labels: false, elevation: true, audioSetup: true, patchList: true }) &&
    sheetCount(fixtures.residence) === 7);

  const cm = renderChannelMap(job, ix, { sheetLabel: "Sheet 2 of 4" });
  t("channel map: valid SVG, no leaks", parseOk(cm) && !/NaN|undefined/.test(cm));
  t("channel map: MDX rows in channel order with gray prewire + spare rows",
    cm.includes(">Master Bed<") && cm.includes(">1–2<") && cm.includes(">Gym<") && cm.includes("PRE-WIRE") && cm.includes("— spare —"));
  t("channel map: matrix ports name their balun destinations",
    cm.includes("Family Room TV · HDBaseT balun") && cm.includes("HDBaseT"));
  t("channel map: input module shows the audio return in orange",
    cm.includes("Master Bed TV — audio return") && cm.includes("#a45a12"));
  t("channel map: AVR mini-card summarizes the surround zone",
    cm.includes("Anthem MRX-540") && cm.includes("5.1 set"));

  const tk = renderTakeoff(job, ix, a, { sheetLabel: "Sheet 3 of 4" });
  t("takeoff: valid SVG, no leaks", parseOk(tk) && !/NaN|undefined/.test(tk));
  t("takeoff: NEW / OFE grouping with confirm + prewire boxes",
    tk.includes("NEW — Supplied") && tk.includes("OWNER FURNISHED") && tk.includes(">Turn Table<") &&
    tk.includes("NEEDS CONFIRMATION") && tk.includes("verify before ordering") && tk.includes("reserved"));
  t("takeoff: licensing box carries catalog date", tk.includes("catalog as of"));
  const items = takeoffItems(job, ix);
  t("takeoff: baluns rolled up as an auto-added pair",
    items.some(i => /balun/i.test(i.label) && i.qty === 2));
  t("takeoff CSV: one line per rolled item + header",
    takeoffCSV(job, ix).split("\n").length === items.length + 1);

  const runs = wireRuns(job, ix);
  const ws = renderWireSchedule(job, ix, { sheetLabel: "Sheet 4 of 4" });
  t("wire schedule: valid SVG, no leaks", parseOk(ws) && !/NaN|undefined/.test(ws));
  t("wire schedule: V/N/R/S runs all present, local ATV gets its network drop",
    ["V-", "N-", "R-", "S-"].every(p => runs.some(r => r.id.startsWith(p))) &&
    runs.some(r => r.carries === "Network (Apple TV)"));
  t("wire schedule: surround zone splits into speaker set + sub feed",
    runs.some(r => r.to.includes("Family Room") && r.cable.includes("×5")) &&
    runs.some(r => r.to.includes("Family Room — sub")));
  t("wire schedule: gym run is gray prewire with reserved channels",
    runs.some(r => r.gray && r.to.includes("Gym") && r.term.includes("reserved")));
  t("wire schedule: totals line rolls up cable counts", ws.includes("home runs") && ws.includes("pre-wire)"));

  const withWs = structuredClone(fixtures.residence);
  withWs.job.pages = { wireSchedule: true };
  const pages = renderExtraPages(loadJob(withWs).job, loadJob(withWs).ix, a, {});
  t("packet: flags drive page list + sheet numbering",
    pages.length === 7 && pages[1].title === "Audio Setup" && pages[3].title === "Wire Schedule" && pages[4].title === "Patch List" && pages[6].svg.includes("Sheet 8 of 8") && sheetCount(withWs) === 8);
  const noPages = structuredClone(fixtures.residence);
  noPages.job.pages = { channelMap: false, equipment: false, network: false, elevation: false, audioSetup: false, patchList: false };
  t("packet: all pages off → schematic only, sheet 1 of 1",
    renderExtraPages(loadJob(noPages).job, loadJob(noPages).ix, a, {}).length === 0 && sheetCount(noPages) === 1);

/* ---------- importers: the one content-sniffed door ---------- */
{

    schema: 2, client: "Smith", address: "1 Main St", jobType: "Remodel", controlSystem: "Savant",
    network: { waps: 4, drops: 10 }, cameras: [{}, {}, {}],
    rack: { location: "Garage closet", sourcesTBD: true, sources: { "Apple TV": 2, "Cable box": 0 } },
    rooms: [
      { name: "Family Room", floor: "Main", tv: true, tvSize: "65", tvStatus: "New", audio: "5.1", audStatus: "New", videoFeed: "matrix", wiring: "prewired", localSources: [], exw: {} },
      { name: "Patio", floor: "Main", tv: false, audio: "tv", landscape: true, satCount: 6, buriedSub: true, exw: {} },
      { name: "Bed 2", floor: "Upper", tv: true, tvSize: "", tvStatus: "New", audio: "2.0", audStatus: "Existing — keep", videoFeed: "local", localSources: ["Apple TV"], equipLoc: "Behind TV", exw: {} },
      { name: "Hallway", floor: "Main", tv: false, audio: "tv", exw: {} },
    ],
  };
  var miniBp = {       // var: the hardening tests reuse it
    generator: "Blueprinted", client: "Adams, Mike",
    system: { hostModel: "Savant Pro Host", blueprintVersion: "10.6.1", advisories: ["Legacy host"] },
    rooms: [
      { n: 1, name: "Theater", zoneType: "Theater — 5.1 local", tv: true, oldTv: [{ make: "Samsung", model: "UN55D7000", size: 55 }], videoFeed: "matrix", avrs: ["Integra DRX-7.1"], flags: ["Wiring unknown"] },
      { n: 2, name: "Kitchen", zoneType: "2-ch — house amp", tv: false },
      { n: 3, name: "Storage", zoneType: "No AV endpoints" },
    ],
    rack: [
      { component: "HDMI Matrix", manufacturer: "AVProConnect", model: "AC-MX88-AUHD-HDBT", category: "Switching" },
      { component: "Apple TV 1", manufacturer: "Apple", model: "Apple TV 4K", category: "Source" },
      { component: "House Amp", manufacturer: "Savant", model: "PAV-SMS8", category: "Amplifier" },
      { component: "Lutron Hub", manufacturer: "Lutron", model: "HQP", category: "Lighting" },
    ],
    connections: [
      { source: "Apple TV 1", sink: "HDMI Matrix", signal: "hdmi" },
      { source: "HDMI Matrix", sink: "House Amp", signal: "audio" },
      { source: "Remote", sink: "HDMI Matrix", signal: "ir" },
    ],
  };

  t("sniff: routes all three formats + rejects garbage",
    sniff(fixtures.residence) === "signalpath" && sniff(miniWalk) === "sitewalk" &&
    sniff(miniBp) === "blueprinted" && sniff({ some: "thing" }) === null);

  { // SiteWalk adapter
    const r = importSiteWalk(miniWalk);
    const j = r.job, z = id => j.house.zones.find(z => z.id === id);
    t("sitewalk: 3 AV rooms map, no-AV room skipped", j.house.zones.length === 3 && r.unmapped.some(u => u.includes("Hallway")));
    t("sitewalk: floors become areas", j.house.areas.length === 2 && z("z-family-room").area === "area-main");
    t("sitewalk: 5.1 walk → surround-5.1 endpoint", z("z-family-room").endpoints.some(e => e.config === "surround-5.1"));
    t("sitewalk: landscape carries sat/sub counts", z("z-patio").endpoints.some(e => e.config === "landscape" && e.satCount === 6 && e.buriedSub));
    t("sitewalk: Existing—keep → OFE; blank TV size → confirm flag",
      z("z-bed-2").endpoints.find(e => e.type === "speakers").status === "ofe" &&
      z("z-bed-2").endpoints.find(e => e.type === "display").confirm?.includes("size"));
    t("sitewalk: local source lands as an at-display localDevice",
      j.solutions[0].localDevices.some(d => d.zone === "z-bed-2" && d.location === "at-display"));
    t("sitewalk: rack sources seeded, platform + aux counts picked up",
      j.solutions[0].racks[0].devices.length === 2 &&
      j.solutions[0].platforms[0] === "savant" && j.solutions[0].auxCounts.cameras === 3);
    t("sitewalk: sources-TBD warning surfaces", r.warnings.some(w => w.includes("TBD")));
    const { job, ix } = loadJob(j);
    const p = place(job, ix);
    t("sitewalk: imported job loads and places", p.zones.length === 3);
  }
  { // drawing the rack from a walk: MXNet, amps, receivers — and it all validates
    const CATW = await (await fetch("./catalog.json")).json();
    const walk = structuredClone(miniWalk);
    walk.rack.sources = { "Apple TV": 2, "DirecTV": 1 };
    walk.rooms.push(
      { name: "Kitchen", tv: true, tvSize: "55", videoFeed: "matrix", audio: "2.0", audioFeed: "house", zoneName: "Main Level", exw: {} },
      { name: "Dining", tv: false, audio: "2.0", audioFeed: "house", zoneName: "Main Level", exw: {} },
      { name: "Den", tv: true, tvSize: "65", videoFeed: "direct", audio: "soundbar", barType: "passive", exw: {} },
      { name: "Guest", tv: true, tvSize: "50", videoFeed: "none", audio: "none", exw: {} });
    walk.rooms.find(x => x.name === "Bed 2").audioFeed = "local";
    const r = importSiteWalk(walk);
    t("walk draw: audio 'none' is not an unmapped value", !r.unmapped.some(u => u.includes('"none"')));
    const d = drawFromWalk(r, CATW);
    const j = r.job, sol = j.solutions[0], devs = sol.racks[0].devices;
    const ofType = ty => devs.filter(x => x.type === ty);
    const fedBy = (epId, sig) => sol.connections.find(c => c.to === epId && c.signal === sig);
    t("walk draw: TVs on the system → one MXNet switch + control box, an encoder per rack source",
      ofType("avSwitch").length === 1 && ofType("controlBox").length === 1 &&
      sol.companions.filter(c => c.type === "enc").length === 3 && d.notes.some(n => n.startsWith("MXNet")));
    t("walk draw: on-system TVs get decoders off the switch",
      ["z-kitchen-tv", "z-family-room-tv"].every(id => sol.companions.some(c => c.type === "dec" && c.serves === id)));
    t("walk draw: Savant job → AVB chain into one amp; kitchen + landscape on its outputs",
      ofType("amp").length === 1 && ofType("audioOutputModule").length === 1 &&
      fedBy("z-patio-land", "speaker")?.channels === "1-2" && fedBy("z-kitchen-spk", "speaker")?.channels === "3-4" &&
      sol.connections.some(c => c.to === ofType("amp")[0].id && c.signal === "audio"));
    t("walk draw: 5.1 on the system → receiver for the speakers, fed video from the switch",
      (() => { const a = fedBy("z-family-room-spk", "speaker")?.from; return a && devs.find(x => x.id === a)?.type === "avr" && sol.connections.some(c => c.to === a && c.signal === "video" && devs.find(x => x.id === c.from)?.type === "avSwitch"); })());
    t("walk draw: rooms sharing a walk audio zone stay separate rooms, own outputs on the same amp",
      j.house.zones.some(z => z.name === "Dining" && /audio zone: Main Level/.test(z.note)) &&
      fedBy("z-dining-spk", "speaker")?.channels === "5-6" && fedBy("z-kitchen-spk", "speaker")?.channels === "3-4" &&
      fedBy("z-dining-spk", "speaker")?.from === fedBy("z-kitchen-spk", "speaker")?.from);
    t("walk draw: passive soundbar → its own receiver driving the TV with eARC",
      (() => { const a = fedBy("z-den-spk", "speaker")?.from; return devs.find(x => x.id === a)?.type === "avr" && sol.connections.some(c => c.from === a && c.earc); })());
    t("walk draw: locally-fed stereo gets a local amp in the room; local source drives its TV",
      sol.localDevices.some(x => x.type === "amp" && x.zone === "z-bed-2" && fedBy("z-bed-2-spk", "speaker")?.from === x.id) &&
      sol.localDevices.some(x => x.type === "source" && fedBy("z-bed-2-tv", "video")?.from === x.id));
    t("walk draw: receivers are real gear with plain names (no catalog drift)", ofType("avr").every(x => !x.catalogRef && /AV receiver — /.test(x.model)));
    const { job, ix } = loadJob(j);
    const v = validate(job, ix);
    const errs = (v.errors || []).map(e => e.msg);
    t("walk draw: the only error left is the TV the walk gave no feed (and the draw warned about it)",
      errs.length === 1 && /Guest/.test(errs[0]) && d.warnings.some(w => w.startsWith("Guest")), errs.join("; "));
    t("walk draw: switch sized by port count (8 ports → SW12)", ofType("avSwitch")[0].catalogRef === "avpro-mxnet-sw12");
    // the handoff link AVWalk opens: #avwalk=<base64url raw-deflate JSON>
    const enc = await encodeHandoff(walk);
    const back = await decodeHandoff("#avwalk=" + enc);
    t("handoff: link round-trips the survey and stays short", JSON.stringify(back) === JSON.stringify(walk) && enc.length < JSON.stringify(walk).length);
    t("handoff: other hashes are ignored", (await decodeHandoff("#tab=gear")) === null);
    let threw = false; try { await decodeHandoff("#avwalk=!!!not-base64"); } catch { threw = true; }
    t("handoff: a damaged link fails loudly, not silently", threw);
  }
  { // Blueprinted adapter
    const r = importBlueprinted(miniBp);
    const j = r.job, sol = j.solutions[0];
    t("blueprinted: AV rooms map, No-AV zone skipped", j.house.zones.length === 2);
    const th = j.house.zones.find(z => z.id === "z-theater");
    t("blueprinted: theater → 5.1 OFE + old TV brand/size carried",
      th.endpoints.some(e => e.config === "surround-5.1" && e.status === "ofe") &&
      th.endpoints.some(e => e.type === "display" && e.brand === "Samsung" && e.size === 55 && e.status === "ofe"));
    t("blueprinted: matrix categorized as videoMatrix; lighting skipped",
      sol.racks[0].devices.some(d => d.type === "videoMatrix") && sol.racks[0].devices.length === 3);
    t("blueprinted: rack wiring carried over (video+audio), IR skipped",
      sol.connections.length === 2 && sol.connections.some(c => c.signal === "video") && sol.connections.some(c => c.signal === "audio"));
    t("blueprinted: platform=savant, advisories + flags surface",
      sol.platforms[0] === "savant" && r.warnings.some(w => w.includes("Legacy host")) && r.warnings.some(w => w.includes("Wiring unknown")));
  }
  { // re-import merge: House refreshes, Solutions and endpoint ids survive
    const target = structuredClone(fixtures.residence);
    const walk = structuredClone(miniWalk);
    walk.rooms.push({ name: "Kitchen", floor: "Main", tv: false, audio: "2.1", audStatus: "New", exw: {} });
    const changes = mergeHouse(target, importSiteWalk(walk).job);
    const kitchen = target.house.zones.find(z => z.name === "Kitchen");
    t("merge: matched zone updates in place, endpoint id stable",
      kitchen.endpoints[0].id === "kitchen-spk" && kitchen.endpoints[0].config === "2.1");
    t("merge: new zones added, unmatched kept, solutions untouched",
      target.house.zones.some(z => z.name === "Bed 2") &&
      changes.some(c => c.kind === "kept" && c.zone === "Gym") &&
      target.solutions[0].connections.length === fixtures.residence.solutions[0].connections.length);
    t("merge: connections to refreshed endpoints still resolve",
      target.solutions[0].connections.some(c => c.to === "kitchen-spk"));
  }
  { // the one door rejects strangers
    let threw = false;
    try { importAny({ hello: 1 }); } catch { threw = true; }
    t("importAny: unrecognized file throws a clear error", threw);
  }
}

/* ---------- catalog + licensing advisor ---------- */
{
  const CAT = await (await fetch("./catalog.json")).json();
  t("catalog: loads with devices and licensing",
    Object.keys(CAT.devices).length >= 15 && CAT.licensing.savant && CAT.licensing.josh && CAT.licensing.control4,
    `${Object.keys(CAT.devices).length} devices`);
  t("catalog: MDX-16 I/O matches the verified manual (8 analog / 2 coax / 2 optical)",
    CAT.devices["anthem-mdx-16"].inputs.analog === 8 && CAT.devices["anthem-mdx-16"].inputs.coax === 2 && CAT.devices["anthem-mdx-16"].inputs.optical === 2);

  const withPlatforms = (fix, platforms) => {
    const j = structuredClone(fix); j.solutions[0].platforms = platforms; return loadJob(j);
  };
  { // Savant tiering: 7-zone residence fits the Smart Host; 25-zone stress needs the Pro Host
    const { job, ix } = withPlatforms(fixtures.residence, ["savant"]);
    const lic = advise(job, ix, CAT).licensing.find(l => l.platform === "savant");
    t("advisor: 7-zone residence → Smart Host", lic?.pick?.includes("Smart Host"), lic?.pick);
    const s2 = withPlatforms(fixtures.stress, ["savant"]);
    const lic2 = advise(s2.job, s2.ix, CAT).licensing.find(l => l.platform === "savant");
    t("advisor: 25-zone stress → Pro Host (Mac)", lic2?.pick?.includes("Pro Host"), lic2?.pick);
  }
  { // Control4: 7 rooms exceeds Core 3's 6-room cap → Core 5, with Connect line
    const { job, ix } = withPlatforms(fixtures.residence, ["control4"]);
    const lic = advise(job, ix, CAT).licensing.find(l => l.platform === "control4");
    t("advisor: 7-room residence → Core 5 + Connect fee", lic?.pick === "Core 5" && lic.lines.some(l => /Connect/.test(l)), lic?.pick);
  }
  { // Josh: small device count, no voice rooms → Josh One
    const { job, ix } = withPlatforms(fixtures.residence, ["josh"]);
    const lic = advise(job, ix, CAT).licensing.find(l => l.platform === "josh");
    t("advisor: residence app-only → Josh One", lic?.pick === "Josh One", lic?.pick);
    const j2 = structuredClone(fixtures.residence);
    j2.solutions[0].platforms = ["josh"]; j2.solutions[0].auxCounts = { voiceRooms: 5 };
    const l2 = loadJob(j2);
    const lic2 = advise(l2.job, l2.ix, CAT).licensing.find(l => l.platform === "josh");
    t("advisor: 5 voice rooms forces a Josh Core", lic2?.pick?.includes("Core"), lic2?.pick);
  }
  { // typed port budget: overload the MDX-16's 12 audio inputs → io over-budget flag
    const bad = structuredClone(fixtures.residence);
    for (let i = 0; i < 13; i++) {
      bad.solutions[0].racks[0].devices.push({ id: `src${i}`, type: "source", model: `Src ${i}`, status: "new", audioOnly: true });
      bad.solutions[0].connections.push({ from: `src${i}`, to: "mdx16", signal: "audio" });
    }
    const { job, ix } = loadJob(bad);
    const a = advise(job, ix, CAT);
    t("advisor: 14 audio feeds into MDX-16 (12 inputs) → over-budget flag",
      a.io.some(x => x.device === "mdx16" && x.over), JSON.stringify(a.io.filter(x => x.over)));
    // analog sources and trunks never carry bitstream — no PCM caveat for them
    t("advisor: PCM-only note stays quiet for analog-only feeds",
      !a.notes.some(n => n.code === "pcm-only"));
    const tvRet = structuredClone(bad);
    tvRet.solutions[0].connections.push({ from: "family-tv", to: "mdx16", signal: "audioReturn" });
    const v2 = loadJob(tvRet);
    const pcm = advise(v2.job, v2.ix, CAT).notes.find(n => n.code === "pcm-only");
    t("advisor: PCM-only note fires when a TV's optical return lands on the MDX (solution-tagged)",
      !!pcm && pcm.solution === tvRet.solutions[0].id);
  }
  { // no catalog → legacy behavior intact
    const { job, ix } = withPlatforms(fixtures.stress, ["savant"]);
    const a = advise(job, ix);
    t("advisor: without a catalog the legacy Savant hint remains",
      a.notes.some(n => n.code === "savant-host" && n.msg.includes("Pro Host")) && a.licensing.length === 0);
  }
}

    return rt.wires.every(w => !w.pts || w.insideCard || w.cls === "local" || w.pts.every((q, i) => i === 0 || !bodies.some(o => inside(...w.pts[i - 1], ...q, o)))); };

    t(`harness style: ${name} bundles feeds and crosses no more than a hop over plain routing`, on.wires.some(w => w.bundleOf) && on.crossings <= off.crossings + 1, `${off.crossings} → ${on.crossings}`);

/* ---------- no wire of any class crosses a device, chip or card body (audit 2026-09-27) ---------- */
{
  const PAD = 2;
  const inside = (x1, y1, x2, y2, o) => Math.min(x1, x2) < o.x + o.w - PAD && Math.max(x1, x2) > o.x + PAD &&
    Math.min(y1, y2) < o.y + o.h - PAD && Math.max(y1, y2) > o.y + PAD;
  for (const name of ["residence", "estate", "stress"]) {
    const { job, ix } = loadJob(structuredClone(fixtures[name]));
    const p = place(job, ix);
    const rt = route(job, ix, p);
    const bodies = [...p.racks.flatMap(r => r.devices), ...p.chips, ...p.zones];
    const bad = [];
    for (const w of rt.wires) {
      if (w.insideCard || w.cls === "local") continue;
      for (let i = 0; i + 1 < w.pts.length; i++) {
        const hit = bodies.find(o => inside(...w.pts[i], ...w.pts[i + 1], o));
        if (hit) { bad.push(`${w.id}→${hit.id}`); break; }
      }
    }
    t(`${name}: no wire crosses any device, chip or card body`, bad.length === 0, bad.slice(0, 4).join(", "));
    // hop arcs fit their own segment and never overlap (they drew paths backwards)
    let arcBad = null;
    for (const w of rt.wires) for (const h of w.hops || []) {
      const [a, b] = [w.pts[h.si], w.pts[h.si + 1]], vert = a[0] === b[0];
      const lo = Math.min(vert ? a[1] : a[0], vert ? b[1] : b[0]), hi = Math.max(vert ? a[1] : a[0], vert ? b[1] : b[0]);
      const c = vert ? h.y : h.x;
      if (c - h.w / 2 < lo - 0.5 || c + h.w / 2 > hi + 0.5) arcBad ??= w.id;
    }
    t(`${name}: every hop arc fits inside its segment`, arcBad === null, arcBad || "");
  }
}

/* ---------- returns must never pierce their target (user redline 2026-09-20) ---------- */
{
  // the target-tile segBlocked exemption is for the final approach only; a lane
  // crossing the module body then wrapping the margin is a collision, not a route
  for (const name of ["residence", "estate", "stress"]) {
    const { job, ix } = loadJob(structuredClone(fixtures[name]));
    const p = place(job, ix);
    const rt = route(job, ix, p);
    const tiles = {}; for (const r of p.racks) for (const d of r.devices) tiles[d.id] = d;
    const pierced = rt.wires.filter(w => {
      const b = tiles[w.to]; if (!b || !w.pts || (w.signal !== "audioReturn" && w.signal !== "network")) return false;
      for (let i = 1; i < w.pts.length - 1; i++) {
        const [x1, y1] = w.pts[i - 1], [x2, y2] = w.pts[i];
        if (Math.min(x1, x2) < b.x + b.w && Math.max(x1, x2) > b.x &&
            Math.min(y1, y2) < b.y + b.h && Math.max(y1, y2) > b.y) return true;
      }
      return false;
    });
    t(`${name}: no return/backhaul pierces its target device body`, pierced.length === 0,
      pierced.map(w => `${w.from}→${w.to}`).join(", "));
  }
}

/* ---------- hardening: hostile input must stay data ---------- */
{
  // 1. Markup in user strings never reaches the SVG live
  const j = structuredClone(fixtures.residence);
  j.house.zones[0].name = `<img src=x onerror=alert(1)> "breakout`;
  j.job.client = { name: `<script>alert(2)<\/script>`, address: "1 Evil St, Nowhere" };

    !svg.includes("<img src=x") && !svg.includes("<script>alert") && !svg.includes(`Model "X" <b>`) &&
    svg.includes("&lt;img") && svg.includes("&quot;breakout"));
  const doc = new DOMParser().parseFromString(svg, "image/svg+xml");
  t("hardening: SVG stays well-formed XML under hostile names",
    !doc.querySelector("parsererror") && doc.querySelector("svg") != null);

  // 2. CSV export neutralizes spreadsheet formulas and doubles quotes
  const j2 = structuredClone(fixtures.residence);
  j2.solutions[0].racks[0].devices[0].model = `=HYPERLINK("http://evil")`;
  const v2 = loadJob(j2);
  const csv = takeoffCSV(v2.job, v2.ix, { solution: 0 });
  t("hardening: CSV formula injection is neutralized with a leading apostrophe",
    csv.includes(`"'=HYPERLINK(""http://evil"")"`) && !csv.includes(`"=HYPERLINK`));

  // 3. Prototype pollution is stripped at the import door
  const hostile = JSON.parse(`{"generator":"SignalPath","schemaVersion":1,
    "job":{"name":"x","__proto__":{"polluted":true}},
    "house":{"zones":[{"id":"z1","name":"A","endpoints":[]}]},
    "solutions":[{"id":"s1","racks":[],"connections":[],"__proto__":{"alsoPolluted":1}}]}`);
  const res = importAny(hostile);
  t("hardening: importAny strips __proto__ keys and pollutes nothing",
    res.kind === "signalpath" && ({}).polluted === undefined && ({}).alsoPolluted === undefined &&
    !Object.keys(res.job.job).includes("__proto__"));

  // 4. Structurally broken native files are rejected, not adopted
  const throws = raw => { try { importAny(raw); return false; } catch { return true; } };
  t("hardening: native import rejects missing solutions / zones / bad schema",
    throws({ generator: "SignalPath", schemaVersion: 1, job: {}, house: { zones: [] }, solutions: [] }) &&
    throws({ generator: "SignalPath", schemaVersion: 1, job: {}, house: {}, solutions: [{}] }) &&
    throws({ generator: "SignalPath", schemaVersion: 2, job: {}, house: { zones: [] }, solutions: [{}] }) &&
    throws({ generator: "SignalPath", schemaVersion: 1, job: {}, house: { zones: [{ name: "no id" }] }, solutions: [{}] }));

  // 5. …but lenient where identity isn't at stake: missing lists are normalized
  const loose = { generator: "SignalPath", schemaVersion: 1, job: { name: "ok" },
    house: { zones: [{ id: "z1", name: "A" }] }, solutions: [{ id: "s1" }] };
  const ok = importAny(loose);
  t("hardening: missing endpoint/rack/connection lists normalize to empty",
    Array.isArray(ok.job.house.zones[0].endpoints) && Array.isArray(ok.job.solutions[0].racks) &&
    Array.isArray(ok.job.solutions[0].connections) && Array.isArray(ok.job.solutions[0].localDevices));
}

  // "## Room" headers, "- qty | Manufacturer | Model" lines — no notes, tables, floors, bold, prose
  const wellFormed = txt => {
    const L = txt.split("\n");
    if (L[0] !== "---" || L[1] !== "planqueue: proposal-import/1" || L[2] !== "---") return "front matter must be exactly the planqueue key";
    const titleAt = L.findIndex((l, k) => k > 2 && l.trim());
    if (!/^# \S/.test(L[titleAt])) return "no # title after the front matter";
    let room = false;
    for (const l of L.slice(titleAt + 1)) {
      if (!l.trim()) continue;
      if (/^## \S/.test(l)) { room = true; continue; }
      if (/^#/.test(l)) return "only ## room headers after the title: " + l;
      if (!/^- \d+ \| [^|*]+ \| [^|*]+$/.test(l)) return "bad line (must be - qty | Manufacturer | Model): " + l;
      if (!room) return "product outside a room: " + l;

/* ---------- twists and corner hops (2026-09-27, from a sheet Ryan flagged) ----------
   A pair of wires crossing each other twice is wound round itself (the red video
   feed and blue speaker feed on random job #65); a hop on another wire's corner
   reads as a tangle. The untwist pass (lane / riser swaps) removes most; these
   hold the level. A bundle is bridged by one arc (Ryan's convention). */
{
  const A = await import("./route-audit.js"), F = await import("./fuzz-jobs.js");
  const lim = { residence: 0, estate: 1, stress: 17 };
  for (const [name, raw] of Object.entries(fixtures)) {
    const { job, ix } = loadJob(raw); const p = place(job, ix), rt = route(job, ix, p);
    const d = A.doubleCrossings(rt), c = A.cornerHops(rt);
    t(`twists — ${name}: pairs crossing twice ≤ ${lim[name]} (${d.length}), no hop on a corner (${c.length})`, d.length <= lim[name] && !c.length);
    // a bundle is bridged by ONE arc (Ryan's convention): never several touching bumps side by side
    t(`hops — ${name}: a bundle gets one arc — no two hops on a segment touch`, rt.wires.every(w => { const by = {};
      for (const h of w.hops || []) (by[h.si] ||= []).push(h);
      return Object.values(by).every(hs => { const iv = hs.map(h => { const c = w.pts[h.si][0] === w.pts[h.si + 1][0] ? h.y : h.x; return [c - h.w / 2, c + h.w / 2]; }).sort((a, b) => a[0] - b[0]);
        return iv.every((q, k) => !k || q[0] > iv[k - 1][1] + 0.5); }); }));
  }
  const g = F.jobGenerator(1);
  let dbl = 0, cor = 0, j65 = null;
  for (let k = 0; k < 66; k++) {
    let job, ix; const raw = g(k); try { ({ job, ix } = loadJob(raw)); } catch { continue; }
    const p = place(job, ix), rt = route(job, ix, p);
    if (k < 60) { dbl += A.doubleCrossings(rt).length; cor += A.cornerHops(rt).length; }
    if (k === 65) j65 = A.doubleCrossings(rt);
  }
  t(`twists — 60 random jobs: pairs crossing twice ≤ 85 (${dbl}; about 300 before the untwist pass, 101 before input order, 97 before page-width placement), corner hops ≤ 8 (${cor})`, dbl <= 85 && cor <= 8);
  t("twists — job #65: the red video feed and blue speaker feed no longer wind round each other", !j65.some(d => [d.a, d.b].includes("mx→z0-tv") && [d.a, d.b].includes("amp0→z5-spk")));
}

/* ---------- route efficiency (2026-09-27 audit): an independent oracle ----------
   route-audit.js measures every wire against the Manhattan minimum and searches
   for a simpler legal route with the same exit/entry sides and no extra hops.
   Ceilings, like the hop ceilings: a routing change may not make wires longer. */
{
  const A = await import("./route-audit.js"), F = await import("./fuzz-jobs.js");
  for (const [name, raw] of Object.entries(fixtures)) {
    const { job, ix } = loadJob(raw); const p = place(job, ix), rt = route(job, ix, p);
    const r = A.auditRoutes(p, rt);
    const big = r.filter(x => x.better && x.len - x.better.len > 200), smells = r.flatMap(x => x.issues);
    t(`route audit — ${name}: no wire with a >200px shorter legal route, no kinks or spikes`, !big.length && !smells.length,
      big.map(x => x.id).concat(smells).join(", "));
  }
  const g = F.jobGenerator(1);
  let big = 0, len = 0, manh = 0, smells = 0, fb = 0;
  for (let k = 0; k < 60; k++) {
    let job, ix; try { ({ job, ix } = loadJob(g(k))); } catch { continue; }
    const p = place(job, ix), rt = route(job, ix, p);
    fb += rt.wires.filter(w => /fallback/.test(w.cls)).length;
    for (const x of A.auditRoutes(p, rt)) { len += x.len; manh += x.manh; smells += x.issues.length; if (x.better && x.len - x.better.len > 200) big++; }
  }
  // 2026-09-27 baseline before the audit fixes: big 30, ratio 1.189, smells 27, fallbacks 7; after audit round 1: big 17
  t(`route audit — 60 random jobs: wires with a much shorter legal route ≤ 10 (${big})`, big <= 10);
  t(`route audit — 60 random jobs: drawn length ≤ 1.170× the Manhattan minimum (${(len / manh).toFixed(3)})`, len / manh <= 1.170);
  t(`route audit — 60 random jobs: kinks/spikes ≤ 2 (${smells}), best-effort fallbacks ≤ 3 (${fb}; 5 before page-width placement)`, smells <= 2 && fb <= 3);
}

/* ---------- placement uses the page width (Ryan 2026-09-30) ----------
   place() tries a few layouts (a longer top row; TV-only rooms beside the
   speaker rooms) and keeps the one that prints biggest, by a 3% margin. */
{
  const F = await import("./fuzz-jobs.js");
  for (const name of ["residence", "estate", "stress"]) {
    const { job, ix } = loadJob(structuredClone(fixtures[name]));
    const a = place(job, ix), b = place(job, ix, { classicLayout: true });
    t(`page width — ${name}: already fills the width, keeps its classic layout`, a.fitScale === b.fitScale && JSON.stringify(a.zones.map(z => [z.x, z.y])) === JSON.stringify(b.zones.map(z => [z.x, z.y])));
  }
  const g = F.jobGenerator(1); let gain = 0, n = 0, never = true;
  for (let k = 0; k < 60; k++) { let job, ix; try { ({ job, ix } = loadJob(g(k))); } catch { continue; }
    const a = place(job, ix), b = place(job, ix, { classicLayout: true }); gain += a.fitScale / b.fitScale; n++; if (a.fitScale < b.fitScale) never = false; }
  t(`page width — 60 random jobs print ≥ 6% bigger on average (${((gain / n - 1) * 100).toFixed(1)}%) and never smaller`, gain / n >= 1.06 && never);

/* ---------- input order (user redline 2026-09-28) ----------
   Feeds into a device's left edge land in the order their sources stack —
   ATV 1, ATV 2, cable box into the MXNet switch — so they nest without a hop. */
{
  const { STARTERS, applyStarter } = await import("./starters.js");
  const CAT = await (await fetch("./catalog.json")).json();
  const blank = { generator: "SignalPath", schemaVersion: 1, job: { name: "x" }, house: { zones: [] }, solutions: [{ id: "s", name: "S" }] };
  for (const st of STARTERS) {
    const j = applyStarter(structuredClone(blank), st, CAT); j.house.zones = structuredClone(fixtures.residence.house.zones);
    const { job, ix } = loadJob(j); const p = place(job, ix), rt = route(job, ix, p);
    const dev = {}; for (const r of p.racks) for (const d of r.devices) dev[d.id] = d;
    const byT = {};
    for (const w of rt.wires) { const b = dev[w.to], e = w.pts.at(-1); if (b && Math.abs(e[0] - b.x) <= 1 && w.pts[0][0] < b.x) (byT[b.id] ||= []).push(w); }
    const flipped = [], hopped = [];
    for (const l of Object.values(byT)) {
      for (const a of l) for (const b of l) if (a.pts[0][1] < b.pts[0][1] - 1 && a.pts.at(-1)[1] > b.pts.at(-1)[1] + 1) flipped.push(`${a.id} / ${b.id}`);
      for (const w of l) if (w.hops.length) hopped.push(w.id);
    }
    t(`input order — ${st.id} starter: rack feeds land in source order, no hops on them`, !flipped.length && !hopped.length, flipped.concat(hopped).join(", "));
  }
}
