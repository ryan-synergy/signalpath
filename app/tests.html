import { loadJob, validate, advise, place as enginePlace, route as engineRoute, render, routeAlternates as engineAlternates, expandChannels, effectiveHouse, effectiveJob, trunkCount, ribbonLayout, autoLinkCatalog, indexJob, READABILITY_ZONE_CEILING, SHEET, deviceKind, KIND_STYLE, boxUsage, lockCatalog, GLYPH_SCALES } from "./engine.js";
// Trunks are the app's default (Ryan 2026-09-30). The router regression suite below
// pins the classic drawing explicitly — it still guards the "Off" choice — and the
// trunk tests pass trunks: "bundle" / "ribbon" (or call enginePlace/engineRoute bare).
const place = (job, ix, o = {}) => enginePlace(job, ix, { trunks: false, ...o });
const route = (job, ix, p, o = {}) => engineRoute(job, ix, p, { trunks: false, ...o });
const routeAlternates = (job, ix, p, o = {}, wid) => engineAlternates(job, ix, p, { trunks: false, ...o }, wid);
import { sniff, importAny, importSiteWalk, importBlueprinted, mergeHouse, stripUnsafe, assertJobShape, drawFromWalk, decodeHandoff, encodeHandoff } from "./importers.js";
import { pageFlags, sheetCount, renderChannelMap, renderTakeoff, renderWireSchedule, renderExtraPages, renderBomCompare, wireRuns, takeoffItems, takeoffCSV } from "./pages.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
const t = (name, cond, detail = "") => {
  const li = document.createElement("li");
  li.className = cond ? "pass" : "fail";
  li.textContent = (cond ? "✓ " : "✗ ") + name + (cond || !detail ? "" : " — " + detail);
  out.appendChild(li);
  cond ? pass++ : fail++;
};

/* ---------- placer: geometry properties, not pixel-perfect mocks ---------- */

const overlaps = (a, b) =>
  a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
/* Chips are allowed inside a rack CONTAINER (the mxnet mock draws ENC chips
   there) but never on a device, a zone card, or another chip. Everything else
   is solid vs everything. */
function firstOverlap(p) {
  const zones = p.zones.map(z => ({ ...z, _k: "zone " + z.id }));
  const racks = p.racks.map(r => ({ ...r, _k: "rack " + r.id }));
  const devices = p.racks.flatMap(r => r.devices.map(d => ({ ...d, _k: "device " + d.id })));
  const chips = p.chips.map(c => ({ ...c, _k: "chip " + c.id }));
  const solidPairs = [];
  const cross = (as, bs) => { for (const a of as) for (const b of bs) if (a !== b && a.id !== b.id) solidPairs.push([a, b]); };
  cross(zones, zones); cross(racks, racks); cross(zones, racks);
  cross(chips, zones); cross(chips, devices); cross(chips, chips);
  for (const [a, b] of solidPairs) if (overlaps(a, b)) return `${a._k} ⇄ ${b._k}`;
  return null;
}

/* every fixture: places clean, deterministic, no overlapping tiles */
for (const [name, raw] of Object.entries(fixtures)) {

  const p = place(job, ix);
  t(`${name}: places (${p.zones.length} zones, ${p.racks.length} racks, ${p.chips.length} chips)`,

  t(`${name}: no overlapping tiles`, firstOverlap(p) === null, firstOverlap(p) || "");
  t(`${name}: deterministic`, JSON.stringify(p) === JSON.stringify(place(job, ix)));
  t(`${name}: racks all in left column`, p.racks.every(r => r.x === p.racks[0]?.x ?? true));
  t(`${name}: bounds within sheet after fitScale`,

}

/* residence: banding, corridor reservation, boundary-aligned chips, local source */
{
  const { job, ix } = loadJob(fixtures.residence);
  const p = place(job, ix);
  const bandOf = id => p.zones.find(z => z.id === id).band;
  t("residence: video zones ride the top band",

  t("residence: audio-only zones in the audio band",

  const rack = p.racks[0];
  t("residence: top band sits above rack, audio band right of rack",
    p.zones.filter(z => z.band === "top").every(z => z.y + z.h <= rack.y) &&
    p.zones.filter(z => z.band === "audio").every(z => z.x >= rack.x + rack.w));
  const top = p.corridors.find(c => c.id === "top"), right = p.corridors.find(c => c.id === "right");

  const fam = p.zones.find(z => z.id === "z-family");
  const famTv = fam.groups.find(g => g.epId === "family-tv");
  const balun = p.chips.find(c => c.id === "balun-family");

    Math.abs((balun.x + balun.w / 2) - (fam.x + famTv.cx)) < 1 && balun.y === fam.y + fam.h + 20,
    JSON.stringify(balun));
  const patio = p.zones.find(z => z.id === "z-patio");
  const patioTv = patio.groups.find(g => g.epId === "patio-tv");
  t("residence: local Apple TV slotted inside Patio card at the display",
    patioTv.local?.deviceId === "atv-patio" &&
    patioTv.local.y + patioTv.local.h < patio.h && patioTv.local.x > 0);
  t("residence: sources in col A, amp in col C, distribution in col B",
    rack.devices.find(d => d.id === "cablebox").col === "A" &&
    rack.devices.find(d => d.id === "mdx16").col === "C" &&
    rack.devices.find(d => d.id === "axion8").col === "B");
  t("residence: legend = all five signal rows",
    JSON.stringify(p.legend.rows) === JSON.stringify(["video", "audio", "audioReturn", "network", "prewire"]),
    JSON.stringify(p.legend.rows));
  /* layout stability: appending a zone must not move existing top-band cards */
  const grown = structuredClone(fixtures.residence);
  grown.house.zones.push({ id: "z-new", name: "Den", scope: "included",
    endpoints: [{ id: "den-spk", type: "speakers", config: "stereo", count: 2, status: "new" }] });
  grown.solutions[0].connections.push({ from: "mdx16", to: "den-spk", signal: "speaker", channels: "13-14" });
  const g = loadJob(grown);
  const p2 = place(g.job, g.ix);
  t("residence: appending a zone leaves existing top-band cards in place",
    p.zones.filter(z => z.band === "top").every(z => {

/* estate: multi-rack alignment + area clustering (the mxnet-mock properties) */
{
  const { job, ix } = loadJob(fixtures.estate);
  const p = place(job, ix);
  const dev = id => p.racks.flatMap(r => r.devices).find(d => d.id === id);
  t("estate: two racks stacked, vertically aligned columns (switch under switch, amp under amp)",

  t("estate: pool-house zones cluster on the right with area header",
    ["z-pool", "z-patio1", "z-patio2"].every(id => p.zones.find(z => z.id === id).band === "cluster") &&

  t("estate: legend rows = video/audio/network only (dynamic legend)",

  const encChip = p.chips.find(c => c.id === "enc-atv1"), atv = dev("atv1");
  t("estate: ENC chip beside its rack source", encChip.x > atv.x + atv.w && Math.abs((encChip.y + encChip.h / 2) - (atv.y + atv.h / 2)) < 1);

/* stress: 25 zones still place, drawing shrinks to fit (one-page rule) */
{
  const { job, ix } = loadJob(fixtures.stress);
  const p = place(job, ix);
  t("stress: fitScale shrinks the drawing onto one page", p.fitScale < 1 && p.fitScale > 0.3, String(p.fitScale));
  t("stress: every endpoint owns a placed group slot",
    job.house.zones.every(z => (z.endpoints || []).every(e =>
      p.zones.find(pz => pz.id === z.id)?.groups.some(g => g.epId === e.id))));
}

/* ---------- router: the §4 rule set as machine-checked properties ---------- */

function segsOf(w) {
  const segs = [];
  for (let i = 1; i < w.pts.length; i++) {
    const [x1, y1] = w.pts[i - 1], [x2, y2] = w.pts[i];
    segs.push({ x1, y1, x2, y2, vert: x1 === x2, w });
  }
  return segs;
}
function findCrossings(wires) {
  const all = wires.flatMap(segsOf);
  const found = [];
  for (const a of all) for (const b of all) {
    if (a.w.net >= b.w.net || a.vert === b.vert) continue;
    const v = a.vert ? a : b, h = a.vert ? b : a;
    const hx1 = Math.min(h.x1, h.x2), hx2 = Math.max(h.x1, h.x2);
    const vy1 = Math.min(v.y1, v.y2), vy2 = Math.max(v.y1, v.y2);
    if (v.x1 > hx1 + 1 && v.x1 < hx2 - 1 && h.y1 > vy1 + 1 && h.y1 < vy2 - 1)
      found.push({ v, h, x: v.x1, y: h.y1 });
  }
  return found;
}
function routerChecks(name, raw) {
  const { job, ix } = loadJob(raw);
  const p = place(job, ix);
  const r = route(job, ix, p);
  const conns = job.solutions[0].connections;

  t(`${name}: every connection routed (${r.wires.length}/${conns.length})`, r.wires.length === conns.length);
  t(`${name}: no unrouted warnings`, !r.warnings.some(w => w.code === "unrouted"), JSON.stringify(r.warnings));
  t(`${name}: all wires orthogonal`, r.wires.every(w => w.pts.every((pt, i) =>
    i === 0 || pt[0] === w.pts[i - 1][0] || pt[1] === w.pts[i - 1][1])));
  t(`${name}: deterministic routing`, JSON.stringify(r) === JSON.stringify(route(job, ix, p)));

  /* wires never pierce devices, chips, or cards (borders are fair game) */
  const obstacles = [
    ...p.racks.flatMap(rk => rk.devices.map(d => ({ id: d.id, ...d }))),
    ...p.chips, ...p.zones,
  ];
  let pierce = null;
  for (const w of r.wires) {
    const skip = new Set([w.from, w.to, w.insideCard]);
    if (w.cls === "stub" || w.cls === "local") {
      const comp = job.solutions[0].companions?.find(c => c.id === w.from);
      if (comp) skip.add(ix.endpointZone[comp.serves]);
      skip.add(ix.endpointZone[w.to]);
    }
    for (const s of segsOf(w)) {
      const sx = Math.min(s.x1, s.x2), ex = Math.max(s.x1, s.x2);
      const sy = Math.min(s.y1, s.y2), ey = Math.max(s.y1, s.y2);
      for (const o of obstacles) {
        if (skip.has(o.id)) continue;
        if (sx < o.x + o.w - 2 && ex > o.x + 2 && sy < o.y + o.h - 2 && ey > o.y + 2)
          pierce ??= `${w.id} pierces ${o.id}`;
      }
    }
  }
  t(`${name}: no wire pierces a device/chip/card`, pierce === null, pierce || "");

  /* no co-linear overlap: parallel same-axis segments of different nets keep ≥9px */
  const all = r.wires.flatMap(segsOf);
  let laneClash = null;
  for (const a of all) for (const b of all) {
    if (a.w.net >= b.w.net || a.vert !== b.vert) continue;
    const [ac, a1, a2] = a.vert ? [a.x1, Math.min(a.y1, a.y2), Math.max(a.y1, a.y2)] : [a.y1, Math.min(a.x1, a.x2), Math.max(a.x1, a.x2)];
    const [bc, b1, b2] = b.vert ? [b.x1, Math.min(b.y1, b.y2), Math.max(b.y1, b.y2)] : [b.y1, Math.min(b.x1, b.x2), Math.max(b.x1, b.x2)];
    if (Math.abs(ac - bc) < 9 && Math.min(a2, b2) - Math.max(a1, b1) > 2)
      laneClash ??= `${a.w.id} ∥ ${b.w.id} @ ${ac}`;
  }
  t(`${name}: no co-linear wire overlaps`, laneClash === null, laneClash || "");

  /* every crossing carries a hop on exactly one of the two wires */
  const crossings = findCrossings(r.wires);
  let unhopped = null;
  for (const c of crossings) {
    const covered = [c.v.w, c.h.w].some(w => w.hops.some(h =>
      Math.abs(h.x - c.x) <= (h.orient === "h" ? h.w / 2 + 1 : 2) &&
      Math.abs(h.y - c.y) <= (h.orient === "v" ? h.w / 2 + 1 : 2)));
    if (!covered) unhopped ??= `${c.v.w.id} × ${c.h.w.id} @ ${c.x},${c.y}`;
  }
  t(`${name}: every crossing is bridged (${crossings.length} crossings)`, unhopped === null, unhopped || "");

  /* sibling nesting: wires of one fan-out never cross each other */
  let sibling = null;
  for (const g of r.groups) {
    const members = r.wires.filter(w => g.nets.includes(w.net));
    for (const c of findCrossings(members)) sibling ??= `${g.dev}: ${c.v.w.id} × ${c.h.w.id}`;
  }
  t(`${name}: no sibling crossings within a fan-out`, sibling === null, sibling || "");

  /* port sides: rack outputs exit RIGHT edges, rack inputs land LEFT edges */
  const dev = id => p.racks.flatMap(rk => rk.devices).find(d => d.id === id);
  let portBad = null;
  for (const w of r.wires) {
    const fd = dev(w.from), td = dev(w.to);
    // exceptions: a west-wrap exits the LEFT edge heading west (2026-09-20 redline)
    const westExit = fd && w.pts[0][0] === fd.x && w.pts[1][0] < fd.x;
    if (fd && !westExit && w.pts[0][0] !== fd.x + fd.w) portBad ??= `${w.id} leaves ${w.from} not on right edge`;
    // exception: staples (inter-rack trunk / stacked same-column neighbors) enter the RIGHT edge
    if (td && w.cls !== "staple" && w.pts[w.pts.length - 1][0] !== td.x) portBad ??= `${w.id} enters ${w.to} not on left edge`;
  }
  t(`${name}: outputs right / inputs left on all rack devices (staple + west-wrap exempt)`, portBad === null, portBad || "");

  /* boundary principle: zone feeds die ON the card border, x-aligned with
     their endpoint (or its chip); only stubs/locals live inside cards */
  let boundary = null;
  for (const w of r.wires) {
    if (!w.cls.startsWith("zone")) continue;
    const [ex, ey] = w.pts[w.pts.length - 1];
    const chip = p.chips.find(c => c.id === w.to);
    if (chip) {
      if (Math.abs(ex - (chip.x + chip.w / 2)) > 1 || Math.abs(ey - (chip.y + chip.h)) > 1)
        boundary ??= `${w.id} misses its chip`;
    } else {
      const pz = p.zones.find(z => z.id === ix.endpointZone[w.to]);
      const g = pz.groups.find(g => g.epId === w.to);
      const onBorder = Math.abs(ey - pz.y) <= 1 || Math.abs(ey - (pz.y + pz.h)) <= 1;
      const aligned = Math.abs(ex - (pz.x + g.cx)) <= 13; // centerline or straddle offset
      if (!onBorder || !aligned) boundary ??= `${w.id} lands at ${ex},${ey}`;
    }
  }
  t(`${name}: feeds terminate on borders aligned with their endpoints`, boundary === null, boundary || "");

  return { p, r };
}

const routed = {};
for (const [name, raw] of Object.entries(fixtures)) routed[name] = routerChecks(name, raw);

/* hop-count regression guards (polish round 2026-09-19: returns route last
   and pick the least-crossing lane) */
{
  const ceiling = { residence: 5, estate: 17, stress: 188 };  // 2026-09-28 input order (ports in source order, ranked risers): estate 18→17, stress 192→188  // 2026-09-27 untwist pass (lane / riser swaps): estate 25→18, stress 272→191  // 2026-09-27 route audit: cheapest-of shapes for top-band + east feeds, chips approached from below — stress 308→272  // 2026-09-27 tighter zone spacing (gap 20 / row 24) + span grid: stress 319→308  // 2026-09-27 audit: col-C escape no longer cuts through its own amp — estate 24→25, stress 309→319 (the old counts were subsidized by 8 body-piercing wires)  // re-baselined 2026-09-21: AVB/switching bottom-anchored in col A — residence 7→5 (trunk to output module is now a straight neighbor run)
  for (const [name, raw] of Object.entries(fixtures)) {
    const { job, ix } = loadJob(raw);
    const p = place(job, ix);
    const r = route(job, ix, p);
    t(`${name}: hop count holds the polish ceiling (${r.crossings} ≤ ${ceiling[name]})`, r.crossings <= ceiling[name]);
  }
}

/* residence router specifics */
{
  const { p, r } = routed.residence;
  const ret = r.wires.find(w => w.signal === "audioReturn");
  const savIn = p.racks[0].devices.find(d => d.id === "sav-in");
  t("residence: audio return wraps to the input module's left edge",
    ret && ret.pts[ret.pts.length - 1][0] === savIn.x && ret.pts[0][1] === (() => {
      const pz = p.zones.find(z => z.id === "z-master"); return pz.y + pz.h; })());
  const local = r.wires.find(w => w.cls === "local");
  t("residence: Patio local source links to its display inside the card", !!local);
  const stubs = r.wires.filter(w => w.cls === "stub");
  t("residence: balun stubs are straight verticals into the border",
    stubs.length === 2 && stubs.every(w => w.pts.length === 2 && w.pts[0][0] === w.pts[1][0]));
  const gymFeed = r.wires.find(w => w.to === "gym-spk");
  t("residence: prewire scope rides the wire (gray Gym feed)", gymFeed.scope === "prewire");
}

/* estate router specifics */
{
  const { p, r } = routed.estate;
  const trunk = r.wires.find(w => w.from === "sw-main" && w.to === "sw-pool");
  const swM = p.racks[0].devices.find(d => d.id === "sw-main");
  const swP = p.racks[1].devices.find(d => d.id === "sw-pool");
  t("estate: inter-switch trunk staples right edge to right edge",
    trunk && trunk.pts[0][0] === swM.x + swM.w && trunk.pts[trunk.pts.length - 1][0] === swP.x + swP.w,
    JSON.stringify(trunk?.pts));
  const kitchen = r.wires.find(w => w.to === "kitchen-spk"), office = r.wires.find(w => w.to === "office-spk");
  const cxOf = w => w.pts[w.pts.length - 1][0];
  t("estate: channel order matches zone order (Kitchen ch3-4 west of Office ch5-6)",
    cxOf(kitchen) < cxOf(office));
}

/* estate wire schedule: two racks — every run starts in the rack it really comes from,
   and the link between the buildings is a run of its own (it used to be left off) */
{
  const { job, ix } = loadJob(fixtures.estate);
  const runs = wireRuns(job, ix, {});

/* ---------- harness style + zone-feed rerouting (2026-09-27) ---------- */
{
  const PAD = 2;
  const inside = (x1, y1, x2, y2, o) => Math.min(x1, x2) < o.x + o.w - PAD && Math.max(x1, x2) > o.x + PAD && Math.min(y1, y2) < o.y + o.h - PAD && Math.max(y1, y2) > o.y + PAD;
  const clean = (p, rt) => { const bodies = [...p.racks.flatMap(r => r.devices), ...p.chips, ...p.zones];
    return rt.wires.every(w => !w.pts || w.insideCard || w.cls === "local" || w.pts.every((q, i) => i === 0 || !bodies.some(o => inside(...w.pts[i - 1], ...q, o)))); };
  for (const name of ["residence", "estate", "stress"]) {
    const { job, ix } = loadJob(structuredClone(fixtures[name]));
    const p = place(job, ix);
    const off = route(job, ix, p), on = route(job, ix, p, { harness: true });
    // (since the 2026-09-27 untwist pass the plain router can beat harness style by a
    // hop on small sheets — bundled wires aren't swappable; it still wins big on dense ones)
    t(`harness style: ${name} bundles feeds and crosses no more than a hop over plain routing`, on.wires.some(w => w.bundleOf) && on.crossings <= off.crossings + 1, `${off.crossings} → ${on.crossings}`);
    t(`harness style: ${name} stays legal (no bodies crossed, nothing unrouted)`, clean(p, on) && !on.warnings.some(w => w.code === "unrouted" || w.code === "route-fallback"));
  }
  // the setting rides on the job, so print / export / reroute all agree
  const j = structuredClone(fixtures.residence); j.job.harnessStyle = true;
  const v = loadJob(j), pv = place(v.job, v.ix);
  t("harness style: job.harnessStyle turns it on without an opt", route(v.job, v.ix, pv).wires.some(w => w.bundleOf));
  t("harness style: an explicit opt still wins", !route(v.job, v.ix, pv, { harness: false }).wires.some(w => w.bundleOf));
  // only a source with 3+ zone runs of a signal bundles by choice
  const on = route(v.job, v.ix, pv);
  const runs = {}; for (const w of on.wires) if (/^zone-(west|east)$/.test(w.cls)) runs[w.from + "|" + w.signal] = (runs[w.from + "|" + w.signal] || 0) + 1;
  t("harness style: a source with fewer than 3 room runs never bundles by choice",
    on.wires.filter(w => w.bundleOf).every(w => runs[w.from + "|" + w.signal] >= 3));

  // zone-feed rerouting: feeds now have a hint vocabulary
  const { job, ix } = loadJob(structuredClone(fixtures.residence));
  const p = place(job, ix);
  const rt = route(job, ix, p);
  const feeds = rt.wires.filter(w => /^zone-(west|east)$/.test(w.cls));
  const menus = feeds.map(w => routeAlternates(job, ix, p, {}, w.id));
  t("reroute: most residence zone feeds offer alternates", menus.filter(m => m.length > 1).length >= Math.ceil(feeds.length * 0.75), `${menus.filter(m => m.length > 1).length}/${feeds.length}`);
  let legal = true, honored = true;
  feeds.forEach((w, k) => menus[k].slice(1).forEach(a => {
    const r2 = route(job, ix, p, { hintOverride: { [w.id]: a.hint } });
    if (!clean(p, r2)) legal = false;
    if (JSON.stringify(r2.wires.find(x => x.id === w.id).pts) !== JSON.stringify(a.pts)) honored = false;
  }));
  t("reroute: every zone-feed alternate is legal on the whole sheet", legal);
  t("reroute: a picked zone-feed alternate draws exactly as previewed", honored);
  const east = feeds.find(w => w.cls === "zone-east" && menus[feeds.indexOf(w)].some(a => a.hint?.land));
  const top = east && menus[feeds.indexOf(east)].find(a => a.hint?.land);
  t("reroute: a land hint lands on the named card edge", !!top &&
    (() => { const pz = p.zones.find(z => top.pts.at(-1)[0] > z.x && top.pts.at(-1)[0] < z.x + z.w && Math.abs(top.pts.at(-1)[1] - (top.hint.land === "top" ? z.y : z.y + z.h)) < 1); return !!pz; })());
  // bundle: true rides a sibling even with harness style off; bundle:false opts out with it on
  // (the first feed of a group routes first — it IS the trunk, so its menu has no "ride" option)
  const sib = feeds.find((w, k) => menus[k].some(a => a.hint?.bundle === true));
  t("reroute: a bundle hint joins the harness", !!sib && !!route(job, ix, p, { hintOverride: { [sib.id]: { bundle: true } } }).wires.find(x => x.id === sib.id).bundleOf);
  const bundled = on.wires.find(w => w.bundleOf);
  t("reroute: an own-run hint leaves the harness", !route(v.job, v.ix, pv, { hintOverride: { [bundled.id]: { bundle: false } } }).wires.find(x => x.id === bundled.id).bundleOf);
  const bogus = route(job, ix, p, { hintOverride: { [feeds[0].id]: { ch: "staple" } } });
  t("reroute: a hint the feed can't honor warns and routes automatically",
    bogus.warnings.some(w => w.code === "hint-unroutable" && w.msg === feeds[0].id) && bogus.wires.find(x => x.id === feeds[0].id)?.pts?.length > 1);
}

/* ---------- no wire of any class crosses a device, chip or card body (audit 2026-09-27) ---------- */
{
  const PAD = 2;
  const inside = (x1, y1, x2, y2, o) => Math.min(x1, x2) < o.x + o.w - PAD && Math.max(x1, x2) > o.x + PAD &&
    Math.min(y1, y2) < o.y + o.h - PAD && Math.max(y1, y2) > o.y + PAD;
  for (const name of ["residence", "estate", "stress"]) {
    const { job, ix } = loadJob(structuredClone(fixtures[name]));
    const p = place(job, ix);
    const rt = route(job, ix, p);
    const bodies = [...p.racks.flatMap(r => r.devices), ...p.chips, ...p.zones];
    const bad = [];
    for (const w of rt.wires) {
      if (w.insideCard || w.cls === "local") continue;
      for (let i = 0; i + 1 < w.pts.length; i++) {
        const hit = bodies.find(o => inside(...w.pts[i], ...w.pts[i + 1], o));
        if (hit) { bad.push(`${w.id}→${hit.id}`); break; }
      }
    }
    t(`${name}: no wire crosses any device, chip or card body`, bad.length === 0, bad.slice(0, 4).join(", "));
    // hop arcs fit their own segment and never overlap (they drew paths backwards)
    let arcBad = null;
    for (const w of rt.wires) for (const h of w.hops || []) {
      const [a, b] = [w.pts[h.si], w.pts[h.si + 1]], vert = a[0] === b[0];
      const lo = Math.min(vert ? a[1] : a[0], vert ? b[1] : b[0]), hi = Math.max(vert ? a[1] : a[0], vert ? b[1] : b[0]);
      const c = vert ? h.y : h.x;
      if (c - h.w / 2 < lo - 0.5 || c + h.w / 2 > hi + 0.5) arcBad ??= w.id;
    }
    t(`${name}: every hop arc fits inside its segment`, arcBad === null, arcBad || "");
  }
}

/* ---------- twists and corner hops (2026-09-27, from a sheet Ryan flagged) ----------
   A pair of wires crossing each other twice is wound round itself (the red video
   feed and blue speaker feed on random job #65); a hop on another wire's corner
   reads as a tangle. The untwist pass (lane / riser swaps) removes most; these
   hold the level. A bundle is bridged by one arc (Ryan's convention). */
{
  const A = await import("./route-audit.js"), F = await import("./fuzz-jobs.js");
  const lim = { residence: 0, estate: 1, stress: 17 };
  for (const [name, raw] of Object.entries(fixtures)) {
    const { job, ix } = loadJob(raw); const p = place(job, ix), rt = route(job, ix, p);
    const d = A.doubleCrossings(rt), c = A.cornerHops(rt);
    t(`twists — ${name}: pairs crossing twice ≤ ${lim[name]} (${d.length}), no hop on a corner (${c.length})`, d.length <= lim[name] && !c.length);
    // a bundle is bridged by ONE arc (Ryan's convention): never several touching bumps side by side
    t(`hops — ${name}: a bundle gets one arc — no two hops on a segment touch`, rt.wires.every(w => { const by = {};
      for (const h of w.hops || []) (by[h.si] ||= []).push(h);
      return Object.values(by).every(hs => { const iv = hs.map(h => { const c = w.pts[h.si][0] === w.pts[h.si + 1][0] ? h.y : h.x; return [c - h.w / 2, c + h.w / 2]; }).sort((a, b) => a[0] - b[0]);
        return iv.every((q, k) => !k || q[0] > iv[k - 1][1] + 0.5); }); }));
  }
  const g = F.jobGenerator(1);
  let dbl = 0, cor = 0, j65 = null;
  for (let k = 0; k < 66; k++) {
    let job, ix; const raw = g(k); try { ({ job, ix } = loadJob(raw)); } catch { continue; }
    const p = place(job, ix), rt = route(job, ix, p);
    if (k < 60) { dbl += A.doubleCrossings(rt).length; cor += A.cornerHops(rt).length; }
    if (k === 65) j65 = A.doubleCrossings(rt);
  }
  t(`twists — 60 random jobs: pairs crossing twice ≤ 70 (${dbl}; about 300 before the untwist pass, 101 before input order, 97 before page-width placement, 77 before bundles moved as one), corner hops ≤ 8 (${cor})`, dbl <= 70 && cor <= 8);
  t("twists — job #65: the red video feed and blue speaker feed no longer wind round each other", !j65.some(d => [d.a, d.b].includes("mx→z0-tv") && [d.a, d.b].includes("amp0→z5-spk")));
}

/* ---------- route efficiency (2026-09-27 audit): an independent oracle ----------
   route-audit.js measures every wire against the Manhattan minimum and searches
   for a simpler legal route with the same exit/entry sides and no extra hops.
   Ceilings, like the hop ceilings: a routing change may not make wires longer. */
{
  const A = await import("./route-audit.js"), F = await import("./fuzz-jobs.js");
  for (const [name, raw] of Object.entries(fixtures)) {
    const { job, ix } = loadJob(raw); const p = place(job, ix), rt = route(job, ix, p);
    const r = A.auditRoutes(p, rt);
    const big = r.filter(x => x.better && x.len - x.better.len > 200), smells = r.flatMap(x => x.issues);
    t(`route audit — ${name}: no wire with a >200px shorter legal route, no kinks or spikes`, !big.length && !smells.length,
      big.map(x => x.id).concat(smells).join(", "));
  }
  const g = F.jobGenerator(1);
  let big = 0, len = 0, manh = 0, smells = 0, fb = 0;
  for (let k = 0; k < 60; k++) {
    let job, ix; try { ({ job, ix } = loadJob(g(k))); } catch { continue; }
    const p = place(job, ix), rt = route(job, ix, p);
    fb += rt.wires.filter(w => /fallback/.test(w.cls)).length;
    for (const x of A.auditRoutes(p, rt)) { len += x.len; manh += x.manh; smells += x.issues.length; if (x.better && x.len - x.better.len > 200) big++; }
  }
  // 2026-09-27 baseline before the audit fixes: big 30, ratio 1.189, smells 27, fallbacks 7; after audit round 1: big 17
  t(`route audit — 60 random jobs: wires with a much shorter legal route ≤ 10 (${big})`, big <= 10);
  t(`route audit — 60 random jobs: drawn length ≤ 1.170× the Manhattan minimum (${(len / manh).toFixed(3)})`, len / manh <= 1.170);
  t(`route audit — 60 random jobs: kinks/spikes ≤ 2 (${smells}), best-effort fallbacks ≤ 3 (${fb}; 5 before page-width placement)`, smells <= 2 && fb <= 3);
}

  t("planqueue SKUs: every catalog device has a PlanQueue SKU or says it isn't in PlanQueue", !loose.length, loose.join(", "));
  // THE NO-PRICING RULE (Ryan 2026-10-02): the repo is public — no prices of any kind, anywhere it ships
  // (deploy.sh runs check-public.py on the same terms and refuses to publish)
  {
    const MONEY = /(?<!["'`\\])[$€£]\s?\d|\b\d[\d,]*(\.\d+)?\s?(USD|dollars?)\b/i, FEE = /\b\d[\d,]*(\.\d+)?\s?\/\s?(mo|month|yr|year)\b/i;
    const KEY = /["'](price|priceUsd|prices|msrp|cost|costUsd|sellPrice|dealerPrice|listPrice|retailPrice|unitPrice)["']\s*:/i;
    // built from pieces, so this file doesn't itself read as the export to check-public.py
    const PQ = new RegExp([["Synergy Plan", "Queue Catalog"], ["dealer sell", " pric"], ["contains", " dealer"], ['^\\s*"?sku"?,\\s*"?name"?,\\s*"?manufacturer"?,\\s*"?category"?,\\s*"?pr', "ice"]].map(p => p.join("")).join("|"), "im");
    const files = ["../index.html", "../README.md", "../BUILDING.md", "./catalog.json", "../mock-system-residence.json", "../mock-system-estate.json", "../mock-system-stress.json",
      ...["ai", "asbuilt", "audiochain", "commands", "engine", "exports", "fuzz-jobs", "hookup", "importers", "kinds", "library", "names", "network", "pages", "ports", "power", "quickadd", "rack", "route-audit", "sheets", "starters"].map(m => `./${m}.js`)];
    const found = [];
    for (const f of files) {
      const txt = await (await fetch(f)).text();
      txt.split("\n").forEach((line, i) => { for (const [rx, why] of [[MONEY, "money"], [FEE, "fee"], [KEY, "price field"], [PQ, "PlanQueue export"]]) if (rx.test(line)) found.push(`${f}:${i + 1} ${why}`); });
    }
    t(`no pricing: nothing that ships (catalog, ${files.length - 1} files) carries a price, fee, price field or PlanQueue-export content`, files.length > 20 && !found.length, found.slice(0, 6).join(" | "));
    t("no pricing: no catalog entry has a price field of any name", !Object.values(CAT.devices).some(d => Object.keys(d).some(k => /price|msrp|cost/i.test(k))));
  }
  const est = planQueueFiles(fixtures.estate, 0, CAT).map(f => typeof f === "string" ? f : f.text ?? f.content ?? "").join("\n");
  t("planqueue SKUs: known gear exports as its PlanQueue SKU with no unsure note (Anthem MDX-16)", /\| Anthem \| MDX-16$/m.test(est));
  const j = structuredClone(fixtures.residence);
  j.solutions[0].racks[0].devices.push({ id: "pzc", type: "amp", model: "Blaze PowerZone Connect 1008D", catalogRef: "sonance-blaze-pzc-1008d", status: "new" });
  const res = planQueueFiles(j, 0, CAT).map(f => typeof f === "string" ? f : f.text ?? f.content ?? "").join("\n");
  t("planqueue SKUs: gear PlanQueue doesn't carry goes out as a plain line under its manufacturer order code (PlanQueue flags it needs-SKU on import)",
    /^- 1 \| Sonance \| UBX-888-031$/m.test(res));   // UBX-888-031 = Sonance's order code for the PZC 1008D
}

      const [a, b] = [w.pts[i - 1], q];
      const hit = bodies.find(o => inside(a[0], a[1], b[0], b[1], o)); if (hit) bad.push(`${w.id} crosses ${hit.id}`);
      const h = a[1] === b[1]; runs.push({ w, h, c: h ? a[1] : a[0], lo: Math.min(h ? a[0] : a[1], h ? b[0] : b[1]), hi: Math.max(h ? a[0] : a[1], h ? b[0] : b[1]) }); });

/* ---------- input order (user redline 2026-09-28) ----------
   Feeds into a device's left edge land in the order their sources stack —
   ATV 1, ATV 2, cable box into the MXNet switch — so they nest without a hop. */
{
  const { STARTERS, applyStarter } = await import("./starters.js");
  const CAT = await (await fetch("./catalog.json")).json();
  const blank = { generator: "SignalPath", schemaVersion: 1, job: { name: "x" }, house: { zones: [] }, solutions: [{ id: "s", name: "S" }] };
  for (const st of STARTERS) {
    const j = applyStarter(structuredClone(blank), st, CAT); j.house.zones = structuredClone(fixtures.residence.house.zones);
    const { job, ix } = loadJob(j); const p = place(job, ix), rt = route(job, ix, p);
    const dev = {}; for (const r of p.racks) for (const d of r.devices) dev[d.id] = d;
    const byT = {};
    for (const w of rt.wires) { const b = dev[w.to], e = w.pts.at(-1); if (b && Math.abs(e[0] - b.x) <= 1 && w.pts[0][0] < b.x) (byT[b.id] ||= []).push(w); }
    const flipped = [], hopped = [];
    for (const l of Object.values(byT)) {
      for (const a of l) for (const b of l) if (a.pts[0][1] < b.pts[0][1] - 1 && a.pts.at(-1)[1] > b.pts.at(-1)[1] + 1) flipped.push(`${a.id} / ${b.id}`);
      // a hop between two feeds into the SAME box is an ordering failure; one against a wire bound
      // elsewhere (an AVDM encoder's audio dropping past its neighbours' video) is geometry, not order
      const cross = (a, b) => a.pts.slice(1).some((q, i) => b.pts.slice(1).some((r, k) => { const [p1, p2, p3, p4] = [a.pts[i], q, b.pts[k], r];
        const [h, v] = p1[1] === p2[1] ? [[p1, p2], [p3, p4]] : [[p3, p4], [p1, p2]]; if (h[0][1] !== h[1][1] || v[0][0] !== v[1][0]) return false;
        const x = v[0][0], y = h[0][1]; return x > Math.min(h[0][0], h[1][0]) + 1 && x < Math.max(h[0][0], h[1][0]) - 1 && y > Math.min(v[0][1], v[1][1]) + 1 && y < Math.max(v[0][1], v[1][1]) - 1; }));
      for (const w of l) if (l.some(o => o !== w && cross(w, o))) hopped.push(w.id);
    }

  }
}

      const h = a[1] === b[1]; runs.push({ w, h, c: h ? a[1] : a[0], lo: Math.min(h ? a[0] : a[1], h ? b[0] : b[1]), hi: Math.max(h ? a[0] : a[1], h ? b[0] : b[1]) }); });

  };

      if (legal(p, rt).length) bad.push(`#${k} illegal`); } catch (err) { bad.push(`#${k} ${err.message}`); } }
