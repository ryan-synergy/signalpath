const out = document.getElementById("out");
let pass = 0, fail = 0;
const t = (name, cond, detail = "") => {
  const li = document.createElement("li");
  li.className = cond ? "pass" : "fail";
  li.textContent = (cond ? "✓ " : "✗ ") + name + (cond || !detail ? "" : " — " + detail);
  out.appendChild(li);
  cond ? pass++ : fail++;
};

const fixtures = {};
for (const name of ["residence", "estate", "stress"]) {

}

{

/* stress expectations */
{

  const spare = a.amps.filter(x => x.amp.startsWith("mdx")).reduce((n, x) => n + x.spare, 0);

  t("stress: future-scope feed tallied as reserved", a.amps.find(x => x.amp === "mdx-c")?.reserved === 1);

/* ---------- placer: geometry properties, not pixel-perfect mocks ---------- */

const overlaps = (a, b) =>
  a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
/* Chips are allowed inside a rack CONTAINER (the mxnet mock draws ENC chips
   there) but never on a device, a zone card, or another chip. Everything else
   is solid vs everything. */
function firstOverlap(p) {
  const zones = p.zones.map(z => ({ ...z, _k: "zone " + z.id }));
  const racks = p.racks.map(r => ({ ...r, _k: "rack " + r.id }));
  const devices = p.racks.flatMap(r => r.devices.map(d => ({ ...d, _k: "device " + d.id })));
  const chips = p.chips.map(c => ({ ...c, _k: "chip " + c.id }));
  const solidPairs = [];
  const cross = (as, bs) => { for (const a of as) for (const b of bs) if (a !== b && a.id !== b.id) solidPairs.push([a, b]); };
  cross(zones, zones); cross(racks, racks); cross(zones, racks);
  cross(chips, zones); cross(chips, devices); cross(chips, chips);
  for (const [a, b] of solidPairs) if (overlaps(a, b)) return `${a._k} ⇄ ${b._k}`;
  return null;
}

/* every fixture: places clean, deterministic, no overlapping tiles */
for (const [name, raw] of Object.entries(fixtures)) {
  const { job, ix } = loadJob(raw);
  const p = place(job, ix);
  t(`${name}: places (${p.zones.length} zones, ${p.racks.length} racks, ${p.chips.length} chips)`,
    p.zones.length === job.house.zones.length && p.racks.length === (job.solutions[0].racks || []).length);
  t(`${name}: no overlapping tiles`, firstOverlap(p) === null, firstOverlap(p) || "");
  t(`${name}: deterministic`, JSON.stringify(p) === JSON.stringify(place(job, ix)));
  t(`${name}: racks all in left column`, p.racks.every(r => r.x === p.racks[0]?.x ?? true));
  t(`${name}: bounds within sheet after fitScale`,
    p.bounds.w * p.fitScale <= SHEET.content.w + 1 && p.bounds.h * p.fitScale <= SHEET.content.h + 1,
    JSON.stringify({ bounds: p.bounds, fitScale: p.fitScale }));
}

/* residence: banding, corridor reservation, boundary-aligned chips, local source */
{

  const p = place(job, ix);
  const bandOf = id => p.zones.find(z => z.id === id).band;

  t("residence: audio-only zones in the audio band",

  const rack = p.racks[0];
  t("residence: top band sits above rack, audio band right of rack",
    p.zones.filter(z => z.band === "top").every(z => z.y + z.h <= rack.y) &&

  const top = p.corridors.find(c => c.id === "top"), right = p.corridors.find(c => c.id === "right");

  const famTv = fam.groups.find(g => g.epId === "family-tv");
  const balun = p.chips.find(c => c.id === "balun-family");

    Math.abs((balun.x + balun.w / 2) - (fam.x + famTv.cx)) < 1 && balun.y === fam.y + fam.h + 20,
    JSON.stringify(balun));
  const patio = p.zones.find(z => z.id === "z-patio");
  const patioTv = patio.groups.find(g => g.epId === "patio-tv");
  t("residence: local Apple TV slotted inside Patio card at the display",
    patioTv.local?.deviceId === "atv-patio" &&

  t("residence: sources in col A, amp in col C, distribution in col B",
    rack.devices.find(d => d.id === "cablebox").col === "A" &&
    rack.devices.find(d => d.id === "mdx16").col === "C" &&
    rack.devices.find(d => d.id === "axion8").col === "B");
  t("residence: legend = all five signal rows",
    JSON.stringify(p.legend.rows) === JSON.stringify(["video", "audio", "audioReturn", "network", "prewire"]),
    JSON.stringify(p.legend.rows));
  /* layout stability: appending a zone must not move existing top-band cards */
  const grown = structuredClone(fixtures.residence);
  grown.house.zones.push({ id: "z-new", name: "Den", scope: "included",
    endpoints: [{ id: "den-spk", type: "speakers", config: "stereo", count: 2, status: "new" }] });
  grown.solutions[0].connections.push({ from: "mdx16", to: "den-spk", signal: "speaker", channels: "13-14" });
  const g = loadJob(grown);
  const p2 = place(g.job, g.ix);
  t("residence: appending a zone leaves existing top-band cards in place",
    p.zones.filter(z => z.band === "top").every(z => {
      const z2 = p2.zones.find(q => q.id === z.id);
      return z2 && z2.x === z.x && z2.y === z.y;
    }));

/* estate: multi-rack alignment + area clustering (the mxnet-mock properties) */
{
  const { job, ix } = loadJob(fixtures.estate);
  const p = place(job, ix);
  const dev = id => p.racks.flatMap(r => r.devices).find(d => d.id === id);
  t("estate: two racks stacked, vertically aligned columns (switch under switch, amp under amp)",

/* stress: 25 zones still place, drawing shrinks to fit (one-page rule) */
{

  const p = place(job, ix);
  t("stress: fitScale shrinks the drawing onto one page", p.fitScale < 1 && p.fitScale > 0.3, String(p.fitScale));
  t("stress: every endpoint owns a placed group slot",
    job.house.zones.every(z => (z.endpoints || []).every(e =>
      p.zones.find(pz => pz.id === z.id)?.groups.some(g => g.epId === e.id))));
}

/* ---------- router: the §4 rule set as machine-checked properties ---------- */

function segsOf(w) {
  const segs = [];
  for (let i = 1; i < w.pts.length; i++) {
    const [x1, y1] = w.pts[i - 1], [x2, y2] = w.pts[i];
    segs.push({ x1, y1, x2, y2, vert: x1 === x2, w });
  }
  return segs;
}
function findCrossings(wires) {
  const all = wires.flatMap(segsOf);
  const found = [];
  for (const a of all) for (const b of all) {
    if (a.w.net >= b.w.net || a.vert === b.vert) continue;
    const v = a.vert ? a : b, h = a.vert ? b : a;
    const hx1 = Math.min(h.x1, h.x2), hx2 = Math.max(h.x1, h.x2);
    const vy1 = Math.min(v.y1, v.y2), vy2 = Math.max(v.y1, v.y2);
    if (v.x1 > hx1 + 1 && v.x1 < hx2 - 1 && h.y1 > vy1 + 1 && h.y1 < vy2 - 1)
      found.push({ v, h, x: v.x1, y: h.y1 });
  }
  return found;
}
function routerChecks(name, raw) {
  const { job, ix } = loadJob(raw);
  const p = place(job, ix);
  const r = route(job, ix, p);
  const conns = job.solutions[0].connections;

  t(`${name}: every connection routed (${r.wires.length}/${conns.length})`, r.wires.length === conns.length);
  t(`${name}: no unrouted warnings`, !r.warnings.some(w => w.code === "unrouted"), JSON.stringify(r.warnings));
  t(`${name}: all wires orthogonal`, r.wires.every(w => w.pts.every((pt, i) =>
    i === 0 || pt[0] === w.pts[i - 1][0] || pt[1] === w.pts[i - 1][1])));
  t(`${name}: deterministic routing`, JSON.stringify(r) === JSON.stringify(route(job, ix, p)));

  /* wires never pierce devices, chips, or cards (borders are fair game) */
  const obstacles = [
    ...p.racks.flatMap(rk => rk.devices.map(d => ({ id: d.id, ...d }))),
    ...p.chips, ...p.zones,
  ];
  let pierce = null;
  for (const w of r.wires) {
    const skip = new Set([w.from, w.to, w.insideCard]);
    if (w.cls === "stub" || w.cls === "local") {
      const comp = job.solutions[0].companions?.find(c => c.id === w.from);
      if (comp) skip.add(ix.endpointZone[comp.serves]);
      skip.add(ix.endpointZone[w.to]);
    }
    for (const s of segsOf(w)) {
      const sx = Math.min(s.x1, s.x2), ex = Math.max(s.x1, s.x2);
      const sy = Math.min(s.y1, s.y2), ey = Math.max(s.y1, s.y2);
      for (const o of obstacles) {
        if (skip.has(o.id)) continue;
        if (sx < o.x + o.w - 2 && ex > o.x + 2 && sy < o.y + o.h - 2 && ey > o.y + 2)
          pierce ??= `${w.id} pierces ${o.id}`;
      }
    }
  }
  t(`${name}: no wire pierces a device/chip/card`, pierce === null, pierce || "");

  /* no co-linear overlap: parallel same-axis segments of different nets keep ≥9px */
  const all = r.wires.flatMap(segsOf);
  let laneClash = null;
  for (const a of all) for (const b of all) {
    if (a.w.net >= b.w.net || a.vert !== b.vert) continue;
    const [ac, a1, a2] = a.vert ? [a.x1, Math.min(a.y1, a.y2), Math.max(a.y1, a.y2)] : [a.y1, Math.min(a.x1, a.x2), Math.max(a.x1, a.x2)];
    const [bc, b1, b2] = b.vert ? [b.x1, Math.min(b.y1, b.y2), Math.max(b.y1, b.y2)] : [b.y1, Math.min(b.x1, b.x2), Math.max(b.x1, b.x2)];
    if (Math.abs(ac - bc) < 9 && Math.min(a2, b2) - Math.max(a1, b1) > 2)
      laneClash ??= `${a.w.id} ∥ ${b.w.id} @ ${ac}`;
  }
  t(`${name}: no co-linear wire overlaps`, laneClash === null, laneClash || "");

  /* every crossing carries a hop on exactly one of the two wires */
  const crossings = findCrossings(r.wires);
  let unhopped = null;
  for (const c of crossings) {
    const covered = [c.v.w, c.h.w].some(w => w.hops.some(h =>
      Math.abs(h.x - c.x) <= (h.orient === "h" ? h.w / 2 + 1 : 2) &&
      Math.abs(h.y - c.y) <= (h.orient === "v" ? h.w / 2 + 1 : 2)));
    if (!covered) unhopped ??= `${c.v.w.id} × ${c.h.w.id} @ ${c.x},${c.y}`;
  }
  t(`${name}: every crossing is bridged (${crossings.length} crossings)`, unhopped === null, unhopped || "");

  /* sibling nesting: wires of one fan-out never cross each other */
  let sibling = null;
  for (const g of r.groups) {
    const members = r.wires.filter(w => g.nets.includes(w.net));
    for (const c of findCrossings(members)) sibling ??= `${g.dev}: ${c.v.w.id} × ${c.h.w.id}`;
  }
  t(`${name}: no sibling crossings within a fan-out`, sibling === null, sibling || "");

  /* port sides: rack outputs exit RIGHT edges, rack inputs land LEFT edges */
  const dev = id => p.racks.flatMap(rk => rk.devices).find(d => d.id === id);
  let portBad = null;
  for (const w of r.wires) {
    const fd = dev(w.from), td = dev(w.to);
    if (fd && w.pts[0][0] !== fd.x + fd.w) portBad ??= `${w.id} leaves ${w.from} not on right edge`;
    // exception: the inter-rack trunk staples into the RIGHT edge (per spec §4)
    if (td && w.cls !== "staple" && w.pts[w.pts.length - 1][0] !== td.x) portBad ??= `${w.id} enters ${w.to} not on left edge`;
  }
  t(`${name}: outputs right / inputs left on all rack devices (staple exempt)`, portBad === null, portBad || "");

  /* boundary principle: zone feeds die ON the card border, x-aligned with
     their endpoint (or its chip); only stubs/locals live inside cards */
  let boundary = null;
  for (const w of r.wires) {
    if (!w.cls.startsWith("zone")) continue;
    const [ex, ey] = w.pts[w.pts.length - 1];
    const chip = p.chips.find(c => c.id === w.to);
    if (chip) {
      if (Math.abs(ex - (chip.x + chip.w / 2)) > 1 || Math.abs(ey - (chip.y + chip.h)) > 1)
        boundary ??= `${w.id} misses its chip`;
    } else {
      const pz = p.zones.find(z => z.id === ix.endpointZone[w.to]);
      const g = pz.groups.find(g => g.epId === w.to);
      const onBorder = Math.abs(ey - pz.y) <= 1 || Math.abs(ey - (pz.y + pz.h)) <= 1;
      const aligned = Math.abs(ex - (pz.x + g.cx)) <= 13; // centerline or straddle offset
      if (!onBorder || !aligned) boundary ??= `${w.id} lands at ${ex},${ey}`;
    }
  }
  t(`${name}: feeds terminate on borders aligned with their endpoints`, boundary === null, boundary || "");

  return { p, r };
}

const routed = {};
for (const [name, raw] of Object.entries(fixtures)) routed[name] = routerChecks(name, raw);

/* hop-count regression guards (polish round 2026-09-19: returns route last
   and pick the least-crossing lane) */
{
  const ceiling = { residence: 14, estate: 26, stress: 560 };
  for (const [name, raw] of Object.entries(fixtures)) {
    const { job, ix } = loadJob(raw);
    const p = place(job, ix);
    const r = route(job, ix, p);
    t(`${name}: hop count holds the polish ceiling (${r.crossings} ≤ ${ceiling[name]})`, r.crossings <= ceiling[name]);
  }
}

/* residence router specifics */
{
  const { p, r } = routed.residence;
  const ret = r.wires.find(w => w.signal === "audioReturn");
  const savIn = p.racks[0].devices.find(d => d.id === "sav-in");
  t("residence: audio return wraps to the input module's left edge",
    ret && ret.pts[ret.pts.length - 1][0] === savIn.x && ret.pts[0][1] === (() => {
      const pz = p.zones.find(z => z.id === "z-master"); return pz.y + pz.h; })());
  const local = r.wires.find(w => w.cls === "local");
  t("residence: Patio local source links to its display inside the card", !!local);
  const stubs = r.wires.filter(w => w.cls === "stub");
  t("residence: balun stubs are straight verticals into the border",
    stubs.length === 2 && stubs.every(w => w.pts.length === 2 && w.pts[0][0] === w.pts[1][0]));
  const gymFeed = r.wires.find(w => w.to === "gym-spk");
  t("residence: prewire scope rides the wire (gray Gym feed)", gymFeed.scope === "prewire");
}

/* estate router specifics */
{
  const { p, r } = routed.estate;
  const trunk = r.wires.find(w => w.from === "sw-main" && w.to === "sw-pool");
  const swM = p.racks[0].devices.find(d => d.id === "sw-main");
  const swP = p.racks[1].devices.find(d => d.id === "sw-pool");
  t("estate: inter-switch trunk staples right edge to right edge",
    trunk && trunk.pts[0][0] === swM.x + swM.w && trunk.pts[trunk.pts.length - 1][0] === swP.x + swP.w,
    JSON.stringify(trunk?.pts));
  const kitchen = r.wires.find(w => w.to === "kitchen-spk"), office = r.wires.find(w => w.to === "office-spk");
  const cxOf = w => w.pts[w.pts.length - 1][0];
  t("estate: channel order matches zone order (Kitchen ch3-4 west of Office ch5-6)",
    cxOf(kitchen) < cxOf(office));
}

/* ---------- hide-signals view (tech-view slice: hide network wires) ---------- */
{
  const { job, ix } = loadJob(fixtures.residence);
  const opts = { hideSignals: ["network"] };
  const p = place(job, ix, opts);
  const rt = route(job, ix, p, opts);
  const nNet = job.solutions[0].connections.filter(c => c.signal === "network").length;
  t("hideNet: network wires drop from the drawing",
    nNet > 0 && rt.wires.length === job.solutions[0].connections.length - nNet,
    `${rt.wires.length} wires, ${nNet} network`);
  t("hideNet: legend drops its Network row",
    !p.legend.rows.includes("network") && p.legend.rows.includes("video"), JSON.stringify(p.legend.rows));
  t("hideNet: nothing green in the rendered sheet",
    !render(job, ix, p, rt).includes('stroke="#2f9e44"'));
  t("hideNet: validation still sees the full system (no view side effects)",
    validate(job, ix).ok);
  const p0 = place(job, ix);
  t("hideNet: default view unchanged (option is opt-in)",
    JSON.stringify(p0.legend.rows).includes("network"));
}

/* ---------- quick-add shorthand parser ---------- */
{
  const { parseQuick, parseQuickZone } = await import("./quickadd.js");
  const one = t => parseQuickZone(t).zone;
  {
    const z = one("family room 5.1 75 sony matrix");
    t("quickadd: 'family room 5.1 75 sony matrix' → full zone",
      z.name === "Family Room" &&
      z.endpoints.some(e => e.config === "surround-5.1" && e.status === "new") &&
      z.endpoints.some(e => e.type === "display" && e.size === 75 && e.brand === "Sony") &&
      z._hints.matrix, JSON.stringify(z));
  }
  {
    const z = one("master bed stereo ofe 65 tv");
    t("quickadd: 'ofe' marks both endpoints owner-furnished",
      z.endpoints.every(e => e.status === "ofe") && z.endpoints.find(e => e.type === "display").size === 65);
  }
  {

  const n = autoLinkCatalog(raw, catalog);
  const ref = id => devsOf(raw).find(d => d.id === id)?.catalogRef;
  t("autolink: relinks the known gear on an old job", n >= 4, `linked ${n}`);
  t("autolink: exact match (Anthem MDX-16)", ref("mdx16") === "anthem-mdx-16");
  t("autolink: 8K-suffix tolerance (Anthem MRX-540 → MRX 540 8K)", ref("mrx540") === "anthem-mrx-540-8k");
  t("autolink: Savant module aliases", ref("sav-in") === "savant-avb-input-module" && ref("sav-out") === "savant-avb-output-module");
  t("autolink: no fuzzy links — Axion 8 stays unlinked (not an AC-MX-88)", ref("axion8") == null);
  t("autolink: generic sources stay unlinked", ref("cablebox") == null && ref("atv-rack") == null);
  t("autolink: idempotent", autoLinkCatalog(raw, catalog) === 0);

  const stress = structuredClone(fixtures.stress);
  const sw1 = stress.solutions[0].racks[0].devices.find(d => d.id === "sw1");
  autoLinkCatalog(stress, catalog);
  t("autolink: never touches an existing ref, even a stale one", sw1.catalogRef === "avpro-mxnet-sw24");
  t("autolink: stress Savant Input Module picked up via alias",
    stress.solutions[0].racks[0].devices.find(d => d.id === "sav-in").catalogRef === "savant-avb-input-module");
}

/* ---------- interactive sheet hooks: tap targets baked into the render ---------- */
{
  const { job, ix } = loadJob(fixtures.residence);
  const p = place(job, ix), rt = route(job, ix, p);
  const svg = render(job, ix, p, rt);
  const doc = new DOMParser().parseFromString(svg, "image/svg+xml");
  t("interactive: every wire has a fat invisible hit twin",
    doc.querySelectorAll("path.wirehit").length === rt.wires.length);
  t("interactive: wires carry from/to/signal data",
    [...doc.querySelectorAll("path.wire")].every(w => w.dataset.from && w.dataset.to && w.dataset.signal));
  t("interactive: every zone card is a tappable group with a fill",
    doc.querySelectorAll("g.zcard[data-zone]").length === job.house.zones.length &&
    doc.querySelectorAll("g.zcard > rect.hit").length === job.house.zones.length);
  t("interactive: every rack device is a tappable group",
    doc.querySelectorAll("g.devtile[data-device]").length === p.racks.reduce((n, r) => n + r.devices.length, 0));
  t("interactive: hit twins are invisible (transparent stroke)", !/wirehit[^/]*stroke="#/.test(svg));
}

/* ---------- congestion overlay feed (debug-only channel registry export) ---------- */
{
  const { job, ix } = loadJob(fixtures.residence);
  const p = place(job, ix);
  const rt = route(job, ix, p, { debug: true });
  t("debug: route exposes channel segments for the congestion overlay",
    !!rt.channels && rt.channels.h.length > 0 && rt.channels.v.length > 0 &&
    ["c", "a1", "a2"].every(k => k in rt.channels.h[0]));
  t("debug: channels stay private outside debug mode", !route(job, ix, p).channels);
}

document.getElementById("summary").innerHTML =
  fail === 0 ? `<span class="pass">ALL ${pass} TESTS PASS</span>` : `<span class="fail">${fail} FAILED</span> · ${pass} passed`;
document.title = fail === 0 ? `✓ ${pass} pass` : `✗ ${fail} fail`;
</script>
