<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalPath</title>
<style>
  :root {
    --bar: #14161a; --bar2: #1e2128; --ink: #16181c; --panel: #f7f7f9;
    --line: #d8dade; --accent: #2b6cb8; --ok: #2f7a3a; --bad: #b32017; --warn: #b8860b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Avenir Next", Avenir, Futura, "Helvetica Neue", sans-serif; color: var(--ink);
         display: flex; flex-direction: column; background: #e7e9ee; }

  /* ---- top bar ---- */
  #topbar { background: var(--bar); color: #e8eaee; display: flex; align-items: center; gap: 10px;
            padding: 8px 14px; flex: 0 0 auto; }
  #topbar .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 2px; font-size: 14px; }
  #topbar .logo svg { width: 22px; height: 22px; }
  #topbar select, #topbar button, #topbar label {
    background: var(--bar2); color: #e8eaee; border: 1px solid #333842; border-radius: 6px;
    font: inherit; font-size: 12.5px; padding: 5px 9px; }
  #topbar button { cursor: pointer; }
  #topbar button:hover { border-color: #58607a; }
  #topbar .spacer { flex: 1; }
  /* grouped menus (File / View / Export) */
  #topbar .menu { position: relative; }
  #topbar .mlist { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; min-width: 270px; display: flex; flex-direction: column;
    background: var(--bar2); border: 1px solid #3a404c; border-radius: 8px; padding: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.35); }
  #topbar .mlist[hidden] { display: none; }
  #topbar .mlist.right { left: auto; right: 0; }
  #topbar .mlist button, #topbar .mlist label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
    background: transparent; border: 0; border-radius: 6px; padding: 7px 10px; width: 100%; }
  #topbar .mlist label { flex-direction: row; gap: 10px; align-items: flex-start; cursor: pointer; }
  #topbar .mlist label > span { display: flex; flex-direction: column; gap: 2px; }
  #topbar .mlist button:hover, #topbar .mlist label:hover, #topbar .mlist button:focus-visible { background: #2a303b; }
  #topbar .mlist b { font-weight: 600; font-size: 12.5px; }
  #topbar .mlist span, #topbar .mlist em { font-size: 11px; color: #9aa3b2; font-style: normal; line-height: 1.35; white-space: normal; }
  #topbar .mlist .danger b { color: #ff9d8e; }
  #topbar .mlist hr { border: 0; border-top: 1px solid #333842; margin: 4px 2px; }
  #topbar .mbtn[aria-expanded="true"] { border-color: #58607a; background: #2a303b; }
  #rulesChip { border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  #rulesChip.ok { background: #14301c; color: #7fd695; border-color: #2f7a3a; }
  #rulesChip.bad { background: #33150f; color: #ff9d8e; border-color: #b32017; cursor: pointer; }
  #jobName { background: transparent; border: none; color: #fff; font-size: 14px; font-weight: 600; min-width: 130px; }
  #jobName:focus { outline: 1px solid var(--accent); border-radius: 4px; }
  label.chk { display: flex; align-items: center; gap: 5px; cursor: pointer; }

  /* ---- main split ---- */
  #main { flex: 1; display: flex; min-height: 0; }
  #panel { width: 360px; flex: 0 0 auto; background: var(--panel);
           display: flex; flex-direction: column; min-height: 0; transition: width .15s; }
  #panel.collapsed { width: 42px; }
  #panel.collapsed .body, #panel.collapsed .tabs .lbl { display: none; }
  .tabs { display: flex; align-items: center; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .tabs button { flex: 1; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px;
                 padding: 10px 2px; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; color: #666; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  #collapse { flex: 0 0 30px; font-size: 13px; color: #888; background: none; border: none; cursor: pointer; padding: 10px 0; }
  .body { flex: 1; overflow-y: auto; padding: 10px; min-height: 0; }

  /* ---- panel widgets ---- */
  .row { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  .row > .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; }
  .row > .head .t { font-weight: 600; font-size: 13.5px; flex: 1; }
  .row > .head .sub { font-size: 11px; color: #777; }
  .row > .fields { border-top: 1px solid var(--line); padding: 9px 10px; display: none; }
  .row.open > .fields { display: block; }   /* child-only: a box's connection rows open on their own */
  /* ---- panel v2: summary rows, tap chips, status marks, back panel ---- */
  .row > .head.zhead { align-items: flex-start; }
  .zmain { flex: 1; min-width: 0; }
  .zt { display: flex; align-items: center; gap: 6px; }
  .zt .t { flex: 1; }
  .zsum { font-size: 11.5px; color: #666; margin-top: 2px; line-height: 1.35; }
  .ziss { font-size: 11.5px; margin-top: 3px; line-height: 1.35; }
  .ziss.e { color: var(--bad); } .ziss.w { color: #8a5a00; }
  .st { flex: 0 0 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 800; color: #fff; margin-top: 1px; }
  .st.ok { background: #2f7a3a; } .st.w { background: #c58a0a; } .st.e { background: var(--bad); } .st.none { background: #c9ccd2; }
  .zissues { margin: 0 0 8px; }
  .zissues div { font-size: 12px; padding: 5px 8px; border-radius: 6px; margin-bottom: 4px; }
  .zissues .e { background: #fdecea; color: #8f1d14; } .zissues .w { background: #fff6e0; color: #6b4a00; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
  .chip { font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line);
          background: #fff; color: #333; cursor: pointer; }
  .chip:hover { border-color: #9db4d0; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .f.ov .chip.on { background: #e8842c; border-color: #e8842c; }
  details.more { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
  details.more > summary { font-size: 11.5px; color: var(--accent); cursor: pointer; padding: 4px 0; list-style: none; }
  details.more > summary::before { content: "▸ "; } details.more[open] > summary::before { content: "▾ "; }
  .ports { margin: 4px 0 8px; }
  .ports .cap { font-size: 11px; color: #777; margin: 0 2px 5px; }
  .ports .row { margin-bottom: 5px; }
  .ports .empty { font-size: 11.5px; color: #999; margin: 0 2px 6px; }
  .addconn { width: 100%; font: inherit; font-size: 12px; padding: 5px; border-radius: 6px; cursor: pointer;
             background: #fff; border: 1px dashed #9db4d0; color: var(--accent); margin-bottom: 4px; }
  #connSearch { width: 100%; font: inherit; font-size: 12.5px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; }
  #grip { flex: 0 0 6px; cursor: col-resize; background: transparent; border-right: 1px solid var(--line); }
  #grip:hover, #grip.drag { background: #c7d6ea; }
  .cgrp { font-size: 11.5px; color: #555; margin: 12px 2px 5px; }
  .cgrp b { color: #222; }
  .drift { background: #fff7e6; border: 1px solid #f0d49a; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; color: #6b4a00; }
  .drift .addbtn { margin-top: 6px; }
  [data-ci] > .head { padding: 6px 10px; flex-direction: column; align-items: flex-start; gap: 1px; }
  [data-ci] > .head .t { width: 100%; }
  [data-ci] > .head .t { font-weight: 500; font-size: 12.5px; }
  .fields .f { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .fields label { font-size: 11px; color: #666; width: 74px; flex: 0 0 auto; }
  .fields input, .fields select { font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line);
                                  border-radius: 5px; flex: 1; min-width: 0; background: #fff; }
  .fields input[type=checkbox] { flex: 0 0 auto; }
  /* mini numeric fields keep a real width and never collapse */
  .fields input[type=number] { flex: 0 0 46px; width: 46px; min-width: 46px; padding: 4px 5px;
                               appearance: textfield; -moz-appearance: textfield; }
  .fields input[type=number]::-webkit-outer-spin-button,
  .fields input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .fields .f.wrap { flex-wrap: wrap; row-gap: 5px; }
  .mini { font-size: 11px; color: #999; }
  .addbtn, .del { font: inherit; font-size: 12px; border-radius: 6px; cursor: pointer; }
  .addbtn { width: 100%; padding: 8px; background: #eef2f8; border: 1px dashed #9db4d0; color: var(--accent); font-weight: 600; }
  .del { background: none; border: none; color: #b55; padding: 2px 6px; }
  .sect { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #888; margin: 12px 2px 6px; }
  .badge { font-size: 10px; border-radius: 4px; padding: 1px 5px; background: #eee; color: #666; }
  .badge.ovb { background: #fdeedd; color: #b05e12; border: 1px solid #e8b57e; }

  /* ---- per-solution override affordances ---- */
  #escope { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 11px;
            background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; margin-bottom: 8px; }
  #escope .t { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #888; }
  #escope label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #444; }
  #escope input { accent-color: #e8842c; }
  .f.ov input, .f.ov select { border-color: #e8842c; box-shadow: 0 0 0 1px #e8842c55; }
  .f.ov label { color: #b05e12; }
  .ovx { background: none; border: none; color: #e8842c; font-size: 12px; font-weight: 700;
         cursor: pointer; padding: 0 3px; margin-left: 1px; border-radius: 3px; }
  .ovx:hover { background: #e8842c; color: #fff; }

  /* ---- quick-add bar ---- */
  #qa { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
  #qa .line { display: flex; gap: 6px; }
  #qaInput { flex: 1; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
  #qaMic, #qaGo { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
                  background: #fff; cursor: pointer; }
  #qaMic.rec { background: var(--bad); color: #fff; border-color: var(--bad); }
  #qaGo { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #qaChips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; min-height: 0; }
  #qaChips .qc { font-size: 11px; border-radius: 999px; padding: 2px 9px; background: #eef2f8; color: #23507e; border: 1px solid #c7d6ea; }
  #qaChips .qc.name { background: #16181c; color: #fff; border-color: #16181c; }
  #qaChips .qc.scope { background: #f0f0f2; color: #777; border-color: #ccc; }
  #qaChips .qc.hint { background: #fdf3d8; color: #7a5a12; border-color: #e2c78a; }
  #qa .ex { font-size: 10.5px; color: #999; margin-top: 5px; }

  /* ---- canvas + advisor ---- */
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvas { flex: 1; overflow: auto; padding: 16px; min-height: 0; }
  #canvas svg { width: 100%; height: auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); border-radius: 3px; }

  /* ---- interactive sheet: wire tracing + card jump ---- */
  #canvas svg .wirehit, #canvas svg .zcard .hit, #canvas svg .devtile { cursor: pointer; }
  #canvas svg.wiresel path.wire:not(.sel) { opacity: .13; }
  #canvas svg path.wire.sel { stroke-width: 3.6; }
  #canvas .devtile.selnode rect:first-of-type { stroke: #e8842c; stroke-width: 2.5; }
  #canvas .zcard.selnode > rect.hit { stroke: #e8842c; stroke-width: 2.2; fill: rgba(232,132,44,.06); }
  #canvas .zcard.zglow > rect.hit { stroke: #e8842c99; stroke-width: 2; fill: rgba(232,132,44,.04); }
  #wiretip { position: fixed; z-index: 40; background: #16181c; color: #eee; font-size: 12px;
             padding: 6px 11px; border-radius: 6px; display: none;
             box-shadow: 0 4px 14px rgba(0,0,0,.35); max-width: 300px; }
  /* the tip is interactive now (Reroute lives in it) — pointer-events:none
     would let taps fall through to the canvas and clear the selection */
  #wiretip .mini { color: #9a9a9a; }
  #wiretip .altrow { cursor: pointer; padding: 3px 0 1px; color: #b9a8ff; }
  #wiretip .altrow:hover { color: #fff; }
  .altpath { fill: none; stroke: #7b2ff2; stroke-width: 3.5; stroke-dasharray: 7 5; opacity: .55; cursor: pointer; pointer-events: stroke; }
  .altpath:hover { opacity: 1; }
  .altbub { fill: #7b2ff2; cursor: pointer; }
  .altnum { fill: #fff; font-size: 11px; font-weight: 700; cursor: pointer; pointer-events: none; }
  @keyframes rowflash { 0% { background: #fdeedd; } 100% { background: #fff; } }
  .row.flash { animation: rowflash 1.2s ease-out; }
  #advisor { flex: 0 0 auto; background: #fff; border-top: 1px solid var(--line); max-height: 130px; overflow-y: auto;
             padding: 6px 14px; font-size: 12px; }
  #advisor .item { padding: 3px 0; }
  #advisor .e { color: var(--bad); } #advisor .w { color: var(--warn); } #advisor .i { color: #444; }
  #advisor .ok { color: var(--ok); }

  /* ---- import review overlay ---- */
  #review { position: fixed; inset: 0; background: rgba(10,12,16,.55); display: none; z-index: 50;
            align-items: center; justify-content: center; }
  #review.show { display: flex; }
  #review .card { background: #fff; border-radius: 12px; width: min(680px, 92vw); max-height: 84vh;
                  display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  #review .hd { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  #review .hd .t { font-size: 16px; font-weight: 700; }
  #review .hd .s { font-size: 12px; color: #777; margin-top: 2px; }
  #review .bd { padding: 10px 18px; overflow-y: auto; font-size: 12.5px; }
  #review .bd .w { color: var(--warn); padding: 2px 0; }
  #review .bd .n { color: #555; padding: 2px 0; }
  #review .bd .u { color: #999; padding: 1px 0; font-size: 11.5px; }
  #review table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  #review td, #review th { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eee; font-size: 12px; }
  #review th { font-size: 10.5px; letter-spacing: 1px; color: #888; }
  #review .ft { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #review .ft button, #review .ft select { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; }
  #review .ft .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  /* ---- AI dialog, command preview, toast ---- */
  #aiBox { position: fixed; inset: 0; background: rgba(10,12,16,.55); display: none; z-index: 55; align-items: center; justify-content: center; }
  #aiBox.show { display: flex; }
  #aiBox .card { background: #fff; border-radius: 12px; width: min(720px, 94vw); max-height: 90vh; overflow-y: auto; padding: 16px 18px;
                 box-shadow: 0 12px 40px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 8px; }
  #aiBox .aihd { display: flex; align-items: center; } #aiBox h2 { margin: 0; font-size: 17px; flex: 1; }
  #aiClose { background: none; border: none; font-size: 16px; cursor: pointer; color: #666; padding: 4px 8px; }
  #aiBox .ailbl { font-size: 12px; color: #555; }
  #aiBox textarea { font: inherit; font-size: 13px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; width: 100%; }
  #aiBox .airow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #aiBox button { font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 7px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  #aiBox button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #aiBox button:disabled { opacity: .45; cursor: not-allowed; }
  #aiBox details summary { font-size: 12.5px; color: var(--accent); cursor: pointer; padding: 3px 0; }
  #aiBox details textarea { margin: 6px 0; }
  .plan { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fafbfc; }
  .plan .sum { font-size: 13px; margin-bottom: 6px; }
  .plan .q { font-size: 12.5px; color: #6b4a00; background: #fff6e0; border-radius: 6px; padding: 5px 8px; margin: 4px 0; }
  .plan .ps { display: block; font-size: 12.5px; padding: 2px 0; }
  .plan .ps.ok { color: #1f5c2a; } .plan .ps.bad { color: var(--bad); }
  .plan .delta { font-size: 12px; color: #555; margin-top: 6px; }
  .plan .acts { display: flex; gap: 8px; margin-top: 10px; }
  #qaChips .plan { width: 100%; padding: 6px 8px; }
  #qaChips .plan .ps { font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #16181c; color: #eee; font-size: 13px;
           padding: 8px 14px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.35); display: none; z-index: 60; gap: 10px; align-items: center; }
  #toast.show { display: flex; }
  #toast button { background: none; border: 1px solid #555; color: #fff; border-radius: 6px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  /* ---- new job: rack starting points ---- */
  #starter { position: fixed; inset: 0; background: rgba(10,12,16,.55); display: none; z-index: 50; align-items: center; justify-content: center; }
  #starter.show { display: flex; }
  #starter .card { background: #fff; border-radius: 12px; width: min(760px, 94vw); max-height: 88vh; overflow-y: auto;
                   box-shadow: 0 12px 40px rgba(0,0,0,.35); padding: 18px 20px; }
  #starter h2 { margin: 0 0 2px; font-size: 18px; }
  #starter .s { font-size: 12.5px; color: #666; margin-bottom: 12px; }
  #starter .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  #starter .opt { text-align: left; font: inherit; background: #f8f9fb; border: 1px solid var(--line); border-radius: 10px;
                  padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  #starter .opt:hover { border-color: var(--accent); background: #f1f6fc; }
  #starter .opt b { font-size: 14px; }
  #starter .opt .bl { font-size: 12px; color: #555; }
  #starter .opt .gear { font-size: 11px; color: #777; line-height: 1.4; }
  #starter .ft { display: flex; justify-content: flex-end; margin-top: 12px; }
  #starter .ft button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
.rtab { width: 100%; border-collapse: collapse; font-size: 12px; }
.rtab th { text-align: left; font-weight: 600; color: var(--muted, #888); padding: 3px 4px; border-bottom: 1px solid rgba(128,128,128,.25); }
.rtab td { padding: 3px 4px; border-bottom: 1px solid rgba(128,128,128,.12); }
.rtab input { font-size: 12px; padding: 2px 4px; }
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">SIGNALPATH</span>
  <select id="jobsSel" title="Jobs"></select>
  <div class="menu" id="fileMenu"><button class="mbtn" aria-haspopup="true" aria-expanded="false">File ▾</button>
    <div class="mlist" role="menu" hidden>
      <button id="newJob" role="menuitem"><b>New job</b><span>Start from a rack: Savant, theater, MXNet, Dante or blank</span></button>
      <button id="importBtn" role="menuitem"><b>Import…</b><span>A SignalPath job (.json / AI .md), an AVWalk survey or a Blueprinted file</span></button>
      <hr>
      <button id="delJob" role="menuitem" class="danger"><b>Delete job</b><span>Removes this job from this browser</span></button>
    </div></div>
  <input id="jobName" title="Project name">
  <select id="solSel" title="Solution"></select>
  <select id="stageSel"><option value="proposal">PROPOSAL</option><option value="asBuilt">AS-BUILT</option></select>
  <button id="undoBtn" title="Undo the last change made by a command or the AI" style="display:none">↶ Undo</button>
  <button id="aiBtn" title="Describe a change — Claude proposes it, you preview and apply">✦ AI</button>
  <span class="spacer"></span>
  <span id="rulesChip" class="ok">✓</span>
  <div class="menu" id="viewMenu"><button class="mbtn" aria-haspopup="true" aria-expanded="false">View ▾</button>
    <div class="mlist" role="menu" hidden>
      <label class="chk"><input type="checkbox" id="hideNet"><span><b>Hide network</b><em>Drop the Cat6 network wires from the drawing</em></span></label>
      <label class="chk"><input type="checkbox" id="harnessMode"><span><b>Harness style</b><em>Saved with the job: runs to 3+ zones share one trunk and break out near each zone, like an electrical drawing</em></span></label>
      <label class="chk"><input type="checkbox" id="bwMode"><span><b>Black &amp; white</b><em>Dash patterns carry each signal, for office laser printers</em></span></label>
    </div></div>
  <input type="file" id="importFile" accept=".json,.md" hidden>
  <div class="menu" id="exportMenu"><button class="mbtn" aria-haspopup="true" aria-expanded="false">Export ▾</button>
    <div class="mlist right" role="menu" hidden>

<script type="module">
import { loadJob, validate, advise, place, route, render, effectiveJob, autoLinkCatalog, routeAlternates, lockCatalog, catalogDrift, refreshCatalogLock } from "./app/engine.js";
import { importAny, mergeHouse, drawFromWalk, decodeHandoff } from "./app/importers.js";
import { planQueueFiles, aiReviewMarkdown } from "./app/exports.js";
import { RACK_SIZES, DEFAULT_RACK_U } from "./app/rack.js";
import { specFor } from "./app/network.js";
import { renderExtraPages, sheetCount, sheetTotal, pageFlags, takeoffCSV, labelsCSV, rackFrontSVG, rackData } from "./app/pages.js";
import { parseQuick } from "./app/quickadd.js";
import { STARTERS, applyStarter } from "./app/starters.js";
import { planCommands, parseCommandText, vocabularyText, OPS } from "./app/commands.js";
import { askClaude, handoffPrompt, extractProposal, jobSummary, assess, loadConn, saveConn, connReady, MODELS } from "./app/ai.js";
import { setDanteAudio, danteAmpFor } from "./app/hookup.js";
import { readHookup, setVideo, setSpeakers, setReturn, setAudioBack, AUDIO_BACK, addRackDevice, autoHookup, nextFreeOutputs, outputsNeeded,
         VIDEO_FROM, SPEAKERS_FROM, RETURN_TO, RUNS } from "./app/hookup.js";
import { TYPE_NAME, SIGNAL_NAME, STATUS_NAME, SCOPE_NAME, SPEAKER_SETUP, REMOTE_NAME, PLATFORM_NAME, DISPLAY_NAME, AUDIO_NET_NAME,
         signalName, describeNode, humanizeWireIds, productName, productSku, ADAPTER, isOutdoorZone, ZONE_GROUPING_NAME } from "./app/names.js";

/* ============ IndexedDB jobs store ============ */
const DB = await new Promise((res, rej) => {
  const rq = indexedDB.open("signalpath", 1);
  rq.onupgradeneeded = () => rq.result.createObjectStore("jobs", { keyPath: "id" });
  rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
}).catch(e => { console.error("IndexedDB unavailable — falling back to in-memory store", e); return null; });
const MEM = new Map();                                     // session-only fallback (private mode, denied storage)
const tx = mode => DB.transaction("jobs", mode).objectStore("jobs");
const dbAllRaw = () => DB
  ? new Promise((r, j) => { const q = tx("readonly").getAll(); q.onsuccess = () => r(q.result); q.onerror = () => j(q.error); })
  : Promise.resolve([...MEM.values()]);
const dbAll = async () => (await dbAllRaw()).filter(r => r.id !== "__settings");
const dbPut = rec => DB
  ? new Promise((r, j) => { const q = tx("readwrite").put(rec); q.onsuccess = () => r(); q.onerror = () => j(q.error); })
  : (MEM.set(rec.id, rec), Promise.resolve());
const dbDel = id => DB
  ? new Promise((r, j) => { const q = tx("readwrite").delete(id); q.onsuccess = () => r(); q.onerror = () => j(q.error); })
  : (MEM.delete(id), Promise.resolve());

/* ============ settings + catalog (user-editable; catalog.json is the shipped seed) ============ */
const SHIPPED = await fetch("./app/catalog.json").then(r => r.json()).catch(() => ({ devices: {}, licensing: {} }));
let SETTINGS = { company: { name: "SYNERGY", tagline: "AUDIO VIDEO SYSTEMS",
  info: "300 El Camino Real · Tustin, CA 92780 · P: 714-505-2003 · www.synergy.tv" }, catalog: null };
{
  const rec = (await dbAllRaw()).find(r => r.id === "__settings");
  if (rec?.settings && typeof rec.settings === "object") {            // partial/corrupt stored settings must not brick boot
    SETTINGS = { ...SETTINGS, ...rec.settings };
    if (!SETTINGS.company || typeof SETTINGS.company !== "object") SETTINGS.company = { name: "SYNERGY", tagline: "", info: "" };
  }
  if (!SETTINGS.catalog || typeof SETTINGS.catalog !== "object") { SETTINGS.catalog = structuredClone(SHIPPED); CAT_SYNCED = syncShippedCatalog(); }
  else {
    if (!SETTINGS.catalog.devices || typeof SETTINGS.catalog.devices !== "object") SETTINGS.catalog.devices = {};
    CAT_SYNCED = syncShippedCatalog();
    // licensing tables too: a platform table missing from older stored settings
    // left its editor (and its advisor pick) broken
    SETTINGS.catalog.licensing = SETTINGS.catalog.licensing && typeof SETTINGS.catalog.licensing === "object" ? SETTINGS.catalog.licensing : {};
    for (const [plat, tbl] of Object.entries(SHIPPED.licensing || {}))
      if (!SETTINGS.catalog.licensing[plat]) SETTINGS.catalog.licensing[plat] = structuredClone(tbl);
  }
}
/* shipped catalog → this browser's catalog. New entries join; an entry the
   user never edited follows the shipped one (spec corrections must reach
   everyone); an edited entry is kept and listed as "differs from shipped".
   catalogBase remembers what was shipped when each entry was last taken, which
   is how "never edited" is known. Entries saved before catalogBase existed
   can't be told apart from edits — they're listed, never overwritten. */
function stableStr(v) {
  if (Array.isArray(v)) return "[" + v.map(stableStr).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stableStr(v[k])).join(",") + "}";
  return JSON.stringify(v);
}
var CAT_STALE, CAT_SYNCED;   // var, no initializer: the boot block above already set them
function takeShipped(id) {
  SETTINGS.catalog.devices[id] = structuredClone(SHIPPED.devices[id]);
  (SETTINGS.catalogBase ||= {})[id] = stableStr(SHIPPED.devices[id]);
}
function syncShippedCatalog() {
  const mine = SETTINGS.catalog.devices, base = (SETTINGS.catalogBase ||= {});
  let changed = false; CAT_STALE = [];
  for (const [id, d] of Object.entries(SHIPPED.devices || {})) {
    const ship = stableStr(d), cur = mine[id] ? stableStr(mine[id]) : null;
    if (cur === null) { takeShipped(id); changed = true; continue; }
    if (cur === ship) { if (base[id] !== ship) { base[id] = ship; changed = true; } continue; }
    if (base[id] && cur === base[id]) { takeShipped(id); changed = true; continue; }   // unedited → follow the shipped fix
    CAT_STALE.push(id);
  }
  if (SHIPPED.asOf && SETTINGS.catalog.asOf !== SHIPPED.asOf) { SETTINGS.catalog.asOf = SHIPPED.asOf; changed = true; }
  return changed;
}
const saveSettings = () => dbPut({ id: "__settings", updated: Date.now(), settings: SETTINGS });
if (CAT_SYNCED) await saveSettings();
/* job snapshot wins over the live catalog (old jobs advise identically forever) —
   field by field: a locked entry keeps every value it has, and only picks up
   fields it never had (rack height, watts, cords… added to the catalog later) */
function effectiveCatalog() {
  const snap = S.job?.job?.catalogSnapshot;
  const cat = structuredClone(SETTINGS.catalog);
  if (snap?.devices) for (const [id, e] of Object.entries(snap.devices)) cat.devices[id] = { ...(cat.devices[id] || {}), ...e };
  return cat;
}

/* ============ state ============ */
const S = { job: null, id: null, sol: 0, tab: "zones", openRows: new Set(), editScope: "house", undo: [] };
const uid = p => p + "-" + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);

function blankJob(name = "New Job") {
  return {
    generator: "SignalPath", schemaVersion: 1,
    job: { name, client: { name: "Customer Name", address: "Street, City, CA" }, stage: "proposal",
           drawnBy: "SignalPath", revisions: [{ rev: 1, date: new Date().toISOString().slice(0, 10), description: "Initial proposal", by: "SP" }],
           catalogSnapshot: { asOf: new Date().toISOString().slice(0, 10) } },
    house: { areas: [], zones: [] },
    solutions: [{ id: "sol-a", name: "Proposed System", videoDistribution: "hybrid", platforms: [], auxCounts: {},
                  racks: [{ id: "rack-main", name: "Equipment Rack", devices: [] }],
                  localDevices: [], companions: [], connections: [], annotations: [] }],
  };
}

/* ============ live pipeline ============ */
let saveTimer = null;
// a pending autosave belongs to the job that armed it: flush it before S moves
// to another job, and cancel it before a delete (an overdue timer firing
// mid-delete wrote the deleted job straight back)
async function flushSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; await persist(); } }
function cancelSave() { clearTimeout(saveTimer); saveTimer = null; }
function refresh(save = true) {
  const sol = S.job.solutions[S.sol] || S.job.solutions[0];
  S.sol = S.job.solutions.indexOf(sol);
  let v, a, svg = "", err, routeWarn = [], placeWarn = [];
  $("#harnessMode").checked = !!S.job.job.harnessStyle;     // a per-job drawing choice: follows job switches
  try {
    autoLinkCatalog(S.job, effectiveCatalog());                // self-heal: fill missing catalog links by model
    const { job, ix } = loadJob(effectiveJob(S.job, S.sol));   // active solution's overrides applied
    S.view = { job, ix };                                      // interactive sheet resolves names from here
    v = validate(job, ix); a = advise(job, ix, effectiveCatalog());
    // "1 of N" counts the continuation sheets a long schedule/map paginates into
    const opts = { solution: S.sol, hideSignals: $("#hideNet").checked ? ["network"] : [], grayscale: $("#bwMode").checked, company: SETTINGS.company,
                   sheet: `1 of ${sheetTotal(job, ix, a, { solution: S.sol, rawJob: S.job })}` };
    if (S.job.house.zones.length) {
      const p = place(job, ix, opts);
      const rt = route(job, ix, p, opts);
      svg = render(job, ix, p, rt, opts);
      routeWarn = rt.warnings; placeWarn = p.warnings || [];
      S.view.p = p; S.view.opts = opts;                        // reroute picker re-runs the router from these
    }
  } catch (e) { err = e; console.error(e); }

  $("#canvas").innerHTML = svg || `<div style="color:#888;padding:60px;text-align:center">Add a zone to start drawing${err ? "<br><small>" + esc(err.message) + "</small>" : ""}</div>`;
  hideTip(); applySel(); syncGlow();
  const activeSolId = S.job.solutions[S.sol]?.id;
  const mine = e => !e.solution || e.solution === activeSolId;   // advisor speaks for the ACTIVE solution only
  const errs = (v?.errors || []).filter(mine), warns = (v?.warnings || []).filter(mine);
  const chip = $("#rulesChip");
  if (err) { chip.className = "bad"; chip.textContent = "engine error"; }
  else if (errs.length) { chip.className = "bad"; chip.textContent = `✗ ${errs.length} issue${errs.length > 1 ? "s" : ""}`; }
  else { chip.className = "ok"; chip.textContent = `✓ valid${warns.length ? " · " + warns.length + "⚠" : ""}`; }

  const vsol = S.view?.job?.solutions[S.sol];
  const wname = t => S.view ? humanizeWireIds(S.view.job, vsol, t) : t;
  const adv = [];
  for (const e of errs) adv.push(`<div class="item e">✗ ${esc(e.msg)}</div>`);
  for (const w of warns) adv.push(`<div class="item w">⚠ ${esc(w.msg)}</div>`);
  // the router knows when a drawing is compromised — say so instead of leaving
  // a wire through a box unexplained
  for (const w of routeWarn.filter(w => w.code === "unrouted")) adv.push(`<div class="item e">✗ Wire not drawn: ${esc(wname(w.msg).replace(/^no route class for /, ""))}</div>`);
  const fb = routeWarn.filter(w => w.code === "route-fallback").map(w => wname(w.msg));
  if (fb.length) adv.push(`<div class="item w">⚠ ${fb.length} wire${fb.length > 1 ? "s have" : " has"} no clean path on this layout — drawn best-effort and may cross gear: ${esc(fb.slice(0, 4).join("; "))}${fb.length > 4 ? "…" : ""}</div>`);
  for (const w of new Map(routeWarn.filter(w => w.code === "hint-unroutable").map(w => [w.msg, w])).values()) adv.push(`<div class="item w">⚠ The custom route for ${esc(wname(w.msg))} can't be drawn on this layout — routed automatically</div>`);
  for (const w of placeWarn) adv.push(`<div class="item w">⚠ ${esc(w.msg)}</div>`);
  const drift = catalogDrift(S.job, SETTINGS.catalog);
  if (drift.length) adv.push(`<div class="item i">📦 The catalog has newer specs for ${drift.length} device${drift.length > 1 ? "s" : ""} on this job (${esc(drift.slice(0, 3).map(d => d.model).join(", "))}${drift.length > 3 ? "…" : ""}) — this job still uses the specs it was quoted with. JOB tab → Update catalog specs.</div>`);
  for (const io of (a?.io || []).filter(mine)) {
    if (io.over) adv.push(`<div class="item e">✗ ${esc(io.msg)}</div>`);
    else if (io.msg && (io.kind === "analog-in" || io.kind === "audio-out" || io.kind === "return-in")) adv.push(`<div class="item i">🔌 ${esc(io.msg)}</div>`);
  }
  for (const amp of (a?.amps || []).filter(mine)) adv.push(`<div class="item i">🔊 ${esc(amp.model || amp.amp)}: ${amp.zonesTotal != null ? `${amp.zonesUsed}/${amp.zonesTotal} zones` : `${amp.zonesUsed} zone${amp.zonesUsed === 1 ? "" : "s"}`}${amp.reserved ? ` (${amp.reserved} reserved)` : ""}${amp.spare != null ? ` · ${amp.spare} spare` : ""}</div>`);
  for (const lic of (a?.licensing || []).filter(mine)) {
    adv.push(`<div class="item i">🎛 <b>${esc(PLATFORM_NAME[lic.platform] || lic.platform)}</b> → ${esc(lic.pick)} · ${lic.lines.map(esc).join(" · ")}</div>`);
    for (const w of lic.warns || []) adv.push(`<div class="item w">⚠ ${esc(PLATFORM_NAME[lic.platform] || lic.platform)}: ${esc(w)}</div>`);
  }
  for (const n of (a?.notes || []).filter(mine)) adv.push(n.code === "earc-extender" ? `<div class="item w">⚠ ${esc(n.msg)}</div>`
    : `<div class="item i">${n.code === "avb-switch" || n.code === "sonos-net" ? "🌐" : "🎛"} ${esc(n.msg)}</div>`);
  $("#advisor").innerHTML = adv.join("") || `<div class="item ok">✓ No issues</div>`;

  S.findings = collectFindings(errs, warns, a, mine);
  // the advisor's port counts (a trunk can carry several channels) win over counting rows
  S.ioByDev = new Map();
  for (const io of (a?.io || []).filter(mine)) (S.ioByDev.get(io.device) ?? S.ioByDev.set(io.device, {}).get(io.device))[io.kind] = io;   // each finding also shows on its own zone / box row
  renderTopbar();
  renderPanel();
  if (save) { clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; persist(); }, 400); }
}
/* findings → the row they belong to: zones by the endpoint / adapter / in-zone
   gear they name (`ref`), boxes by device id (validator refs, port budgets) */
function collectFindings(errs, warns, a, mine) {
  const byZone = new Map(), byDev = new Map();
  const ix = S.view?.ix, sol = S.view?.job?.solutions[S.sol];
  const push = (m, k, level, msg) => { if (k == null) return; (m.get(k) ?? m.set(k, []).get(k)).push({ level, msg }); };
  const zoneOfRef = ref => {
    if (!ix || ref == null) return null;
    if (ix.zonesById[ref]) return ref;
    if (ix.endpointZone[ref]) return ix.endpointZone[ref];
    const comp = (sol?.companions || []).find(c => c.id === ref); if (comp) return ix.endpointZone[comp.serves] || null;
    return (sol?.localDevices || []).find(d => d.id === ref)?.zone || null;
  };
  const isDev = ref => (sol?.racks || []).some(r => r.devices.some(d => d.id === ref));
  for (const [list, level] of [[errs, "e"], [warns, "w"]])
    for (const f of list) isDev(f.ref) ? push(byDev, f.ref, level, f.msg) : push(byZone, zoneOfRef(f.ref), level, f.msg);
  for (const n of a?.notes || []) if (n.code === "earc-extender" && mine(n)) push(byZone, zoneOfRef(n.ref), "w", n.msg);
  for (const io of a?.io || []) if (io.over && mine(io)) push(byDev, io.device, "e", io.msg);
  return { byZone, byDev };
}
const statusMark = (list, wired) => {
  const lvl = list?.some(f => f.level === "e") ? "e" : list?.length ? "w" : wired ? "ok" : "none";
  return `<span class="st ${lvl}" aria-label="${lvl === "e" ? "Has a problem" : lvl === "w" ? "Needs attention" : lvl === "ok" ? "Done" : "Not set up"}">${lvl === "e" ? "!" : lvl === "w" ? "!" : lvl === "ok" ? "✓" : ""}</span>`;
};

let saveWarned = false;
async function persist() {
  try {
    // lockfile: freeze the catalog entries this job uses the first time they're
    // saved — later saves never overwrite them (JOB tab → Update catalog specs)
    lockCatalog(S.job, SETTINGS.catalog);
    await dbPut({ id: S.id, updated: Date.now(), data: S.job });
    await renderJobsSel();
    if (!DB && !saveWarned) { saveWarned = true; alert("Heads up: browser storage is unavailable, so autosave only lasts for this tab. Use Export JSON to keep your work."); }
  } catch (e) {
    console.error("autosave failed", e);
    if (!saveWarned) { saveWarned = true; alert("Autosave failed (storage error). Your work is only in this tab — use Export JSON to keep it."); }
  }
}
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? u : "#";   // external links only ever from the kit manifest

/* ============ top bar ============ */
function renderTopbar() {
  $("#jobName").value = S.job.job.name || "";
  $("#stageSel").value = (S.job.job.stage || "proposal") === "asBuilt" ? "asBuilt" : "proposal";
  const sel = $("#solSel");
  sel.innerHTML = S.job.solutions.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join("") + `<option value="__add">＋ new solution…</option>`;
  sel.value = String(S.sol);
  syncUndo();
}
async function renderJobsSel() {
  const jobs = (await dbAll()).sort((a, b) => b.updated - a.updated);
  $("#jobsSel").innerHTML = jobs.map(j => `<option value="${j.id}">${esc(j.data.job.name)}</option>`).join("") +
    `<optgroup label="Samples"><option value="__residence">Sample Residence</option><option value="__estate">Sample Estate</option><option value="__stress">Stress (25 zones)</option></optgroup>`;
  $("#jobsSel").value = S.id;
}

$("#jobName").onchange = e => { S.job.job.name = e.target.value; refresh(); };
$("#stageSel").onchange = e => { S.job.job.stage = e.target.value; refresh(); };
$("#hideNet").onchange = () => refresh(false);
$("#bwMode").onchange = () => refresh(false);
$("#harnessMode").onchange = e => { if (e.target.checked) S.job.job.harnessStyle = true; else delete S.job.job.harnessStyle; refresh(); };
$("#solSel").onchange = e => {

  } else S.sol = +e.target.value;
  refresh();
};
// new job: pick a rack starting point (or blank); quick-add then wires zones to it
/* top-bar menus: one open at a time; picking an action closes it (View's checkboxes stay open) */
const menus = [...document.querySelectorAll("#topbar .menu")];
const closeMenus = except => menus.forEach(m => { if (m === except) return; m.querySelector(".mlist").hidden = true; m.querySelector(".mbtn").setAttribute("aria-expanded", "false"); });
menus.forEach(m => {
  const btn = m.querySelector(".mbtn"), list = m.querySelector(".mlist");
  btn.onclick = e => { e.stopPropagation(); const open = list.hidden; closeMenus(m); list.hidden = !open; btn.setAttribute("aria-expanded", String(open)); };
  list.addEventListener("click", e => { if (e.target.closest("button")) closeMenus(); else e.stopPropagation(); });
});

document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });

$("#newJob").onclick = () => {
  const cat = SETTINGS.catalog;

function pushUndo(label) {

  if (S.undo.length > 30) S.undo.shift();

// undo belongs to the job it was recorded on — switching jobs hides it
function syncUndo() {
  const top = S.undo[S.undo.length - 1], b = $("#undoBtn");
  b.style.display = top && top.id === S.id ? "" : "none";
  if (top) b.title = `Undo: ${top.label}`;
}
function undo() {
  const top = S.undo[S.undo.length - 1];
  if (!top || top.id !== S.id) return;
  S.undo.pop(); S.job = top.job; S.sol = top.sol;
  refresh(); toast(`Undone: ${top.label}`);
}

addEventListener("keydown", e => {

    const top = S.undo[S.undo.length - 1];

/* ---- guided rerouting: pick from legal alternate routes for the selected wire ---- */
let ALTS = null;
// two connections can share from→to (video + audio to one AVR): match the signal too
const connOf = (wid, signal) => { const [f, t] = String(wid).split("→");
  return (S.job.solutions[S.sol].connections || []).find(c => c.from === f && c.to === t && (!signal || c.signal === signal)); };
const selSignal = () => $("#canvas svg")?.querySelector(`path.wire[data-wire="${CSS.escape(selWire || "")}"]`)?.dataset.signal;
const clearGhosts = () => { $("#canvas svg")?.querySelector("#altghost")?.remove(); ALTS = null; };
function startReroute(x, y) {
  const svg = $("#canvas svg");
  if (!selWire || !S.view?.p || !svg) return;
  clearGhosts();
  const list = routeAlternates(S.view.job, S.view.ix, S.view.p, S.view.opts, selWire);
  ALTS = Object.assign(list, { wid: selWire });   // bound to THIS wire — a stale ghost can't retarget another
  if (ALTS.length <= 1) { showTip(x, y, `<b>${esc(selWire)}</b><div class="mini">No other legal route exists for this wire on this layout — every alternate either crosses gear or lands where Auto already does.</div>`); return; }
  const NS = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(NS, "g"); g.id = "altghost";
  ALTS.forEach((a, i) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", a.d); p.setAttribute("class", "altpath"); p.dataset.alt = i;
    g.appendChild(p);
    const [bx, by] = a.pts[Math.min(1, a.pts.length - 1)];
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", bx); c.setAttribute("cy", by); c.setAttribute("r", 9);
    c.setAttribute("class", "altbub"); c.dataset.alt = i;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", bx); t.setAttribute("y", by + 3.5); t.setAttribute("class", "altnum"); t.dataset.alt = i;
    t.setAttribute("text-anchor", "middle"); t.textContent = i + 1;
    g.appendChild(c); g.appendChild(t);
  });
  // ghosts live in the wires' own drawing group (translate + fitScale), or
  // they draw offset — badly so on large, scaled-down sheets
  const host = svg.querySelector(`path.wire[data-wire="${CSS.escape(selWire)}"]`)?.parentNode || svg;
  host.appendChild(g);
  showTip(x, y, `<b>Pick a route</b> <span class="mini">— tap a dashed path or a line below</span>` +
    ALTS.map((a, i) => `<div class="altrow" data-alt="${i}">${i + 1} · ${esc(a.label)} <span class="mini">(${a.crossings} crossing${a.crossings === 1 ? "" : "s"} on the sheet)</span></div>`).join(""));
}
function applyAlt(i) {
  const a = ALTS?.[i]; if (!a || ALTS.wid !== selWire) { clearGhosts(); return; }
  const conn = connOf(selWire, selSignal()); if (!conn) return;
  if (a.hint) conn.routeHint = a.hint; else delete conn.routeHint;
  clearSel(); refresh();
}

  if (e.target.closest("#rrGo")) { startReroute(tipAt.x, tipAt.y); return; }
  if (e.target.closest("#ceGo")) { openConn(selWire, selSignal()); return; }
  if (e.target.closest("#zhGo")) { const z = wireZone(selWire, selSignal()); hideTip(); if (z) openHookup(z); return; }
  const row = e.target.closest(".altrow");
  if (row) applyAlt(+row.dataset.alt);
});

function syncGlow() {
  const svg = $("#canvas svg"); if (!svg) return;
  svg.querySelectorAll("g.zglow").forEach(g => g.classList.remove("zglow"));
  if (S.tab !== "zones") return;
  for (const id of S.openRows) svg.querySelector(`[data-zone="${CSS.escape(id)}"]`)?.classList.add("zglow");
}

function switchTab(tab) {
  S.tab = tab;
  $("#panel").classList.remove("collapsed");
  document.querySelectorAll(".tabs button[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
}
function flashRow(sel) {
  const row = $("#panelBody").querySelector(sel);
  if (!row) return;
  row.scrollIntoView({ block: "center", behavior: "smooth" });
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1300);
}
function openZone(zid) { focusRows(zid); switchTab("zones"); renderPanel(); flashRow(`[data-zid="${CSS.escape(zid)}"]`); syncGlow(); }
/* sheet → panel: a tapped wire opens its connection row (GEAR) or its zone's
   HOOKUP; the wire stays selected so the edit is visible as it happens */
function connIndex(wid, signal) {
  const c = connOf(wid, signal);
  return c ? S.job.solutions[S.sol].connections.indexOf(c) : -1;
}
function openConn(wid, signal) {
  const i = connIndex(wid, signal); if (i < 0) return;
  hideTip(); clearGhosts();
  const sol = S.job.solutions[S.sol], c = sol.connections[i];
  // its home: the box it leaves (outputs), else the box it enters (inputs),
  // else JOB's full list (e.g. balun → TV)
  const home = isRackDev(sol, c.from) ? c.from : isRackDev(sol, c.to) ? c.to : null;
  focusRows(home);
  S.openRows.add(`conn:${i}@${home || "job"}`);
  const wasCollapsed = $("#panel").classList.contains("collapsed");
  switchTab(home ? "gear" : "job"); renderPanel();
  // scroll after the panel finishes opening, or it measures a moving layout
  setTimeout(() => flashRow(home ? `[data-did="${CSS.escape(home)}"] [data-ci="${i}"]` : `#connList [data-ci="${i}"]`), wasCollapsed ? 350 : 30);
}
// focus: what you tapped is the one open thing (other zones/boxes/connections close)
function focusRows(keep) {
  const zones = new Set(S.job.house.zones.map(z => z.id));
  const devs = new Set(S.job.solutions[S.sol].racks.flatMap(r => r.devices.map(d => d.id)));
  for (const k of [...S.openRows]) if (k.startsWith("conn:") || ((zones.has(k) || devs.has(k)) && k !== keep)) S.openRows.delete(k);
  if (keep) S.openRows.add(keep);
}
// the zone a wire serves: its far end (or near end, for a return), through any adapter
function wireZone(wid, signal) {
  const v = S.view; if (!v) return null;
  const [f, t] = String(wid).split("→");
  const sol = v.job.solutions[S.sol] || v.job.solutions[0];
  const zoneFor = id => v.ix.endpointZone[id] || v.ix.endpointZone[(sol.companions || []).find(c => c.id === id)?.serves] ||
    (sol.localDevices || []).find(d => d.id === id)?.zone || null;
  return zoneFor(t) || zoneFor(f);
}
function openHookup(zid) {
  const wasCollapsed = $("#panel").classList.contains("collapsed");
  focusRows(zid); switchTab("zones"); renderPanel(); syncGlow();
  setTimeout(() => {
  const sect = [...$("#panelBody").querySelectorAll(`[data-zid="${CSS.escape(zid)}"] .sect`)].find(x => x.textContent.startsWith("HOOKUP"));
  (sect || $("#panelBody").querySelector(`[data-zid="${CSS.escape(zid)}"]`))?.scrollIntoView({ block: "start", behavior: "smooth" });
  const row = $("#panelBody").querySelector(`[data-zid="${CSS.escape(zid)}"]`);
  row?.classList.add("flash"); setTimeout(() => row?.classList.remove("flash"), 1300);
  }, wasCollapsed ? 350 : 30);
}
function openGear(did) { focusRows(did); switchTab("gear"); renderPanel(); flashRow(`[data-did="${CSS.escape(did)}"]`); syncGlow(); }

$("#canvas").addEventListener("click", e => {
  if (!$("#canvas svg")) return;
  // ghost alternates (reroute picker) swallow the tap
  const alt = e.target.closest(".altpath, .altbub, .altnum");
  if (alt) { applyAlt(+alt.dataset.alt); return; }
  // wires first (their fat hit-twins sit on top); overlapping bundles cycle per tap
  const ids = [...new Set(document.elementsFromPoint(e.clientX, e.clientY)
    .filter(el => el.classList?.contains("wirehit") || el.classList?.contains("wire"))
    .map(el => el.dataset.wire))];
  if (ids.length) {
    const idx = ids.indexOf(selWire);
    if (idx !== -1 && ids.length === 1) { clearSel(); return; }
    clearGhosts();   // a new selection retires the previous wire's picker
    selWire = ids[(idx + 1) % ids.length];
    applySel();
    const p = $("#canvas svg").querySelector(`path.wire[data-wire="${CSS.escape(selWire)}"]`);
    showTip(e.clientX, e.clientY,
      `<b>${esc(nodeName(p.dataset.from))}</b> → <b>${esc(nodeName(p.dataset.to))}</b> · ${esc(signalName(p.dataset.signal))}${connOf(selWire, p.dataset.signal)?.routeHint ? ' · <span class="mini">custom route</span>' : ""}${ids.length > 1 ? ` <span class="mini">(${idx + 2 > ids.length ? 1 : idx + 2}/${ids.length} here — tap to cycle)</span>` : ""}` +
      `<div id="rrGo" class="altrow">⟲ Reroute…</div>` +
      `<div id="ceGo" class="altrow">✎ Edit connection — change what it connects</div>` +
      (wireZone(selWire, p.dataset.signal) ? `<div id="zhGo" class="altrow">⚙ ${esc(S.view.ix.zonesById[wireZone(selWire, p.dataset.signal)]?.name || "Zone")} hookup</div>` : ""));
    return;
  }
  const dev = e.target.closest("[data-device]");
  if (dev) { clearSel(); openGear(dev.dataset.device); return; }
  const zc = e.target.closest("[data-zone]");
  if (zc) { clearSel(); openZone(zc.dataset.zone); return; }
  clearSel();
});

/* ============ panel ============ */
document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;

  renderPanel();

});
// the panel's width is the viewer's own preference (per browser); collapsing
// drops the inline width so the collapsed rule wins, and expanding restores it
let panelW = 360;
try { panelW = Math.min(640, Math.max(280, +localStorage.getItem("signalpath.panelW") || 360)); } catch {}
$("#panel").style.width = panelW + "px";
$("#collapse").onclick = () => {
  const p = $("#panel");
  p.classList.toggle("collapsed");
  p.style.width = p.classList.contains("collapsed") ? "" : panelW + "px";
  $("#collapse").textContent = p.classList.contains("collapsed") ? "⟩⟩" : "⟨⟨";
};
$("#grip").onpointerdown = e => {
  const p = $("#panel"); if (p.classList.contains("collapsed")) return;
  e.preventDefault();
  const x0 = e.clientX, w0 = p.getBoundingClientRect().width, g = $("#grip");
  g.classList.add("drag"); p.style.transition = "none";
  const move = ev => { panelW = Math.round(Math.min(640, Math.max(280, w0 + ev.clientX - x0))); p.style.width = panelW + "px"; };
  const up = () => {
    g.classList.remove("drag"); p.style.transition = "";
    removeEventListener("pointermove", move); removeEventListener("pointerup", up);
    try { localStorage.setItem("signalpath.panelW", String(panelW)); } catch {}
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
};

const SPK_CONFIGS = ["none", "mono", "stereo", "2.1", "surround-5.1", "surround-7.1", "soundbar", "soundbar-sub", "landscape"];
const STATUSES = ["new", "ofe", "prewire"];
const DEV_TYPES = ["source", "avr", "amp", "videoMatrix", "avSwitch", "avbSwitch", "audioInputModule", "audioOutputModule", "controlBox", "splitter", "host", "networkSwitch", "gateway", "danteBridge", "power"];
const SIGNALS = ["video", "audio", "speaker", "network", "audioReturn"];

/* every word shown for a stored value comes from app/names.js (the one
   vocabulary the sheet, print pages and advisor also use) */
const DEV_TYPE_LABEL = TYPE_NAME, SIGNAL_LABEL = SIGNAL_NAME, SCOPE_LABEL = SCOPE_NAME, STATUS_LABEL = STATUS_NAME,
      SPK_LABEL = SPEAKER_SETUP, REMOTE_LABEL = REMOTE_NAME, PLATFORM_LABEL = PLATFORM_NAME;

function field(label, inner) { return `<div class="f"><label>${label}</label>${inner}</div>`; }
// small fixed choices are taps, not dropdowns
const chips = (act, opts, cur) => `<div class="chips">${opts.map(([v, l]) =>
  `<button type="button" class="chip${String(v) === String(cur) ? " on" : ""}" data-act="${esc(act)}" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(l)}</button>`).join("")}</div>`;
const ZSPK = [["none", "None"], ["mono", "Mono"], ["stereo", "Stereo"], ["2.1", "2.1"], ["surround-5.1", "5.1"], ["surround-7.1", "7.1"],
              ["soundbar", "Soundbar"], ["soundbar-sub", "Bar + sub"], ["landscape", "Landscape"]];
const ZTV = [["none", "None"], ["tv", "TV"], ["projector", "Projector"]];
const sel = (cls, opts, val, labels = {}) => `<select class="${cls}">${opts.map(o =>
  `<option value="${esc(o)}" ${o === val ? "selected" : ""}>${esc(labels[o] ?? o)}</option>`).join("")}</select>`;

// connection ends in words — the editor reads the raw job it's editing
const nodeInfo = id => describeNode(S.job, S.job.solutions[S.sol] || S.job.solutions[0], id);
function nodeSel(cls, val) {
  const groups = new Map();
  for (const id of allNodes()) { const n = nodeInfo(id); (groups.get(n.group) ?? groups.set(n.group, []).get(n.group)).push([id, n.label]); }
  if (val && !allNodes().includes(val)) groups.set("Missing", [[val, nodeInfo(val).label]]);
  return `<select class="${cls}">${[...groups].map(([g, list]) => `<optgroup label="${esc(g)}">${list.map(([id, l]) =>
    `<option value="${esc(id)}" ${id === val ? "selected" : ""}>${esc(l)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}
// the signal a pair of ends almost certainly carries — used when the user
// re-points a connection so "Speaker wire" follows a switch to a TV, etc.
function suggestSignal(from, to) {
  const f = nodeInfo(from), t = nodeInfo(to);
  if (t.kind === "speakers") return "speaker";
  if (f.kind === "display" || f.kind === "local" && t.kind === "rack") return "audioReturn";
  if (t.kind === "display" || t.kind === "adapter" || f.kind === "adapter") return "video";
  if (t.type === "avbSwitch" || f.type === "avbSwitch") return "network";
  if (t.type === "audioInputModule" || f.type === "audioOutputModule") return "audio";
  return null;
}

/* House objects are shared by every solution — removing an endpoint or zone
   must clean ALL of them (connections, the chips serving it and the wires
   into those chips, locals seated in the zone, overrides), or the other
   solutions keep dangling "connection to missing node" errors */
function purgeHouseRefs(epIds, zoneId = null) {
  const eps = new Set(epIds);
  for (const so of S.job.solutions) {
    const locals = new Set((so.localDevices || []).filter(d => zoneId && d.zone === zoneId).map(d => d.id));
    const chips = new Set((so.companions || []).filter(c => eps.has(c.serves)).map(c => c.id));
    const gone = id => eps.has(id) || chips.has(id) || locals.has(id);
    so.connections = (so.connections || []).filter(c => !gone(c.from) && !gone(c.to));
    so.companions = (so.companions || []).filter(c => !chips.has(c.id));
    so.localDevices = (so.localDevices || []).filter(d => !locals.has(d.id));
    so.annotations = (so.annotations || []).filter(a => !zoneId || a.near !== zoneId);
    if (so.overrides?.zones && zoneId) delete so.overrides.zones[zoneId];
    if (so.overrides?.endpoints) for (const eid of eps) delete so.overrides.endpoints[eid];
  }
}

function renderPanel() {
  const body = $("#panelBody");
  if (S.tab === "zones") body.innerHTML = zonesHTML();
  else if (S.tab === "gear") body.innerHTML = gearHTML();
  else if (S.tab === "settings") body.innerHTML = settingsHTML();
  else if (S.tab === "rack") body.innerHTML = rackHTML();
  else body.innerHTML = jobHTML();
  wirePanel(body);
  if (S.tab === "settings") wireSettings(body);
}

function zonesHTML() {
  const sol = S.job.solutions[S.sol] || S.job.solutions[0];
  const ov = sol?.overrides || {};
  const multi = S.job.solutions.length > 1;
  const scopeSol = multi && S.editScope === "sol";
  const escope = multi ? `<div id="escope"><span class="t">EDITS APPLY TO</span>
    <label><input type="radio" name="escope" value="house" ${scopeSol ? "" : "checked"}> House (all)</label>
    <label><input type="radio" name="escope" value="sol" ${scopeSol ? "checked" : ""}> ${esc(sol.name)} only</label>
    <span class="mini" title="Zone names and adding/removing zones, speakers or displays always edit the House.">ⓘ</span></div>` : "";
  const qa = `<div id="qa">
    <div class="line"><input id="qaInput" placeholder="${esc(S.qaHint || "family room 5.1 75 sony matrix")}…" autocomplete="off">

    <div id="qaChips"></div>
    <div class="ex">new zones: name + setup (5.1, stereo, 2.1, soundbar, landscape 8) + TV size + brand · "matrix" / "avr" wires it · "ofe" "prewire" · comma = next zone<br>
      changes: "connect cable box to mrx" · "kitchen, office to amp 2" · "family room from the receiver" · "patio 75 ofe" · "master optical backup" · "add an mrx 1140"</div>
  </div>`;
  const ovHas = (kind, id, f) => ov[kind]?.[id] != null && f in ov[kind][id];
  const fieldO = (label, inner, kind, id, f) => {
    const has = ovHas(kind, id, f);
    return `<div class="f${has ? " ov" : ""}"><label>${label}${has ? `<button class="ovx" data-ovk="${esc(kind)}" data-ovid="${esc(id)}" data-ovf="${esc(f)}" title="Overridden in ${esc(sol.name)} — revert to House">×</button>` : ""}</label>${inner}</div>`;
  };
  const rows = S.job.house.zones.map(z => {
    const spkH = (z.endpoints || []).find(e => e.type === "speakers");
    const tvH = (z.endpoints || []).find(e => e.type === "display");
    const spk = spkH && { ...spkH, ...(ov.endpoints || {})[spkH.id] };
    const tv = tvH && { ...tvH, ...(ov.endpoints || {})[tvH.id] };
    const zEff = { ...z, ...(ov.zones || {})[z.id] };
    const open = S.openRows.has(z.id);
    const found = S.findings?.byZone.get(z.id) || [];
    const h = readHookup(S.job, sol, z);
    const wired = (!h.tv || h.video) && (!h.spk || h.speakers) && (h.tv || h.spk);
    // closed, a row answers "what is it, what feeds it, is it done?"
    const what = [spk && (SPEAKER_SETUP[spk.config || "stereo"] || spk.config),
                  tv && `${tv.size || "?"}" ${tv.displayType === "projector" ? "projector" : "TV"}${tv.brand ? " " + tv.brand : ""}`].filter(Boolean).join(" + ") || "Nothing in this zone yet";
    // inside the zone's own row, "Apple TV in Patio" is just "Apple TV (in zone)"
    const short = id => id ? describeNode(S.job, sol, id).short.replace(` in ${z.name}`, " (in zone)") : null;
    let feed = "";
    if (h.video?.from && h.video.from === h.speakers?.from) feed = `${short(h.video.from)} → TV + speakers`;
    else feed = [h.tv && h.video?.from && `TV ← ${short(h.video.from)}`,
                 h.spk && h.speakers?.from && `speakers ← ${short(h.speakers.from)}${h.speakers.channels ? " " + h.speakers.channels : ""}`].filter(Boolean).join(" · ");
    if (h.earc) feed += h.ret ? " · eARC + optical backup" : " · eARC"; else if (h.ret) feed += " · optical back";
    const issue = found.find(f => f.level === "e") || found[0];
    const head = `<div class="head zhead" data-toggle="${esc(z.id)}">${statusMark(found, wired)}
      <div class="zmain"><div class="zt"><span class="t">${esc(z.name)}</span>
        ${zEff.scope !== "included" ? `<span class="badge${ovHas("zones", z.id, "scope") ? " ovb" : ""}">${esc(SCOPE_NAME[zEff.scope] || zEff.scope)}</span>` : ""}</div>
        <div class="zsum">${esc(what)}${feed ? ` · ${esc(feed)}` : ""}</div>
        ${issue && !open ? `<div class="ziss ${issue.level}">${esc(issue.msg)}${found.length > 1 ? ` <span class="mini">(+${found.length - 1} more)</span>` : ""}</div>` : ""}</div></div>`;
    // open: the essentials as taps; the rarely-touched fields behind "More"
    const spkCfg = spk ? spk.config || "stereo" : "none";

    return `<div class="row ${open ? "open" : ""}" data-zid="${esc(z.id)}">${head}

        ${spk ? fieldO("Speakers", chips("spkcfg", ZSPK, spkCfg), "endpoints", spkH.id, "config") : field("Speakers", chips("spkcfg", ZSPK, spkCfg))}
        ${tv ? fieldO("Display", chips("tvtype", ZTV, tvType), "endpoints", tvH.id, "displayType") : field("Display", chips("tvtype", ZTV, tvType))}
        ${tv ? fieldO("Size", `<input class="tvsize" type="number" min="24" max="220" value="${esc(tv.size || 65)}">${chips("tvsize", [55, 65, 75, 85, 98].map(n => [String(n), n + '"']), String(tv.size))}`, "endpoints", tvH.id, "size") : ""}
        ${tv ? fieldO("Brand", `<input class="tvbrand" value="${esc(tv.brand || "")}" placeholder="e.g. Sony">`, "endpoints", tvH.id, "brand") : ""}

          ${field("Name", `<input class="zname" value="${esc(z.name)}">`)}
          ${fieldO("Scope", chips("zscope", ["included", "prewire", "future"].map(k => [k, SCOPE_LABEL[k]]), zEff.scope || "included"), "zones", z.id, "scope")}
          ${fieldO("Remote", sel("zremote", ["none", "savant", "appletv", "josh", "factory"], zEff.remote || "none", REMOTE_LABEL), "zones", z.id, "remote")}
          ${field("Outdoor", sel("zoutdoor", ["auto", "yes", "no"], typeof z.outdoor === "boolean" ? (z.outdoor ? "yes" : "no") : "auto",
            { auto: `Auto (${isOutdoorZone({ ...z, outdoor: undefined }) ? "outdoor" : "indoor"})`, yes: "Outdoor", no: "Indoor" }))}
          ${(S.job.house.areas || []).length ? field("Area", sel("zarea", ["", ...S.job.house.areas.map(a => a.id)], z.area || "")) : ""}
          ${spk && !/^(surround|soundbar)/.test(spk.config || "") ? fieldO("Spk count", `<input class="spkcount" type="number" min="1" max="12" value="${esc(spk.count || 2)}">`, "endpoints", spkH.id, "count") : ""}
          ${spk ? fieldO("Speakers are", chips("spkstatus", STATUSES.map(k => [k, STATUS_LABEL[k]]), spk.status || "new"), "endpoints", spkH.id, "status") : ""}
          ${tv ? fieldO("TV is", chips("tvstatus", STATUSES.slice(0, 2).map(k => [k, STATUS_LABEL[k]]), tv.status || "new"), "endpoints", tvH.id, "status") : ""}
          ${tv ? field("Confirm", `<input type="checkbox" class="tvconfirm" ${tvH.confirm?.length ? "checked" : ""}> <span class="mini">size needs confirmation</span>`) : ""}
          <div style="text-align:right"><button class="del zdel">delete zone</button></div>
        </details>
      </div>
    </div>`;
  }).join("");
  return escope + qa + rows + `<button class="addbtn" id="addZone">＋ Add zone</button>`;

/* HOOKUP: what feeds this zone — the TV's video (and how it gets there), the
   speakers' drive, the TV's audio back. Writes ordinary connections for the
   active solution (app/hookup.js); the GEAR tab's list shows the result. */
function hookupHTML(z, sol, multi) {
  const h = readHookup(S.job, sol, z);
  if (!h.tv && !h.spk) return "";
  const devs = sol.racks.flatMap(r => r.devices);
  const nm = id => describeNode(S.job, sol, id).label;
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label)}</option>`;
  const devOpts = (types, cur) => devs.filter(d => types.includes(d.type))
    .sort((a, b) => types.indexOf(a.type) - types.indexOf(b.type)).map(d => opt(d.id, nm(d.id), cur)).join("");
  const locals = (sol.localDevices || []).filter(d => d.zone === z.id);
  const rows = [];
  const byDev = id => devs.find(d => d.id === id);
  if (h.tv) {
    const cur = h.video?.from || "";
    rows.push(field("TV video", `<select class="hvfrom">${opt("", "— not connected —", cur)}
      <optgroup label="In the rack">${devOpts(VIDEO_FROM, cur)}</optgroup>
      ${locals.length ? `<optgroup label="In this zone">${locals.map(d => opt(d.id, nm(d.id), cur)).join("")}</optgroup>` : ""}
      <optgroup label="Add">${opt("__new_avr", "＋ New AV receiver…", "")}</optgroup></select>`));
    if (byDev(cur)) rows.push(field("Run to TV", chips("hvrun", Object.entries(RUNS), h.video.run)));
  }
  if (h.spk) {
    const cur = h.speakers?.from || "";
    rows.push(field("Speakers", `<select class="hsfrom">${opt("", "— not connected —", cur)}
      <optgroup label="In the rack">${devOpts(SPEAKERS_FROM, cur)}</optgroup>
      <optgroup label="Add">${opt("__new_avr", "＋ New AV receiver…", "")}${opt("__new_amp", "＋ New multi-zone amp…", "")}</optgroup></select>`));
    if (byDev(cur)?.type === "amp")
      rows.push(field("Amp outputs", `<input class="hsch" value="${esc(h.speakers.channels || "")}" placeholder="e.g. ${esc(nextFreeOutputs(sol, cur, outputsNeeded(h.spk) || 2, h.spk.id))}">`));
  }
  if (h.tv) {
    // eARC rides the receiver's HDMI (default); optical is a pulled Toslink run,
    // alone or as a backup — only offered where it can exist
    const rcv = byDev(h.video?.from)?.type === "avr" ? byDev(h.video.from) : null;
    const cur = h.audioBack === "optical" ? `optical:${h.ret.to}` : h.audioBack;
    const optTargets = devs.filter(d => RETURN_TO.includes(d.type));
    rows.push(field("TV audio back", `<select class="hret">
      ${rcv ? opt("earc", `${AUDIO_BACK.earc} (to ${rcv.model || rcv.id})`, cur) + opt("earc+optical", `${AUDIO_BACK["earc+optical"]} (to ${rcv.model || rcv.id})`, cur) : ""}
      ${optTargets.map(d => opt(`optical:${d.id}`, `Optical only → ${nm(d.id)}`, cur)).join("")}
      ${opt("none", AUDIO_BACK.none, cur)}</select>`));

  }

    rows.push(field("Dante", `<span class="mini" style="line-height:1.5">${esc(ADAPTER[h.dante.type]?.name || h.dante.type)} → ${esc(lis)}${h.dante.type === "ddec" ? " · the source's audio (audio follows video)" : h.dante.type === "axis" ? " · set the TV to stereo PCM" : " · decodes Atmos/DTS-HD"}</span>`));

      rows.push(`<div style="margin:-2px 0 6px 80px"><button class="addbtn hdante" data-how="axis">Use an AXIS2 instead (TV's own apps too)</button></div>`);

  const vDev = byDev(h.video?.from), sDev = byDev(h.speakers?.from);

  return `<div class="sect">HOOKUP <span class="mini">what feeds this zone${multi ? ` · ${esc(sol.name)}` : ""}</span></div>${rows.join("")}${nudge}`;
}

/* one connection as a row; `ctx` keys its open state per place it's shown

function connRowHTML(c, i, sol, ctx, dir) {

  return `<div class="row ${open ? "open" : ""}" data-ci="${i}">
      <div class="head" data-toggle="${esc(key)}"><span class="t">${esc(title)}</span><span class="sub">${esc(tail)}</span></div>
      <div class="fields">
        ${field("From", nodeSel("cfrom", c.from))}
        ${field("To", nodeSel("cto", c.to))}
        ${field("Carries", sel("csig", SIGNALS, c.signal, SIGNAL_LABEL))}
        ${c.signal === "video" && fromRcv ? field("eARC", `<input type="checkbox" class="cearc" ${c.earc ? "checked" : ""}> <span class="mini">the TV's audio comes back over this HDMI</span>`) : ""}
        ${c.signal === "audioReturn" ? field("Backup", `<input type="checkbox" class="cbackup" ${c.backup ? "checked" : ""}> <span class="mini">optical backup to eARC</span>`) : ""}
        ${c.signal !== "network" ? field("Outputs", `<input class="cch" placeholder="optional, e.g. 3-4" title="Which outputs this uses — amp channels (3-4) or a matrix output (2). Shows on the channel strip." value="${esc(c.channels || "")}">`) : ""}
        ${field("Scope", sel("cscope", ["included", "prewire", "future"], c.scope || "included", SCOPE_LABEL))}
        <div style="text-align:right"><button class="del cdel">delete connection</button></div>
      </div></div>`;
}
/* port use vs the catalog's jacks: "HDMI 2 of 7" per kind, a short head summary */
function portCaps(d, cat, ins, outs) {
  if (!cat) return {};
  const io = S.ioByDev?.get(d.id) || {};
  const rows = (list, sig) => list.filter(c => c.signal === sig).length;
  const cnt = (list, sig) => {
    const k = list === ins ? { video: "video-in", audio: "analog-in", audioReturn: "return-in" }[sig] : { video: "video-out", audio: "audio-out" }[sig];
    return io[k]?.used ?? rows(list, sig);
  };
  const inParts = [], outParts = [];
  const I = cat.inputs || {}, O = cat.outputs || {};
  if (I.hdmi) inParts.push(`HDMI ${cnt(ins, "video")} of ${I.hdmi}`);
  if (I.analog) inParts.push(`analog ${cnt(ins, "audio")} of ${I.analog}`);
  if (I.optical) inParts.push(`optical ${cnt(ins, "audioReturn")} of ${I.optical}`);
  const net = (O.gbe || 0) + (O.gbe25 || 0) + (O.gbe10 || 0) + (O.sfp || 0) + (O.sfpPlus || 0);
  if (net && /switch|avSwitch/i.test(d.type)) inParts.push(`ports ${cnt(ins, "network") + cnt(outs, "network")} of ${net}`);
  if (O.hdmi) outParts.push(`HDMI ${cnt(outs, "video")} of ${O.hdmi}`);
  if (O.analog && d.type !== "videoMatrix") outParts.push(`analog ${cnt(outs, "audio")} of ${O.analog}`);
  if (d.type === "amp" && (d.zones || cat.zones)) outParts.push(`zones ${cnt(outs, "speaker")} of ${d.zones || cat.zones}`);
  const tight = [...inParts, ...outParts].find(p => { const m = p.match(/(\d+) of (\d+)/); return m && +m[1] >= +m[2]; });
  return { ins: inParts.join(" · "), outs: outParts.join(" · "), short: tight ? tight + " (full)" : "" };
}

function allNodes() {
  const sol = S.job.solutions[S.sol];
  const n = [];
  for (const r of sol.racks) for (const d of r.devices) n.push(d.id);
  for (const c of sol.companions || []) n.push(c.id);
  for (const d of sol.localDevices || []) n.push(d.id);
  for (const z of S.job.house.zones) for (const e of z.endpoints || []) n.push(e.id);
  return n;
}

  const num = v => v == null ? "" : String(Math.round(v * 10) / 10);
  const inp = (dev, k, own, fromCat, w = 46) => `<input class="rspec" data-dev="${esc(dev)}" data-k="${k}" value="${esc(num(own ?? fromCat))}" placeholder="?" style="width:${w}px${own == null && fromCat != null ? ";color:#777" : ""}" title="${own != null ? "Typed in for this job" : fromCat != null ? "From the catalog — type to override" : "Not known yet — type it in"}">`;
  const rackRow = rr => {

    }).join("");
    const hw = (r?.hardware || []).map(h => `<tr><td>${esc(h.item)}</td><td>${h.qty}</td><td>${h.key === "kit" ? esc(h.partNo)
      : `<input class="rpart" data-key="${h.key}" data-rack="${esc(rr.id)}" value="${esc(h.partNo || "")}" placeholder="?" style="width:130px">`}</td></tr>`).join("");
    return `<div class="sect">${esc(rr.name || "Equipment Rack")} ${r ? `<span class="badge">${r.used}U / ${r.size}U</span>` : ""}</div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">

      ${r ? `<div class="mini" style="margin:4px 0">${r.used}U used · ${r.over ? `<b style="color:#b32017">${r.over}U over</b>` : `${r.spare}U spare`}${r.cat6 ? ` · ${r.cat6} Cat6 home runs` : ""}${r.unknown.length ? ` · <span style="color:#a45a12">${r.unknown.length} height${r.unknown.length > 1 ? "s" : ""} unknown (?)</span>` : ""}</div>
      <div class="rackview" style="background:#fff;border-radius:6px;padding:6px;margin:6px 0">${rackFrontSVG(r)}</div>` : ""}
      <div class="mini" style="margin:8px 0 4px"><b>Gear</b> — U · cords · typical W · max W. <span style="color:#a45a12">?</span> = not known: type it in (saved on this job).</div>
      <table class="rtab"><tr><th>Box</th><th>U</th><th>Cords</th><th>Typ W</th><th>Max W</th></tr>${devs}</table>
      ${hw ? `<div class="mini" style="margin:10px 0 4px"><b>Rack hardware</b> — part numbers; <span style="color:#a45a12">?</span> = fill in later</div>
      <table class="rtab"><tr><th>Item</th><th>Qty</th><th>Part no.</th></tr>${hw}</table>` : ""}
    </div></div>`;
  };
  const pw = power ? `<div class="sect">POWER & HEAT</div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">
      <div class="mini">${power.units.length ? esc(power.units.map(u => `${u.model} (${u.outlets ?? "?"} outlets)`).join(" + ")) : "No power conditioner yet"} · ${power.need} outlets needed${power.supply != null ? ` · ${power.supply - power.need} spare` : ""}</div>

      ${notes.map(n => `<div class="mini" style="margin-top:6px;color:#a45a12">⚠ ${esc(n.msg)}</div>`).join("")}
    </div></div>` : "";
  const rs = sol.racks || [];
  return rs.length ? rs.map(rackRow).join("") + pw : `<div class="mini" style="padding:12px">No rack on this job yet — add gear under GEAR.</div>`;
