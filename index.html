<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalPath</title>
<style>
  :root {
    --bar: #14161a; --bar2: #1e2128; --ink: #16181c; --panel: #f7f7f9;
    --line: #d8dade; --accent: #2b6cb8; --ok: #2f7a3a; --bad: #b32017; --warn: #b8860b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Avenir Next", Avenir, Futura, "Helvetica Neue", sans-serif; color: var(--ink);
         display: flex; flex-direction: column; background: #e7e9ee; }

  /* ---- top bar ---- */
  #topbar { background: var(--bar); color: #e8eaee; display: flex; align-items: center; gap: 10px;
            padding: 8px 14px; flex: 0 0 auto; }
  #topbar .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 2px; font-size: 14px; }
  #topbar .logo svg { width: 22px; height: 22px; }
  #topbar select, #topbar button, #topbar label {
    background: var(--bar2); color: #e8eaee; border: 1px solid #333842; border-radius: 6px;
    font: inherit; font-size: 12.5px; padding: 5px 9px; }
  #topbar button { cursor: pointer; }
  #topbar button:hover { border-color: #58607a; }
  #topbar .spacer { flex: 1; }
  #rulesChip { border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  #rulesChip.ok { background: #14301c; color: #7fd695; border-color: #2f7a3a; }
  #rulesChip.bad { background: #33150f; color: #ff9d8e; border-color: #b32017; cursor: pointer; }
  #jobName { background: transparent; border: none; color: #fff; font-size: 14px; font-weight: 600; min-width: 130px; }
  #jobName:focus { outline: 1px solid var(--accent); border-radius: 4px; }
  label.chk { display: flex; align-items: center; gap: 5px; cursor: pointer; }

  /* ---- main split ---- */
  #main { flex: 1; display: flex; min-height: 0; }
  #panel { width: 330px; flex: 0 0 auto; background: var(--panel); border-right: 1px solid var(--line);
           display: flex; flex-direction: column; min-height: 0; transition: width .15s; }
  #panel.collapsed { width: 42px; }
  #panel.collapsed .body, #panel.collapsed .tabs .lbl { display: none; }
  .tabs { display: flex; align-items: center; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .tabs button { flex: 1; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px;
                 padding: 10px 2px; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; color: #666; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  #collapse { flex: 0 0 30px; font-size: 13px; color: #888; background: none; border: none; cursor: pointer; padding: 10px 0; }
  .body { flex: 1; overflow-y: auto; padding: 10px; min-height: 0; }

  /* ---- panel widgets ---- */
  .row { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  .row > .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; }
  .row > .head .t { font-weight: 600; font-size: 13.5px; flex: 1; }
  .row > .head .sub { font-size: 11px; color: #777; }
  .row .fields { border-top: 1px solid var(--line); padding: 9px 10px; display: none; }
  .row.open .fields { display: block; }
  .fields .f { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .fields label { font-size: 11px; color: #666; width: 74px; flex: 0 0 auto; }
  .fields input, .fields select { font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line);
                                  border-radius: 5px; flex: 1; min-width: 0; background: #fff; }
  .fields input[type=checkbox] { flex: 0 0 auto; }
  /* mini numeric fields keep a real width and never collapse */
  .fields input[type=number] { flex: 0 0 46px; width: 46px; min-width: 46px; padding: 4px 5px;
                               appearance: textfield; -moz-appearance: textfield; }
  .fields input[type=number]::-webkit-outer-spin-button,
  .fields input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .fields .f.wrap { flex-wrap: wrap; row-gap: 5px; }
  .mini { font-size: 11px; color: #999; }
  .addbtn, .del { font: inherit; font-size: 12px; border-radius: 6px; cursor: pointer; }
  .addbtn { width: 100%; padding: 8px; background: #eef2f8; border: 1px dashed #9db4d0; color: var(--accent); font-weight: 600; }
  .del { background: none; border: none; color: #b55; padding: 2px 6px; }
  .sect { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #888; margin: 12px 2px 6px; }
  .badge { font-size: 10px; border-radius: 4px; padding: 1px 5px; background: #eee; color: #666; }
  .badge.ovb { background: #fdeedd; color: #b05e12; border: 1px solid #e8b57e; }

  /* ---- per-solution override affordances ---- */
  #escope { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 11px;
            background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; margin-bottom: 8px; }
  #escope .t { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #888; }
  #escope label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #444; }
  #escope input { accent-color: #e8842c; }
  .f.ov input, .f.ov select { border-color: #e8842c; box-shadow: 0 0 0 1px #e8842c55; }
  .f.ov label { color: #b05e12; }
  .ovx { background: none; border: none; color: #e8842c; font-size: 12px; font-weight: 700;
         cursor: pointer; padding: 0 3px; margin-left: 1px; border-radius: 3px; }
  .ovx:hover { background: #e8842c; color: #fff; }

  /* ---- quick-add bar ---- */
  #qa { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
  #qa .line { display: flex; gap: 6px; }
  #qaInput { flex: 1; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
  #qaMic, #qaGo { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
                  background: #fff; cursor: pointer; }
  #qaMic.rec { background: var(--bad); color: #fff; border-color: var(--bad); }
  #qaGo { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #qaChips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; min-height: 0; }
  #qaChips .qc { font-size: 11px; border-radius: 999px; padding: 2px 9px; background: #eef2f8; color: #23507e; border: 1px solid #c7d6ea; }
  #qaChips .qc.name { background: #16181c; color: #fff; border-color: #16181c; }
  #qaChips .qc.scope { background: #f0f0f2; color: #777; border-color: #ccc; }
  #qaChips .qc.hint { background: #fdf3d8; color: #7a5a12; border-color: #e2c78a; }
  #qa .ex { font-size: 10.5px; color: #999; margin-top: 5px; }

  /* ---- canvas + advisor ---- */
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvas { flex: 1; overflow: auto; padding: 16px; min-height: 0; }
  #canvas svg { width: 100%; height: auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); border-radius: 3px; }

  /* ---- interactive sheet: wire tracing + card jump ---- */
  #canvas svg .wirehit, #canvas svg .zcard .hit, #canvas svg .devtile { cursor: pointer; }
  #canvas svg.wiresel path.wire:not(.sel) { opacity: .13; }
  #canvas svg path.wire.sel { stroke-width: 3.6; }
  #canvas .devtile.selnode rect:first-of-type { stroke: #e8842c; stroke-width: 2.5; }
  #canvas .zcard.selnode > rect.hit { stroke: #e8842c; stroke-width: 2.2; fill: rgba(232,132,44,.06); }
  #canvas .zcard.zglow > rect.hit { stroke: #e8842c99; stroke-width: 2; fill: rgba(232,132,44,.04); }
  #wiretip { position: fixed; z-index: 40; background: #16181c; color: #eee; font-size: 12px;
             padding: 6px 11px; border-radius: 6px; pointer-events: none; display: none;
             box-shadow: 0 4px 14px rgba(0,0,0,.35); max-width: 300px; }
  #wiretip .mini { color: #9a9a9a; }
  @keyframes rowflash { 0% { background: #fdeedd; } 100% { background: #fff; } }
  .row.flash { animation: rowflash 1.2s ease-out; }
  #advisor { flex: 0 0 auto; background: #fff; border-top: 1px solid var(--line); max-height: 130px; overflow-y: auto;
             padding: 6px 14px; font-size: 12px; }
  #advisor .item { padding: 3px 0; }
  #advisor .e { color: var(--bad); } #advisor .w { color: var(--warn); } #advisor .i { color: #444; }
  #advisor .ok { color: var(--ok); }

  /* ---- import review overlay ---- */
  #review { position: fixed; inset: 0; background: rgba(10,12,16,.55); display: none; z-index: 50;
            align-items: center; justify-content: center; }
  #review.show { display: flex; }
  #review .card { background: #fff; border-radius: 12px; width: min(680px, 92vw); max-height: 84vh;
                  display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  #review .hd { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  #review .hd .t { font-size: 16px; font-weight: 700; }
  #review .hd .s { font-size: 12px; color: #777; margin-top: 2px; }
  #review .bd { padding: 10px 18px; overflow-y: auto; font-size: 12.5px; }
  #review .bd .w { color: var(--warn); padding: 2px 0; }
  #review .bd .n { color: #555; padding: 2px 0; }
  #review .bd .u { color: #999; padding: 1px 0; font-size: 11.5px; }
  #review table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  #review td, #review th { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eee; font-size: 12px; }
  #review th { font-size: 10.5px; letter-spacing: 1px; color: #888; }
  #review .ft { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #review .ft button, #review .ft select { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; }
  #review .ft .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<div id="topbar">
  <span class="logo">SIGNALPATH</span>
  <select id="jobsSel" title="Jobs"></select>
  <button id="newJob" title="New job">＋</button>
  <button id="delJob" title="Delete job">🗑</button>
  <input id="jobName" title="Project name">
  <select id="solSel" title="Solution"></select>
  <select id="stageSel"><option value="proposal">PROPOSAL</option><option value="asBuilt">AS-BUILT</option></select>
  <span class="spacer"></span>
  <span id="rulesChip" class="ok">✓</span>
  <label class="chk"><input type="checkbox" id="hideNet"> hide network</label>
  <button id="importBtn">Import</button><input type="file" id="importFile" accept=".json,.md" hidden>
  <button id="exportJson">JSON</button>
  <button id="exportSvg">SVG</button>
  <button id="exportCsv" title="Takeoff CSV">CSV</button>
  <button id="printBtn" title="Print packet / save as PDF">Print</button>
  <button id="toolsBtn" title="Synergy Field Kit">TOOLS</button>
</div>

<div id="main">
  <div id="panel">
    <div class="tabs">
      <button data-tab="zones" class="on"><span class="lbl">ZONES</span><span class="mini" style="display:none">Z</span></button>
      <button data-tab="gear"><span class="lbl">GEAR</span></button>
      <button data-tab="job"><span class="lbl">JOB</span></button>
      <button data-tab="settings"><span class="lbl">⚙</span></button>
      <button id="collapse" title="Collapse">⟨⟨</button>
    </div>
    <div class="body" id="panelBody"></div>
  </div>
  <div id="right">
    <div id="canvas"></div>
    <div id="advisor"></div>
  </div>
</div>

<div id="review"><div class="card">
  <div class="hd"><div class="t" id="rvTitle"></div><div class="s" id="rvSub"></div></div>
  <div class="bd" id="rvBody"></div>
  <div class="ft">
    <button class="primary" id="rvNew">Create new job</button>
    <select id="rvTarget"></select><button id="rvMerge">Update selected job</button>
    <span style="flex:1"></span><button id="rvCancel">Cancel</button>
  </div>
</div></div>

<script type="module">
import { loadJob, validate, advise, place, route, render, effectiveJob, autoLinkCatalog } from "./app/engine.js";
import { importAny, mergeHouse } from "./app/importers.js";
import { renderExtraPages, sheetCount, pageFlags, takeoffCSV } from "./app/pages.js";
import { parseQuick } from "./app/quickadd.js";

/* ============ IndexedDB jobs store ============ */
const DB = await new Promise((res, rej) => {
  const rq = indexedDB.open("signalpath", 1);
  rq.onupgradeneeded = () => rq.result.createObjectStore("jobs", { keyPath: "id" });
  rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
});
const tx = mode => DB.transaction("jobs", mode).objectStore("jobs");
const dbAllRaw = () => new Promise(r => { const q = tx("readonly").getAll(); q.onsuccess = () => r(q.result); });
const dbAll = async () => (await dbAllRaw()).filter(r => r.id !== "__settings");
const dbPut = rec => new Promise(r => { const q = tx("readwrite").put(rec); q.onsuccess = () => r(); });
const dbDel = id => new Promise(r => { const q = tx("readwrite").delete(id); q.onsuccess = () => r(); });

/* ============ settings + catalog (user-editable; catalog.json is the shipped seed) ============ */
const SHIPPED = await fetch("./app/catalog.json").then(r => r.json()).catch(() => ({ devices: {}, licensing: {} }));
let SETTINGS = { company: { name: "SYNERGY", tagline: "AUDIO VIDEO SYSTEMS",
  info: "300 El Camino Real · Tustin, CA 92780 · P: 714-505-2003 · www.synergy.tv" }, catalog: null };
{
  const rec = (await dbAllRaw()).find(r => r.id === "__settings");
  if (rec?.settings) SETTINGS = rec.settings;
  if (!SETTINGS.catalog) SETTINGS.catalog = structuredClone(SHIPPED);
  else for (const [id, d] of Object.entries(SHIPPED.devices || {}))   // shipped catalog grows over time:
    if (!SETTINGS.catalog.devices[id]) SETTINGS.catalog.devices[id] = structuredClone(d); // new entries join, user edits win
}
const saveSettings = () => dbPut({ id: "__settings", updated: Date.now(), settings: SETTINGS });
/* job snapshot wins over the live catalog (old jobs advise identically forever) */
function effectiveCatalog() {
  const snap = S.job?.job?.catalogSnapshot;
  const cat = structuredClone(SETTINGS.catalog);
  if (snap?.devices) cat.devices = { ...cat.devices, ...snap.devices };
  return cat;
}

/* ============ state ============ */
const S = { job: null, id: null, sol: 0, tab: "zones", openRows: new Set(), editScope: "house" };
const uid = p => p + "-" + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);

function blankJob(name = "New Job") {
  return {
    generator: "SignalPath", schemaVersion: 1,
    job: { name, client: { name: "Customer Name", address: "Street, City, CA" }, stage: "proposal",
           drawnBy: "SignalPath", revisions: [{ rev: 1, date: new Date().toISOString().slice(0, 10), description: "Initial proposal", by: "SP" }],
           catalogSnapshot: { asOf: new Date().toISOString().slice(0, 10) } },
    house: { areas: [], zones: [] },
    solutions: [{ id: "sol-a", name: "Proposed System", videoDistribution: "hybrid", platforms: [], auxCounts: {},
                  racks: [{ id: "rack-main", name: "Equipment Rack", devices: [] }],
                  localDevices: [], companions: [], connections: [], annotations: [] }],
  };
}

/* ============ live pipeline ============ */
let saveTimer;
function refresh(save = true) {
  const sol = S.job.solutions[S.sol] || S.job.solutions[0];
  S.sol = S.job.solutions.indexOf(sol);
  let v, a, svg = "", err;
  try {
    autoLinkCatalog(S.job, effectiveCatalog());                // self-heal: fill missing catalog links by model
    const { job, ix } = loadJob(effectiveJob(S.job, S.sol));   // active solution's overrides applied
    S.view = { job, ix };                                      // interactive sheet resolves names from here
    v = validate(job, ix); a = advise(job, ix, effectiveCatalog());
    const opts = { solution: S.sol, hideSignals: $("#hideNet").checked ? ["network"] : [], company: SETTINGS.company,
                   sheet: `1 of ${sheetCount(S.job)}` };
    if (S.job.house.zones.length) {
      const p = place(job, ix, opts);
      const rt = route(job, ix, p, opts);
      svg = render(job, ix, p, rt, opts);
    }
  } catch (e) { err = e; console.error(e); }

  $("#canvas").innerHTML = svg || `<div style="color:#888;padding:60px;text-align:center">Add a zone to start drawing${err ? "<br><small>" + err.message + "</small>" : ""}</div>`;
  hideTip(); applySel(); syncGlow();
  const chip = $("#rulesChip");
  if (err) { chip.className = "bad"; chip.textContent = "engine error"; }
  else if (v.errors.length) { chip.className = "bad"; chip.textContent = `✗ ${v.errors.length} issue${v.errors.length > 1 ? "s" : ""}`; }
  else { chip.className = "ok"; chip.textContent = `✓ valid${v.warnings.length ? " · " + v.warnings.length + "⚠" : ""}`; }

  const adv = [];
  const activeSolId = S.job.solutions[S.sol]?.id;
  const mine = e => !e.solution || e.solution === activeSolId;   // advisor speaks for the ACTIVE solution only
  for (const e of v?.errors || []) adv.push(`<div class="item e">✗ ${esc(e.msg)}</div>`);
  for (const w of v?.warnings || []) adv.push(`<div class="item w">⚠ ${esc(w.msg)}</div>`);
  for (const io of (a?.io || []).filter(mine)) {
    if (io.over) adv.push(`<div class="item e">✗ ${esc(io.msg)}</div>`);
    else if (io.msg && (io.kind === "analog-in" || io.kind === "audio-out")) adv.push(`<div class="item i">🔌 ${esc(io.msg)}</div>`);
  }
  for (const amp of (a?.amps || []).filter(mine)) adv.push(`<div class="item i">🔊 ${esc(amp.amp)}: ${amp.zonesUsed}/${amp.zonesTotal ?? "?"} zones${amp.reserved ? ` (${amp.reserved} reserved)` : ""}${amp.spare != null ? ` · ${amp.spare} spare` : ""}</div>`);
  for (const lic of (a?.licensing || []).filter(mine)) {
    adv.push(`<div class="item i">🎛 <b>${esc(lic.platform)}</b> → ${esc(lic.pick)} · ${lic.lines.map(esc).join(" · ")}</div>`);
    for (const w of lic.warns || []) adv.push(`<div class="item w">⚠ ${esc(lic.platform)}: ${esc(w)}</div>`);
  }
  for (const n of a?.notes || []) adv.push(`<div class="item i">🎛 ${esc(n.msg)}</div>`);
  $("#advisor").innerHTML = adv.join("") || `<div class="item ok">✓ No issues</div>`;

  renderTopbar();
  renderPanel();
  if (save) { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); }
}
async function persist() {
  // lockfile: freeze the catalog entries this job uses, so it advises the same forever
  const used = {};
  for (const sol of S.job.solutions) for (const r of sol.racks || []) for (const d of r.devices || [])
    if (d.catalogRef && SETTINGS.catalog.devices[d.catalogRef]) used[d.catalogRef] = SETTINGS.catalog.devices[d.catalogRef];
  S.job.job.catalogSnapshot = { asOf: SETTINGS.catalog.asOf, ...(Object.keys(used).length ? { devices: used } : {}) };
  await dbPut({ id: S.id, updated: Date.now(), data: S.job });
  await renderJobsSel();
}
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ============ top bar ============ */
function renderTopbar() {
  $("#jobName").value = S.job.job.name || "";
  $("#stageSel").value = (S.job.job.stage || "proposal") === "asBuilt" ? "asBuilt" : "proposal";
  const sel = $("#solSel");
  sel.innerHTML = S.job.solutions.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join("") + `<option value="__add">＋ new solution…</option>`;
  sel.value = String(S.sol);
}
async function renderJobsSel() {
  const jobs = (await dbAll()).sort((a, b) => b.updated - a.updated);
  $("#jobsSel").innerHTML = jobs.map(j => `<option value="${j.id}">${esc(j.data.job.name)}</option>`).join("") +
    `<optgroup label="Samples"><option value="__residence">Sample Residence</option><option value="__estate">Sample Estate</option><option value="__stress">Stress (25 zones)</option></optgroup>`;
  $("#jobsSel").value = S.id;
}

$("#jobName").onchange = e => { S.job.job.name = e.target.value; refresh(); };
$("#stageSel").onchange = e => { S.job.job.stage = e.target.value; refresh(); };
$("#hideNet").onchange = () => refresh(false);
$("#solSel").onchange = e => {
  if (e.target.value === "__add") {
    const base = S.job.solutions[S.sol];
    const copy = structuredClone(base);
    copy.id = uid("sol"); copy.name = base.name + " (alt)";
    S.job.solutions.push(copy); S.sol = S.job.solutions.length - 1;
  } else S.sol = +e.target.value;
  refresh();
};
$("#newJob").onclick = async () => { S.job = blankJob(); S.id = uid("job"); S.editScope = "house"; await persist(); refresh(); };
$("#delJob").onclick = async () => {
  if (!confirm(`Delete "${S.job.job.name}"?`)) return;
  await dbDel(S.id);
  const jobs = await dbAll();
  if (jobs.length) { S.id = jobs[0].id; S.job = jobs[0].data; } else { S.job = blankJob(); S.id = uid("job"); await persist(); }
  refresh();
};
$("#jobsSel").onchange = async e => {
  const v = e.target.value;
  S.editScope = "house";
  if (v.startsWith("__")) {
    const raw = await (await fetch(`./mock-system-${v.slice(2)}.json`)).json();
    S.job = raw; S.id = uid("job"); S.sol = 0; await persist();
  } else {
    const rec = (await dbAll()).find(j => j.id === v);
    if (rec) { S.job = rec.data; S.id = rec.id; S.sol = 0; }
  }
  refresh(false);
};
$("#exportJson").onclick = () => download(`${S.job.job.name}.json`, JSON.stringify(S.job, null, 2), "application/json");
$("#exportSvg").onclick = () => { const svg = $("#canvas svg"); if (svg) download(`${S.job.job.name} — schematic.svg`, svg.outerHTML, "image/svg+xml"); };
$("#exportCsv").onclick = () => { const { job, ix } = loadJob(effectiveJob(S.job, S.sol)); download(`${S.job.job.name} — takeoff.csv`, takeoffCSV(job, ix, { solution: S.sol }), "text/csv"); };

/* ---- Field Kit TOOLS switcher (hub manifest, cached; self marked) ---- */
const KIT_SELF = "signalpath";
$("#toolsBtn").onclick = () => {
  const cached = JSON.parse(localStorage.getItem("signalpath.kit") || "null");
  const draw = kit => {
    const rows = (kit?.tools || []).map(t => t.id === KIT_SELF
      ? `<div style="display:flex;align-items:center;padding:10px 4px;border-bottom:1px solid #eee;opacity:.55">
           <div style="flex:1"><b>${esc(t.name)}</b><div class="mini">${esc(t.desc || "")}</div></div>
           <span class="mini" style="letter-spacing:1px">YOU'RE HERE</span></div>`
      : `<a href="${esc(t.url)}" style="display:flex;align-items:center;padding:10px 4px;border-bottom:1px solid #eee;text-decoration:none;color:inherit">
           <div style="flex:1"><b>${esc(t.name)}</b><div class="mini">${esc(t.desc || "")}</div></div>
           <span style="color:var(--accent)">→</span></a>`).join("");
    $("#rvTitle").textContent = "SYNERGY FIELD KIT";
    $("#rvSub").textContent = kit?.updated ? `manifest updated ${kit.updated}` : "";
    $("#rvBody").innerHTML = rows || `<div class="mini">Hub unreachable — try again online.</div>`;
    $("#rvNew").style.display = "none"; $("#rvMerge").style.display = "none"; $("#rvTarget").style.display = "none";
    $("#review").classList.add("show");
    $("#rvCancel").onclick = () => { $("#review").classList.remove("show");
      $("#rvNew").style.display = ""; $("#rvMerge").style.display = ""; $("#rvTarget").style.display = ""; };
  };
  if (cached) draw(cached);
  fetch("https://ryan-synergy.github.io/tools.json", { cache: "no-store" }).then(r => r.json())
    .then(j => { if (j?.tools) { localStorage.setItem("signalpath.kit", JSON.stringify(j)); draw(j); } })
    .catch(() => { if (!cached) draw(null); });
};

$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  let text = await file.text();
  const fence = text.match(/```json\s*([\s\S]*?)```/);         // Markdown round-trip: parse the fenced block only
  if (fence) text = fence[1];
  try {
    const res = importAny(JSON.parse(text));
    if (res.kind === "signalpath") { S.job = res.job; S.id = uid("job"); S.sol = 0; await persist(); refresh(false); }
    else await showReview(res);
  } catch (err) { alert("Import failed: " + err.message); }
  e.target.value = "";
};

/* ---- lenient review screen: every import lands here before touching a job ---- */
async function showReview(res) {
  const j = res.job, sol = j.solutions[0];
  const KINDS = { sitewalk: "SiteWalk / AVWalk survey", blueprinted: "Blueprinted takeoff (old Savant system)" };
  $("#rvTitle").textContent = `Import review — ${KINDS[res.kind] || res.kind}`;
  $("#rvSub").textContent = `${j.job.name} · ${j.house.zones.length} zones · ${sol.racks[0].devices.length} rack devices · ${sol.connections.length} connections${sol.platforms.length ? " · platform: " + sol.platforms[0] : ""}`;
  const zoneRow = z => {
    const spk = z.endpoints.filter(e => e.type === "speakers").map(e => e.config).join(" + ");
    const tv = z.endpoints.find(e => e.type === "display");
    return `<tr><td><b>${esc(z.name)}</b></td><td>${esc(spk || "—")}</td>
      <td>${tv ? esc(`${tv.brand || "?"} ${tv.size}"${tv.confirm ? " ⚠" : ""} (${tv.status})`) : "—"}</td>
      <td class="u">${esc(z.note || "")}</td></tr>`;
  };
  $("#rvBody").innerHTML =
    res.warnings.map(w => `<div class="w">⚠ ${esc(w)}</div>`).join("") +
    res.notes.map(n => `<div class="n">· ${esc(n)}</div>`).join("") +
    `<table><tr><th>ZONE</th><th>SPEAKERS</th><th>DISPLAY</th><th>NOTES</th></tr>${j.house.zones.map(zoneRow).join("")}</table>` +
    (res.unmapped.length ? `<div class="u">Unmapped (kept as reference): ${res.unmapped.map(esc).join(" · ")}</div>` : "");
  const jobs = await dbAll();
  $("#rvTarget").innerHTML = jobs.map(r => `<option value="${r.id}">${esc(r.data.job.name)}</option>`).join("");
  $("#rvMerge").disabled = !jobs.length;
  $("#review").classList.add("show");
  return new Promise(done => {
    const close = () => { $("#review").classList.remove("show"); done(); };
    $("#rvCancel").onclick = close;
    $("#rvNew").onclick = async () => { S.job = j; S.id = uid("job"); S.sol = 0; await persist(); refresh(false); close(); };
    $("#rvMerge").onclick = async () => {
      const rec = jobs.find(r => r.id === $("#rvTarget").value); if (!rec) return;
      const changes = mergeHouse(rec.data, j);
      S.job = rec.data; S.id = rec.id; S.sol = 0; await persist(); refresh(false); close();
      alert("House updated (Solutions kept):\n" + changes.map(c => `${c.kind}: ${c.zone}${c.type ? " (" + c.type + ")" : ""}`).join("\n"));
    };
  });
}

let selWire = null;
const tip = document.createElement("div"); tip.id = "wiretip"; document.body.appendChild(tip);
const showTip = (x, y, html) => { tip.innerHTML = html; tip.style.display = "block";
  tip.style.left = Math.min(x + 14, innerWidth - 280) + "px"; tip.style.top = (y + 14) + "px"; };
const hideTip = () => { tip.style.display = "none"; };

function nodeName(id) {
  const v = S.view; if (!v) return id;
  const sol = v.job.solutions[S.sol] || v.job.solutions[0];
  for (const r of sol.racks || []) for (const d of r.devices || []) if (d.id === id) return d.model || id;
  for (const d of sol.localDevices || []) if (d.id === id) return `${d.model || id} (${v.ix.zonesById[d.zone]?.name || d.zone})`;
  for (const c of sol.companions || []) if (c.id === id) return `${String(c.type).toUpperCase()} @ ${nodeName(c.serves)}`;
  const ep = v.ix.endpointsById[id];
  if (ep) {
    const zn = v.ix.zonesById[v.ix.endpointZone[id]]?.name || "";
    return `${zn} ${ep.type === "display" ? (ep.displayType === "projector" ? "projector" : "TV") : ep.type}`.trim();
  }
  return id;
}

function applySel() {
  const svg = $("#canvas svg"); if (!svg) { selWire = null; return; }
  svg.querySelectorAll("path.wire.sel").forEach(p => p.classList.remove("sel"));
  svg.querySelectorAll(".selnode").forEach(g => g.classList.remove("selnode"));
  const p = selWire && svg.querySelector(`path.wire[data-wire="${selWire}"]`);
  if (!p) { selWire = null; svg.classList.remove("wiresel"); return; }
  svg.classList.add("wiresel");
  p.classList.add("sel");
  for (const nid of [p.dataset.from, p.dataset.to]) {
    const g = svg.querySelector(`[data-device="${nid}"]`) ||
      svg.querySelector(`[data-zone="${S.view?.ix.endpointZone[nid] || ""}"]`);
    g?.classList.add("selnode");
  }
}
function clearSel() { selWire = null; hideTip(); applySel(); }

function syncGlow() {
  const svg = $("#canvas svg"); if (!svg) return;
  svg.querySelectorAll("g.zglow").forEach(g => g.classList.remove("zglow"));
  if (S.tab !== "zones") return;
  for (const id of S.openRows) svg.querySelector(`[data-zone="${id}"]`)?.classList.add("zglow");
}

function switchTab(tab) {
  S.tab = tab;
  $("#panel").classList.remove("collapsed");
  document.querySelectorAll(".tabs button[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
}
function flashRow(sel) {
  const row = $("#panelBody").querySelector(sel);
  if (!row) return;
  row.scrollIntoView({ block: "center", behavior: "smooth" });
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1300);
}
function openZone(zid) { switchTab("zones"); S.openRows.add(zid); renderPanel(); flashRow(`[data-zid="${zid}"]`); syncGlow(); }
function openGear(did) { switchTab("gear"); S.openRows.add(did); renderPanel(); flashRow(`[data-did="${did}"]`); syncGlow(); }

$("#canvas").addEventListener("click", e => {
  if (!$("#canvas svg")) return;
  // wires first (their fat hit-twins sit on top); overlapping bundles cycle per tap
  const ids = [...new Set(document.elementsFromPoint(e.clientX, e.clientY)
    .filter(el => el.classList?.contains("wirehit") || el.classList?.contains("wire"))
    .map(el => el.dataset.wire))];
  if (ids.length) {
    const idx = ids.indexOf(selWire);
    if (idx !== -1 && ids.length === 1) { clearSel(); return; }
    selWire = ids[(idx + 1) % ids.length];
    applySel();
    const p = $("#canvas svg").querySelector(`path.wire[data-wire="${selWire}"]`);
    showTip(e.clientX, e.clientY,
      `<b>${esc(nodeName(p.dataset.from))}</b> → <b>${esc(nodeName(p.dataset.to))}</b> · ${esc(p.dataset.signal)}${ids.length > 1 ? ` <span class="mini">(${idx + 2 > ids.length ? 1 : idx + 2}/${ids.length} here — tap to cycle)</span>` : ""}`);
    return;
  }
  const dev = e.target.closest("[data-device]");
  if (dev) { clearSel(); openGear(dev.dataset.device); return; }
  const zc = e.target.closest("[data-zone]");
  if (zc) { clearSel(); openZone(zc.dataset.zone); return; }
  clearSel();
});

    const open = S.openRows.has("cat-" + id);
    const io = d.inputs || {};
    return `<div class="row ${open ? "open" : ""}" data-cat="${id}">
      <div class="head" data-toggle="cat-${id}"><span class="t">${esc(d.brand)} ${esc(d.model)}</span>
        <span class="sub">${esc(d.type)}${d.zones ? ` · ${d.zones}z` : ""}${d.verified === false ? " · ⚠unverified" : ""}</span></div>
      <div class="fields">
        ${field("Model", `<input class="catmodel" value="${esc(d.model)}">`)}
        ${field("Zones", numf("catzones", d.zones, "-"))}
        <div class="f wrap"><label>Inputs</label>
          <span class="mini">analog</span>${numf("catan", io.analog, "0")}<span class="mini">coax</span>${numf("catco", io.coax, "0")}
          <span class="mini">opt</span>${numf("catop", io.optical, "0")}<span class="mini">hdmi</span>${numf("cathd", io.hdmi, "0")}</div>
        ${field("Notes", `<input class="catnotes" value="${esc(d.notes || "")}">`)}
        <div style="text-align:right"><button class="del catdel">delete entry</button></div>
      </div></div>`;
  }).join("");
  return `
    <div class="sect">COMPANY (title block)</div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">
      ${field("Name", `<input class="coname" value="${esc(co.name)}">`)}
      ${field("Tagline", `<input class="cotag" value="${esc(co.tagline)}">`)}
      ${field("Info line", `<input class="coinfo" value="${esc(co.info)}">`)}
    </div></div>
    <div class="sect">SAVANT HOSTS <span class="mini">name · max zones · IP-audio cap</span></div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">${savant}
      ${field("Essentials", `<input class="svess" value="${esc(L.savant?.essentials || "")}">`)}</div></div>
    <div class="sect">JOSH PROCESSORS <span class="mini">name · devices · mics · plan</span></div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">${josh}</div></div>
    <div class="sect">CONTROL4 CONTROLLERS <span class="mini">name · devices · rooms</span></div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">${c4}
      ${field("Connect", `<input class="c4conn" value="${esc(L.control4?.connect || "")}">`)}</div></div>
    <div class="sect">DEVICE CATALOG <span class="badge">${Object.keys(SETTINGS.catalog.devices || {}).length}</span> <span class="mini">asOf ${esc(SETTINGS.catalog.asOf || "")}</span></div>
    ${devs}
    <button class="addbtn" id="addCat">＋ Add catalog device</button>
    <button class="addbtn" id="resetCat" style="margin-top:8px;border-color:#d99;color:#b55">Reset licensing &amp; catalog to shipped defaults</button>`;
}

function wireSettings(body) {
  const save = () => { saveSettings(); refresh(false); };
  const on = (selctor, fn) => body.querySelectorAll(selctor).forEach(el => el.onchange = () => { fn(el); save(); });
  const num = v => v === "" ? null : +v;
  const L = SETTINGS.catalog.licensing;
  on(".coname", el => SETTINGS.company.name = el.value);
  on(".cotag", el => SETTINGS.company.tagline = el.value);
  on(".coinfo", el => SETTINGS.company.info = el.value);
  on(".svess", el => L.savant.essentials = el.value);
  on(".svname", el => L.savant.hosts[+el.closest("[data-sv]").dataset.sv].name = el.value);
  on(".svzones", el => L.savant.hosts[+el.closest("[data-sv]").dataset.sv].maxZones = num(el.value));
  on(".svipa", el => L.savant.hosts[+el.closest("[data-sv]").dataset.sv].maxIpAudio = num(el.value));
  on(".jpname", el => L.josh.processors[+el.closest("[data-jp]").dataset.jp].name = el.value);
  on(".jpdev", el => L.josh.processors[+el.closest("[data-jp]").dataset.jp].maxDevices = num(el.value));
  on(".jpmic", el => L.josh.processors[+el.closest("[data-jp]").dataset.jp].maxMics = num(el.value));
  on(".jpplan", el => L.josh.processors[+el.closest("[data-jp]").dataset.jp].plan = el.value);
  on(".c4conn", el => L.control4.connect = el.value);
  on(".c4name", el => L.control4.controllers[+el.closest("[data-c4]").dataset.c4].name = el.value);
  on(".c4dev", el => L.control4.controllers[+el.closest("[data-c4]").dataset.c4].maxDevices = num(el.value));
  on(".c4rooms", el => L.control4.controllers[+el.closest("[data-c4]").dataset.c4].rooms = num(el.value));
  const catOf = el => SETTINGS.catalog.devices[el.closest("[data-cat]")?.dataset.cat];
  on(".catmodel", el => catOf(el).model = el.value);
  on(".catzones", el => { const d = catOf(el); if (el.value === "") delete d.zones; else d.zones = +el.value; });
  on(".catan", el => (catOf(el).inputs ||= {}).analog = num(el.value) ?? 0);
  on(".catco", el => (catOf(el).inputs ||= {}).coax = num(el.value) ?? 0);
  on(".catop", el => (catOf(el).inputs ||= {}).optical = num(el.value) ?? 0);
  on(".cathd", el => (catOf(el).inputs ||= {}).hdmi = num(el.value) ?? 0);
  on(".catnotes", el => catOf(el).notes = el.value);
  body.querySelectorAll(".catdel").forEach(el => el.onclick = () => {
    const id = el.closest("[data-cat]").dataset.cat;
    if (!confirm(`Delete catalog entry "${id}"?`)) return;
    delete SETTINGS.catalog.devices[id]; save(); renderPanel();
  });
  const addCat = body.querySelector("#addCat");
  if (addCat) addCat.onclick = () => {
    const id = prompt("Catalog id (e.g. sonos-amp):"); if (!id) return;
    SETTINGS.catalog.devices[id] = { brand: "", model: id, type: "amp", zones: 1, inputs: {}, verified: false };
    S.openRows.add("cat-" + id); save(); renderPanel();
  };
  const resetCat = body.querySelector("#resetCat");
  if (resetCat) resetCat.onclick = () => {
    if (!confirm("Replace licensing rules and device catalog with the shipped defaults?")) return;
    SETTINGS.catalog = structuredClone(SHIPPED); save(); renderPanel();
  };
}

/* ---- panel event wiring (delegated per render) ---- */
function wirePanel(body) {
  body.querySelectorAll("[data-toggle]").forEach(h => h.onclick = () => {
    const id = h.dataset.toggle;
    S.openRows.has(id) ? S.openRows.delete(id) : S.openRows.add(id);
    renderPanel();
    syncGlow();
  });
  const zoneOf = el => S.job.house.zones.find(z => z.id === el.closest("[data-zid]")?.dataset.zid);
  const on = (selctor, fn) => body.querySelectorAll(selctor).forEach(el => el.onchange = () => { fn(el); refresh(); });

  /* zones — writes go to the House, or to the active solution's overrides */
  const solA = S.job.solutions[S.sol] || S.job.solutions[0];
  const scopeSol = S.job.solutions.length > 1 && S.editScope === "sol";
  const setF = (kind, obj, f, v) => {
    if (!obj) return;
    if (scopeSol) (((solA.overrides ||= {})[kind] ||= {})[obj.id] ||= {})[f] = v;
    else obj[f] = v;
  };
  const structural = () => alert(`Adding or removing speakers/displays edits the House (all solutions). Switch "Edits apply to" to House first.`);
  body.querySelectorAll("input[name=escope]").forEach(el => el.onchange = () => { S.editScope = el.value; renderPanel(); });
  body.querySelectorAll(".ovx").forEach(el => el.onclick = ev => {
    ev.preventDefault();
    const { ovk, ovid, ovf } = el.dataset;
    const m = solA.overrides?.[ovk]?.[ovid]; if (!m) return;
    delete m[ovf];
    if (!Object.keys(m).length) delete solA.overrides[ovk][ovid];
    refresh();
  });
  on(".zname", el => { const z = zoneOf(el); if (z) z.name = el.value; });
  on(".zscope", el => { const z = zoneOf(el); setF("zones", z, "scope", el.value); });
  on(".zarea", el => { const z = zoneOf(el); if (z) { if (el.value) z.area = el.value; else delete z.area; } });
  on(".spkcfg", el => {
    const z = zoneOf(el); if (!z) return;
    z.endpoints = z.endpoints || [];
    let spk = z.endpoints.find(e => e.type === "speakers");
    if (scopeSol && (el.value === "none" || !spk)) return structural();
    if (el.value === "none") { z.endpoints = z.endpoints.filter(e => e.type !== "speakers"); }
    else if (spk) setF("endpoints", spk, "config", el.value);
    else z.endpoints.unshift({ id: uid(z.id + "-spk"), type: "speakers", config: el.value, count: 2, status: "new" });
  });
  on(".spkcount", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "speakers"), "count", +el.value); });
  on(".spkstatus", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "speakers"), "status", el.value); });
  on(".tvtype", el => {
    const z = zoneOf(el); if (!z) return;
    z.endpoints = z.endpoints || [];
    let tv = z.endpoints.find(e => e.type === "display");
    if (scopeSol && (el.value === "none" || !tv)) return structural();
    if (el.value === "none") z.endpoints = z.endpoints.filter(e => e.type !== "display");
    else if (tv) setF("endpoints", tv, "displayType", el.value);
    else z.endpoints.push({ id: uid(z.id + "-tv"), type: "display", displayType: el.value, brand: "", size: 65, status: "new" });
  });
  on(".tvbrand", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "display"), "brand", el.value); });
  on(".tvsize", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "display"), "size", +el.value); });
  on(".tvstatus", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "display"), "status", el.value); });
  on(".tvconfirm", el => { const t = zoneOf(el)?.endpoints.find(e => e.type === "display"); if (t) { if (el.checked) t.confirm = ["size"]; else delete t.confirm; } });
  body.querySelectorAll(".zdel").forEach(el => el.onclick = () => {
    const z = zoneOf(el); if (!z || !confirm(`Delete zone "${z.name}"?`)) return;
    const eps = new Set((z.endpoints || []).map(e => e.id));
    S.job.house.zones = S.job.house.zones.filter(x => x !== z);
    const sol = S.job.solutions[S.sol];
    sol.connections = sol.connections.filter(c => !eps.has(c.from) && !eps.has(c.to));
    sol.companions = (sol.companions || []).filter(c => !eps.has(c.serves));
    sol.localDevices = (sol.localDevices || []).filter(d => d.zone !== z.id);
    for (const so of S.job.solutions) {                       // overrides die with their House objects
      if (!so.overrides) continue;
      if (so.overrides.zones) delete so.overrides.zones[z.id];
      if (so.overrides.endpoints) for (const eid of eps) delete so.overrides.endpoints[eid];
    }
    refresh();
  });
  const addZone = body.querySelector("#addZone");
  if (addZone) addZone.onclick = () => {
    const name = prompt("Zone name:", "New Zone"); if (!name) return;
    const id = uid("z");
    S.job.house.zones.push({ id, name, scope: "included",
      endpoints: [{ id: uid(id + "-spk"), type: "speakers", config: "stereo", count: 2, status: "new" }] });
    S.openRows.add(id);
    refresh();
  };

  /* quick-add: shorthand / dictation with live parse-preview chips */
  const qaInput = body.querySelector("#qaInput");
  if (qaInput) {
    const chipsEl = body.querySelector("#qaChips");
    const drawChips = () => {
      if (!qaInput.value.trim()) { chipsEl.innerHTML = ""; return; }
      chipsEl.innerHTML = parseQuick(qaInput.value)
        .flatMap((p, i) => [...(i ? ['<span class="mini" style="align-self:center">|</span>'] : []),
          ...p.chips.map(c => `<span class="qc ${c.kind}">${esc(c.label)}</span>`)]).join("");
    };
    qaInput.oninput = drawChips;
    const commit = () => {
      const parses = parseQuick(qaInput.value).filter(p => !p.empty);
      if (!parses.length) return;
      for (const p of parses) {
        const z = p.zone, hints = z._hints || {}; delete z._hints;
        const oldId = z.id;
        while (S.job.house.zones.some(x => x.id === z.id)) z.id += "b";
        if (z.id !== oldId) for (const ep of z.endpoints) ep.id = ep.id.replace(oldId, z.id);
        const notes = [];
        if (hints.matrix) notes.push("video: matrix feed");
        if (hints.local) {
          notes.push("video: local source");
          S.job.solutions[S.sol].localDevices.push({ id: uid(z.id + "-src"), type: "source",
            sourceType: "appletv", model: "Apple TV", status: "new", zone: z.id, location: "at-display" });
        }
        if (notes.length) z.note = notes.join(" · ");
        S.job.house.zones.push(z);
        S.openRows.add(z.id);
      }
      qaInput.value = "";
      refresh();
    };
    body.querySelector("#qaGo").onclick = commit;
    qaInput.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); commit(); } };
    const mic = body.querySelector("#qaMic");
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) mic.style.display = "none";
    else {
      let rec = null;
      mic.onclick = () => {
        if (rec) { rec.stop(); return; }
        rec = new SR();
        rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
        mic.classList.add("rec");
        let base = qaInput.value ? qaInput.value + " " : "";
        rec.onresult = ev => {
          let txt = "";
          for (const r of ev.results) txt += r[0].transcript;
          qaInput.value = base + txt;
          drawChips();
        };
        rec.onend = () => { mic.classList.remove("rec"); rec = null; };
        rec.onerror = () => { mic.classList.remove("rec"); rec = null; };
        rec.start();
      };
    }
  }

  /* gear */
  const devOf = el => {
    const row = el.closest("[data-did]");
    const sol = S.job.solutions[S.sol];
    for (const r of sol.racks) { const d = r.devices.find(d => d.id === row?.dataset.did); if (d) return { d, r }; }
    return {};
  };
  on(".dmodel", el => { const { d } = devOf(el); if (d) d.model = el.value; });
  on(".dcat", el => {
    const { d } = devOf(el); if (!d) return;
    if (!el.value) { delete d.catalogRef; return; }
    d.catalogRef = el.value;
    const c = effectiveCatalog().devices[el.value];
    if (!c) return;
    if (!d.model || d.model === "New Device") d.model = [c.brand, c.model].filter(Boolean).join(" ");
    if (c.type && d.type !== c.type) d.type = c.type;   // the catalog knows what this box is
    if (c.zones && c.type === "amp") d.zones = c.zones;
  });
  on(".dtype", el => { const { d } = devOf(el); if (d) { d.type = el.value; if (el.value === "amp" && !d.zones) d.zones = 8; } });
  on(".dzones", el => { const { d } = devOf(el); if (d) d.zones = +el.value; });
  on(".dstatus", el => { const { d } = devOf(el); if (d) d.status = el.value; });
  body.querySelectorAll(".ddel").forEach(el => el.onclick = () => {
    const { d, r } = devOf(el); if (!d || !confirm(`Delete "${d.model || d.id}"?`)) return;
    r.devices = r.devices.filter(x => x !== d);
    const sol = S.job.solutions[S.sol];
    sol.connections = sol.connections.filter(c => c.from !== d.id && c.to !== d.id);
    sol.companions = (sol.companions || []).filter(c => c.serves !== d.id);
    refresh();
  });
  body.querySelectorAll(".adddev").forEach(el => el.onclick = () => {
    const model = prompt("Device model:", "New Device"); if (!model) return;
    const sol = S.job.solutions[S.sol];
    const r = sol.racks.find(r => r.id === el.dataset.rid);
    const d = { id: uid("dev"), type: "source", model, status: "new" };
    r.devices.push(d); S.openRows.add(d.id);
    refresh();
  });
  const connOf = el => S.job.solutions[S.sol].connections[+el.closest("[data-ci]")?.dataset.ci];
  on(".cfrom", el => { const c = connOf(el); if (c) c.from = el.value; });
  on(".cto", el => { const c = connOf(el); if (c) c.to = el.value; });
  on(".csig", el => { const c = connOf(el); if (c) c.signal = el.value; });
  on(".cch", el => { const c = connOf(el); if (c) { if (el.value) c.channels = el.value; else delete c.channels; } });
  on(".cscope", el => { const c = connOf(el); if (c) { if (el.value !== "included") c.scope = el.value; else delete c.scope; } });
  body.querySelectorAll(".cdel").forEach(el => el.onclick = () => {
    const sol = S.job.solutions[S.sol];
    sol.connections.splice(+el.closest("[data-ci]").dataset.ci, 1);
    refresh();
  });
  const addConn = body.querySelector("#addConn");
  if (addConn) addConn.onclick = () => {
    const nodes = allNodes();
    S.job.solutions[S.sol].connections.push({ from: nodes[0] || "", to: nodes[1] || "", signal: "audio" });
    refresh();
  };

  /* job */
  on(".jclient", el => { S.job.job.client.name = el.value; });
  on(".jaddr", el => { S.job.job.client.address = el.value; });
  on(".jdrawn", el => { S.job.job.drawnBy = el.value; });
  on(".solname", el => { S.job.solutions[S.sol].name = el.value; });
  on(".solplat", el => { S.job.solutions[S.sol].platforms = el.value ? [el.value] : []; });
  on(".pgflag", el => { (S.job.job.pages ||= {})[el.dataset.pg] = el.checked; });
  const addRev = body.querySelector("#addRev");
  if (addRev) addRev.onclick = () => {
    const desc = prompt("Revision note:"); if (!desc) return;
    const revs = S.job.job.revisions ||= [];
    revs.push({ rev: revs.length + 1, date: new Date().toISOString().slice(0, 10), description: desc, by: S.job.job.drawnBy?.slice(0, 2).toUpperCase() || "SP" });
    refresh();
  };
}

/* ============ boot ============ */
{
  const jobs = (await dbAll()).sort((a, b) => b.updated - a.updated);
  if (jobs.length) { S.id = jobs[0].id; S.job = jobs[0].data; }
  else {
    const raw = await (await fetch("./mock-system-residence.json")).json().catch(() => null);
    S.job = raw || blankJob("Sample Residence");
    S.id = uid("job");
    await dbPut({ id: S.id, updated: Date.now(), data: S.job });
  }
  await renderJobsSel();
  refresh(false);
}
