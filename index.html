        <span class="sub">${esc(TYPE_NAME[d.type] || d.type)}${d.zones ? ` · ${esc(d.zones)} zones` : ""}${d.verified === false ? " · ⚠ unverified" : ""}</span></div>
      <div class="fields">
        ${field("Model", `<input class="catmodel" value="${esc(d.model)}">`)}
        ${field("Zones", numf("catzones", d.zones, "-"))}
        <div class="f wrap"><label>Inputs</label>
          <span class="mini">analog</span>${numf("catan", io.analog, "0")}<span class="mini">coax</span>${numf("catco", io.coax, "0")}
          <span class="mini">opt</span>${numf("catop", io.optical, "0")}<span class="mini">hdmi</span>${numf("cathd", io.hdmi, "0")}</div>
        ${field("Notes", `<input class="catnotes" value="${esc(d.notes || "")}">`)}
        <div style="text-align:right">${CAT_STALE.includes(id) ? `<button class="cattake">use shipped specs</button> ` : ""}<button class="del catdel">delete entry</button></div>
      </div></div>`;
  }).join("");
  const conn = loadConn();
  const ai = `
    <div class="sect">AI <span class="mini">the ✦ AI button</span></div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">
      ${field("Connect", chips("aimode", [["off", "Off"], ["key", "My API key"], ["proxy", "Proxy"]], conn.mode))}
      ${conn.mode === "key" ? field("API key", `<input class="aikey" type="password" autocomplete="off" spellcheck="false" placeholder="${conn.key ? "saved — type a new one to replace it" : "sk-ant-…"}">`) + (conn.key ? `<div style="text-align:right"><button class="del" id="aiForget">forget the key</button></div>` : "") : ""}
      ${conn.mode === "proxy" ? field("Proxy URL", `<input class="aiproxy" placeholder="https://…" value="${esc(conn.proxy || "")}">`) +
        field("Access code", `<input class="aicode" type="password" autocomplete="off" placeholder="${conn.code ? "saved — type to replace" : "from whoever set up the proxy"}">`) : ""}
      ${conn.mode !== "off" ? field("Model", sel("aimodel", MODELS.map(m => m[0]), conn.model, Object.fromEntries(MODELS))) : ""}
      <div class="mini" style="line-height:1.45;margin-top:4px">Saved in this browser only — never in jobs, exports or backups. Claude sees this job (rooms, gear, client name) only when you press Ask Claude, and every proposal is previewed before anything changes. “Copy prompt for Claude” works without any setup.</div>
    </div></div>`;
  return ai + `
    <div class="sect">COMPANY (title block)</div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">
      ${field("Name", `<input class="coname" value="${esc(co.name)}">`)}
      ${field("Tagline", `<input class="cotag" value="${esc(co.tagline)}">`)}
      ${field("Info line", `<input class="coinfo" value="${esc(co.info)}">`)}
    </div></div>
    <div class="sect">SAVANT HOSTS <span class="mini">name · max zones · IP-audio cap</span></div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">${savant}
      ${field("Essentials", `<input class="svess" value="${esc(L.savant?.essentials || "")}">`)}</div></div>
    <div class="sect">JOSH PROCESSORS <span class="mini">name · devices · mics · plan</span></div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">${josh}</div></div>
    <div class="sect">CONTROL4 CONTROLLERS <span class="mini">name · devices · rooms</span></div>
    <div class="row open"><div class="fields" style="display:block;border-top:none">${c4}
      ${field("Connect", `<input class="c4conn" value="${esc(L.control4?.connect || "")}">`)}</div></div>
    <div class="sect">DEVICE CATALOG <span class="badge">${Object.keys(SETTINGS.catalog.devices || {}).length}</span> <span class="mini">asOf ${esc(SETTINGS.catalog.asOf || "")}</span></div>
    ${CAT_STALE.length ? `<div class="drift">⚠ ${CAT_STALE.length} entr${CAT_STALE.length === 1 ? "y differs" : "ies differ"} from the latest shipped specs — your edits, or specs saved before a correction:
      ${CAT_STALE.map(id => esc(`${SETTINGS.catalog.devices[id]?.brand || ""} ${SETTINGS.catalog.devices[id]?.model || id}`.trim())).join(", ")}.
      <button class="addbtn" id="catTakeAll" style="margin-top:6px">Update all to the shipped specs</button></div>` : ""}
    ${devs}
    <button class="addbtn" id="addCat">＋ Add catalog device</button>
    <button class="addbtn" id="resetCat" style="margin-top:8px;border-color:#d99;color:#b55">Reset licensing &amp; catalog to shipped defaults</button>`;
}

function wireSettings(body) {
  // AI connection: localStorage only (loadConn/saveConn), re-render the section on change
  const setConn = patch => { saveConn({ ...loadConn(), ...patch }); renderPanel(); };
  body.querySelectorAll('.chip[data-act="aimode"]').forEach(b => b.onclick = () => setConn({ mode: b.dataset.v }));
  const k = body.querySelector(".aikey"); if (k) k.onchange = () => { if (k.value.trim()) setConn({ key: k.value.trim() }); };
  const px = body.querySelector(".aiproxy"); if (px) px.onchange = () => setConn({ proxy: px.value.trim() });
  const cd = body.querySelector(".aicode"); if (cd) cd.onchange = () => { if (cd.value.trim()) setConn({ code: cd.value.trim() }); };
  const md = body.querySelector(".aimodel"); if (md) md.onchange = () => setConn({ model: md.value });
  const fg = body.querySelector("#aiForget"); if (fg) fg.onclick = () => { const c = loadConn(); delete c.key; saveConn(c); renderPanel(); };
  const save = () => { saveSettings(); refresh(false); };
  const on = (selctor, fn) => body.querySelectorAll(selctor).forEach(el => el.onchange = () => { fn(el); save(); });
  const num = v => v === "" ? null : +v;
  const retake = ids => { for (const id of ids) takeShipped(id); syncShippedCatalog(); save(); renderPanel(); };
  body.querySelector("#catTakeAll")?.addEventListener("click", () => retake([...CAT_STALE]));
  body.querySelectorAll(".cattake").forEach(b => b.onclick = () => retake([b.closest("[data-cat]").dataset.cat]));
  const L = SETTINGS.catalog.licensing;
  on(".coname", el => SETTINGS.company.name = el.value);
  on(".cotag", el => SETTINGS.company.tagline = el.value);
  on(".coinfo", el => SETTINGS.company.info = el.value);
  on(".svess", el => (L.savant ||= { hosts: [] }).essentials = el.value);
  on(".svname", el => L.savant.hosts[+el.closest("[data-sv]").dataset.sv].name = el.value);
  on(".svzones", el => L.savant.hosts[+el.closest("[data-sv]").dataset.sv].maxZones = num(el.value));
  on(".svipa", el => L.savant.hosts[+el.closest("[data-sv]").dataset.sv].maxIpAudio = num(el.value));
  on(".jpname", el => L.josh.processors[+el.closest("[data-jp]").dataset.jp].name = el.value);
  on(".jpdev", el => L.josh.processors[+el.closest("[data-jp]").dataset.jp].maxDevices = num(el.value));
  on(".jpmic", el => L.josh.processors[+el.closest("[data-jp]").dataset.jp].maxMics = num(el.value));
  on(".jpplan", el => L.josh.processors[+el.closest("[data-jp]").dataset.jp].plan = el.value);
  on(".c4conn", el => (L.control4 ||= { controllers: [] }).connect = el.value);
  on(".c4name", el => L.control4.controllers[+el.closest("[data-c4]").dataset.c4].name = el.value);
  on(".c4dev", el => L.control4.controllers[+el.closest("[data-c4]").dataset.c4].maxDevices = num(el.value));
  on(".c4rooms", el => L.control4.controllers[+el.closest("[data-c4]").dataset.c4].rooms = num(el.value));
  const catOf = el => SETTINGS.catalog.devices[el.closest("[data-cat]")?.dataset.cat];
  on(".catmodel", el => catOf(el).model = el.value);
  on(".catzones", el => { const d = catOf(el); if (el.value === "") delete d.zones; else d.zones = +el.value; });
  on(".catan", el => (catOf(el).inputs ||= {}).analog = num(el.value) ?? 0);
  on(".catco", el => (catOf(el).inputs ||= {}).coax = num(el.value) ?? 0);
  on(".catop", el => (catOf(el).inputs ||= {}).optical = num(el.value) ?? 0);
  on(".cathd", el => (catOf(el).inputs ||= {}).hdmi = num(el.value) ?? 0);
  on(".catnotes", el => catOf(el).notes = el.value);
  body.querySelectorAll(".catdel").forEach(el => el.onclick = () => {
    const id = el.closest("[data-cat]").dataset.cat;
    if (!confirm(`Delete catalog entry "${id}"?`)) return;
    delete SETTINGS.catalog.devices[id]; save(); renderPanel();
  });
  const addCat = body.querySelector("#addCat");
  if (addCat) addCat.onclick = () => {
    const id = (prompt("Catalog id (e.g. sonos-amp):") || "").trim(); if (!id) return;
    if (!/^[A-Za-z0-9_.:-]{1,80}$/.test(id)) { alert("Use letters, numbers, dots, dashes or underscores for the id."); return; }
    if (SETTINGS.catalog.devices[id]) { alert(`"${id}" is already in the catalog — edit that entry instead.`); S.openRows.add("cat-" + id); renderPanel(); return; }
    SETTINGS.catalog.devices[id] = { brand: "", model: id, type: "amp", zones: 1, inputs: {}, verified: false };
    S.openRows.add("cat-" + id); save(); renderPanel();
  };
  const resetCat = body.querySelector("#resetCat");
  if (resetCat) resetCat.onclick = () => {
    if (!confirm("Replace licensing rules and device catalog with the shipped defaults?")) return;
    SETTINGS.catalog = structuredClone(SHIPPED); SETTINGS.catalogBase = {}; syncShippedCatalog(); save(); renderPanel();
  };
}

/* ---- panel event wiring (delegated per render) ---- */
function wirePanel(body) {
  body.querySelectorAll("[data-toggle]").forEach(h => h.onclick = () => {
    const id = h.dataset.toggle;
    S.openRows.has(id) ? S.openRows.delete(id) : S.openRows.add(id);
    // a connection row opened in the panel lights its wire on the sheet
    if (id.startsWith("conn:")) {
      const c = S.job.solutions[S.sol].connections[+id.slice(5).split("@")[0]];
      if (c && S.openRows.has(id)) { selWire = `${c.from}→${c.to}`; hideTip(); applySel(); }
      else if (c && selWire === `${c.from}→${c.to}`) { selWire = null; applySel(); }
    }
    renderPanel();
    syncGlow();
  });
  const zoneOf = el => S.job.house.zones.find(z => z.id === el.closest("[data-zid]")?.dataset.zid);
  const on = (selctor, fn) => body.querySelectorAll(selctor).forEach(el => el.onchange = () => { fn(el); refresh(); });
  // zone field handlers are also reachable from tap chips: a chip calls the
  // same handler with its value (and closest() for the row lookup)
  const ZH = {};
  const zon = (selctor, fn) => { ZH[selctor] = fn; on(selctor, fn); };

  /* zones — writes go to the House, or to the active solution's overrides */
  const solA = S.job.solutions[S.sol] || S.job.solutions[0];
  const scopeSol = S.job.solutions.length > 1 && S.editScope === "sol";
  const setF = (kind, obj, f, v) => {
    if (!obj) return;
    if (scopeSol) (((solA.overrides ||= {})[kind] ||= {})[obj.id] ||= {})[f] = v;
    else obj[f] = v;
  };
  const structural = () => alert(`Adding or removing speakers/displays edits the House (all solutions). Switch "Edits apply to" to House first.`);
  body.querySelectorAll("input[name=escope]").forEach(el => el.onchange = () => { S.editScope = el.value; renderPanel(); });
  body.querySelectorAll(".ovx").forEach(el => el.onclick = ev => {
    ev.preventDefault();
    const { ovk, ovid, ovf } = el.dataset;
    const m = solA.overrides?.[ovk]?.[ovid]; if (!m) return;
    delete m[ovf];
    if (!Object.keys(m).length) delete solA.overrides[ovk][ovid];
    refresh();
  });
  on(".zname", el => { const z = zoneOf(el); if (z) z.name = el.value; });
  on(".zoutdoor", el => { const z = zoneOf(el); if (!z) return; if (el.value === "auto") delete z.outdoor; else z.outdoor = el.value === "yes"; });
  zon(".zscope", el => { const z = zoneOf(el); setF("zones", z, "scope", el.value); });
  on(".zremote", el => {
    const z = zoneOf(el); if (!z) return;
    if (scopeSol) setF("zones", z, "remote", el.value);      // "none" override = explicitly no remote in this solution
    else if (el.value === "none") delete z.remote; else z.remote = el.value;
  });
  on(".zarea", el => { const z = zoneOf(el); if (z) { if (el.value) z.area = el.value; else delete z.area; } });
  zon(".spkcfg", el => {
    const z = zoneOf(el); if (!z) return;
    z.endpoints = z.endpoints || [];
    let spk = z.endpoints.find(e => e.type === "speakers");
    if (scopeSol && (el.value === "none" || !spk)) return structural();
    if (el.value === "none") { z.endpoints = z.endpoints.filter(e => e.type !== "speakers"); purgeHouseRefs([spk?.id].filter(Boolean)); }
    else if (spk) setF("endpoints", spk, "config", el.value);
    else z.endpoints.unshift({ id: uid(z.id + "-spk"), type: "speakers", config: el.value, count: 2, status: "new" });
  });
  on(".spkcount", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "speakers"), "count", +el.value); });
  zon(".spkstatus", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "speakers"), "status", el.value); });
  zon(".tvtype", el => {
    const z = zoneOf(el); if (!z) return;
    z.endpoints = z.endpoints || [];
    let tv = z.endpoints.find(e => e.type === "display");
    if (scopeSol && (el.value === "none" || !tv)) return structural();
    if (el.value === "none") { z.endpoints = z.endpoints.filter(e => e.type !== "display"); purgeHouseRefs([tv?.id].filter(Boolean)); }
    else if (tv) setF("endpoints", tv, "displayType", el.value);
    else z.endpoints.push({ id: uid(z.id + "-tv"), type: "display", displayType: el.value, brand: "", size: 65, status: "new" });
  });
  on(".tvbrand", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "display"), "brand", el.value); });
  zon(".tvsize", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "display"), "size", +el.value); });
  zon(".tvstatus", el => { setF("endpoints", zoneOf(el)?.endpoints.find(e => e.type === "display"), "status", el.value); });
  on(".tvconfirm", el => { const t = zoneOf(el)?.endpoints.find(e => e.type === "display"); if (t) { if (el.checked) t.confirm = ["size"]; else delete t.confirm; } });
  body.querySelectorAll(".zdel").forEach(el => el.onclick = () => {
    const z = zoneOf(el); if (!z || !confirm(`Delete zone "${z.name}"?`)) return;
    S.job.house.zones = S.job.house.zones.filter(x => x !== z);
    purgeHouseRefs((z.endpoints || []).map(e => e.id), z.id);
    S.openRows.delete(z.id);
    refresh();
  });
  const addZone = body.querySelector("#addZone");
  if (addZone) addZone.onclick = () => {
    const name = prompt("Zone name:", "New Zone"); if (!name) return;
    const id = uid("z");
    S.job.house.zones.push({ id, name, scope: "included",
      endpoints: [{ id: uid(id + "-spk"), type: "speakers", config: "stereo", count: 2, status: "new" }] });
    S.openRows.add(id);
    refresh();
  };

  body.querySelectorAll(".chip[data-act]").forEach(b => b.onclick = () => {
    const fn = ZH["." + b.dataset.act]; if (!fn) return;
    fn({ value: b.dataset.v, checked: false, closest: q => b.closest(q) });
    refresh();
  });
  body.querySelectorAll("details.more").forEach(d => d.ontoggle = () => { d.open ? S.openRows.add(d.dataset.more) : S.openRows.delete(d.dataset.more); });
  ZH[".hvrun"] = el => { const z = zoneOf(el); const sol = S.job.solutions[S.sol]; if (z) setVideo(S.job, sol, z, readHookup(S.job, sol, z).video?.from, el.value); };

  /* zone hookup */
  const hook = (el, fn) => { const z = zoneOf(el); if (!z) return; fn(z, S.job.solutions[S.sol]); refresh(); };
  const newDev = (sol, v) => {
    const type = v === "__new_amp" ? "amp" : "avr";
    const model = prompt(type === "amp" ? "Amp model:" : "Receiver model:", type === "amp" ? "Multi-zone amp" : "AV receiver");
    return model ? addRackDevice(S.job, sol, type, model) : null;
  };
  body.querySelectorAll(".hvfrom").forEach(el => el.onchange = () => hook(el, (z, sol) => {
    let v = el.value; if (v.startsWith("__new_")) { v = newDev(sol, v); if (!v) return; }
    setVideo(S.job, sol, z, v || null);
  }));
  body.querySelectorAll(".hsfrom").forEach(el => el.onchange = () => hook(el, (z, sol) => {
    let v = el.value; if (v.startsWith("__new_")) { v = newDev(sol, v); if (!v) return; }
    setSpeakers(S.job, sol, z, v || null);
  }));
  body.querySelectorAll(".hsch").forEach(el => el.onchange = () => hook(el, (z, sol) =>
    setSpeakers(S.job, sol, z, readHookup(S.job, sol, z).speakers?.from, el.value.trim())));
  body.querySelectorAll(".hret").forEach(el => el.onchange = () => hook(el, (z, sol) => {
    const [mode, to] = el.value.split(":");
    setAudioBack(S.job, sol, z, mode, to);
  }));
  body.querySelectorAll(".hsame").forEach(el => el.onclick = () => hook(el, (z, sol) =>
    el.dataset.what === "video" ? setVideo(S.job, sol, z, el.dataset.dev) : setSpeakers(S.job, sol, z, el.dataset.dev)));
  body.querySelectorAll(".hdante").forEach(el => el.onclick = () => hook(el, (z, sol) => {
    const h = readHookup(S.job, sol, z);
    if (el.dataset.how === "axis") {                          // swap the Dante decoder for an AXIS2 on the TV's eARC
      const dec = sol.companions.find(c => c.id === h.dante.via); const amps = h.dante.to;
      sol.connections = sol.connections.filter(c => !(c.from === dec.id && c.dante)); delete dec.dante;
      const a = { id: `axis-${z.id}`, type: "axis", serves: h.tv.id, auto: true };
      sol.companions.push(a);
      sol.connections.push({ from: h.tv.id, to: a.id, signal: "audioReturn", earc: true }, ...amps.map(to => ({ from: a.id, to, signal: "audio", dante: true })));
    } else setDanteAudio(S.job, sol, z, h.spk ? danteAmpFor(S.job, sol, z) : null);
  }));

  /* quick-add: shorthand / dictation with live parse-preview chips */
  const qaInput = body.querySelector("#qaInput");
  if (qaInput) {
    const chipsEl = body.querySelector("#qaChips");
    // a command ("connect cable box to mrx", "kitchen to amp 2", "patio 75") previews
    // exactly what it will do; anything else is new zones, as before
    const asCommands = () => parseCommandText(qaInput.value, S.job, S.job.solutions[S.sol]);
    const drawChips = () => {
      if (!qaInput.value.trim()) { chipsEl.innerHTML = ""; return; }
      const cmds = asCommands();
      if (cmds) {
        const plan = planCommands(S.job, S.sol, cmds, effectiveCatalog());
        chipsEl.innerHTML = planHTML(plan, { acts: false }) + `<span class="mini">${plan.steps.some(x => x.ok) ? "Enter to apply" : "Nothing to apply"}</span>`;
        return;
      }
      chipsEl.innerHTML = parseQuick(qaInput.value)
        .flatMap((p, i) => [...(i ? ['<span class="mini" style="align-self:center">|</span>'] : []),
          ...p.chips.map(c => `<span class="qc ${c.kind}">${esc(c.label)}</span>`)]).join("");
    };
    qaInput.oninput = drawChips;
    const commit = () => {
      const cmds = asCommands();
      if (cmds) {
        const label = qaInput.value.trim();
        if (applyPlan(planCommands(S.job, S.sol, cmds, effectiveCatalog()), label)) qaInput.value = "";
        return;
      }
      const parses = parseQuick(qaInput.value).filter(p => !p.empty);
      if (!parses.length) return;
      pushUndo(`add ${parses.map(p => p.zone.name).join(", ")}`);
      for (const p of parses) {
        const z = p.zone, hints = z._hints || {}; delete z._hints;
        const oldId = z.id;
        while (S.job.house.zones.some(x => x.id === z.id)) z.id += "b";
        if (z.id !== oldId) for (const ep of z.endpoints) ep.id = ep.id.replace(oldId, z.id);
        const notes = [];
        if (hints.local) {
          notes.push("TV fed by a source in the zone");
          S.job.solutions[S.sol].localDevices.push({ id: uid(z.id + "-src"), type: "source",
            sourceType: "appletv", model: "Apple TV", status: "new", zone: z.id, location: "at-display" });
        }
        if (notes.length) z.note = notes.join(" · ");
        S.job.house.zones.push(z);
        autoHookup(S.job, S.job.solutions[S.sol], z, hints);   // "matrix" / "avr" wire it up now
        S.openRows.add(z.id);
      }
      qaInput.value = "";
      refresh();
    };
    body.querySelector("#qaGo").onclick = commit;
    qaInput.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); commit(); } };
    const mic = body.querySelector("#qaMic");
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) mic.style.display = "none";
    else {
      let rec = null;
      mic.onclick = () => {
        if (rec) { rec.stop(); return; }
        rec = new SR();
        rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
        mic.classList.add("rec");
        let base = qaInput.value ? qaInput.value + " " : "";
        rec.onresult = ev => {
          let txt = "";
          for (const r of ev.results) txt += r[0].transcript;
          qaInput.value = base + txt;
          drawChips();
        };
        rec.onend = () => { mic.classList.remove("rec"); rec = null; };
        rec.onerror = () => { mic.classList.remove("rec"); rec = null; };
        rec.start();
      };
    }
  }

  /* gear */
  const devOf = el => {
    const row = el.closest("[data-did]");
    const sol = S.job.solutions[S.sol];
    for (const r of sol.racks) { const d = r.devices.find(d => d.id === row?.dataset.did); if (d) return { d, r }; }
    return {};
  };
  on(".dmodel", el => { const { d } = devOf(el); if (d) d.model = el.value; });
  on(".dcat", el => {
    const { d } = devOf(el); if (!d) return;
    if (!el.value) { delete d.catalogRef; return; }
    d.catalogRef = el.value;
    const c = effectiveCatalog().devices[el.value];
    if (!c) return;
    d.model = productName(c);   // the box is called what was picked — drawing, list and dropdown agree
    if (c.type && d.type !== c.type) d.type = c.type;   // the catalog knows what this box is
    if (c.zones && c.type === "amp") d.zones = c.zones;
  });
  body.querySelectorAll(".dusecat").forEach(el => el.onclick = ev => {
    ev.preventDefault();
    const { d } = devOf(el); const c = d && effectiveCatalog().devices?.[d.catalogRef];
    if (c) { d.model = productName(c); refresh(); }
  });
  const matchAll = body.querySelector("#matchAll");
  if (matchAll) matchAll.onclick = () => {
    for (const d of S.job.solutions[S.sol].racks.flatMap(r => r.devices)) {
      const c = d.catalogRef && effectiveCatalog().devices?.[d.catalogRef];
      if (c) d.model = productName(c);
    }
    refresh();
  };
  on(".dtype", el => { const { d } = devOf(el); if (d) { d.type = el.value; if (el.value === "amp" && !d.zones) d.zones = 8; } });
  on(".dzones", el => { const { d } = devOf(el); if (d) d.zones = +el.value; });
  on(".dstatus", el => { const { d } = devOf(el); if (d) d.status = el.value; });
  body.querySelectorAll(".ddel").forEach(el => el.onclick = () => {
    const { d, r } = devOf(el); if (!d || !confirm(`Delete "${d.model || d.id}"?`)) return;
    r.devices = r.devices.filter(x => x !== d);
    const sol = S.job.solutions[S.sol];
    // the device's chips go with it — and so do the wires into those chips
    const gone = new Set([d.id, ...(sol.companions || []).filter(c => c.serves === d.id).map(c => c.id)]);
    sol.connections = sol.connections.filter(c => !gone.has(c.from) && !gone.has(c.to));
    sol.companions = (sol.companions || []).filter(c => !gone.has(c.id));
    for (const c of sol.connections) if (c.routeHint?.between?.includes?.(d.id)) delete c.routeHint;   // custom route named it
    S.openRows.delete(d.id);
    refresh();
  });
  body.querySelectorAll(".adddev").forEach(el => el.onclick = () => {
    const model = prompt("Device model:", "New Device"); if (!model) return;
    const sol = S.job.solutions[S.sol];
    const r = sol.racks.find(r => r.id === el.dataset.rid);
    const d = { id: uid("dev"), type: "source", model, status: "new" };
    r.devices.push(d); S.openRows.add(d.id);
    refresh();
  });
  const connOf = el => S.job.solutions[S.sol].connections[+el.closest("[data-ci]")?.dataset.ci];
  // re-pointing a connection re-guesses what it carries (TV → video, speakers → speaker wire)
  const reguess = c => { const g = suggestSignal(c.from, c.to); if (g) c.signal = g; };
  const follow = (c, fn) => { const was = `${c.from}→${c.to}`; fn(); if (selWire === was) selWire = `${c.from}→${c.to}`; };
  on(".cfrom", el => { const c = connOf(el); if (c) follow(c, () => { c.from = el.value; reguess(c); }); });
  on(".cto", el => { const c = connOf(el); if (c) follow(c, () => { c.to = el.value; reguess(c); }); });
  on(".csig", el => { const c = connOf(el); if (c) c.signal = el.value; });
  on(".cearc", el => { const c = connOf(el); if (c) { if (el.checked) c.earc = true; else delete c.earc; } });
  on(".cbackup", el => { const c = connOf(el); if (c) { if (el.checked) c.backup = true; else delete c.backup; } });
  on(".cch", el => { const c = connOf(el); if (c) { if (el.value) c.channels = el.value; else delete c.channels; } });
  on(".cscope", el => { const c = connOf(el); if (c) { if (el.value !== "included") c.scope = el.value; else delete c.scope; } });
  body.querySelectorAll(".cdel").forEach(el => el.onclick = () => {
    const sol = S.job.solutions[S.sol];
    sol.connections.splice(+el.closest("[data-ci]").dataset.ci, 1);
    for (const k of [...S.openRows]) if (k.startsWith("conn:")) S.openRows.delete(k);   // indices shifted (every context)
    refresh();
  });
  const addConn = body.querySelector("#addConn");
  if (addConn) addConn.onclick = () => {
    const nodes = allNodes(), sol = S.job.solutions[S.sol];
    const from = nodes.find(id => nodeInfo(id).kind === "rack") || nodes[0] || "";
    const to = nodes.find(id => nodeInfo(id).kind === "display") || nodes.find(id => id !== from) || "";
    const c = { from, to, signal: suggestSignal(from, to) || "video" };
    sol.connections.push(c);
    S.openRows.add(`conn:${sol.connections.length - 1}@job`);   // open it — the defaults are a starting point
    refresh();
  };
  // a box's back panel: plug something in / connect an output, starting from
  // the likeliest other end (an unfed zone for amps and receivers)
  body.querySelectorAll(".addconn").forEach(el => el.onclick = () => {
    const { d } = devOf(el); if (!d) return;
    const sol = S.job.solutions[S.sol], nodes = allNodes();
    const fed = new Set(sol.connections.map(c => c.to)), used = new Set(sol.connections.map(c => c.from));
    let from, to;
    if (el.dataset.dir === "out") {
      from = d.id;
      // an output never lands on a source; prefer what this kind of box drives, unfed first
      const want = d.type === "amp" ? ["speakers"] : d.type === "avr" ? ["display", "speakers"] : ["display", "speakers", "adapter"];
      const ok = id => id !== d.id && nodeInfo(id).type !== "source";
      to = nodes.find(id => ok(id) && !fed.has(id) && want.includes(nodeInfo(id).kind)) ||
           nodes.find(id => ok(id) && want.includes(nodeInfo(id).kind)) ||
           nodes.find(id => ok(id) && !fed.has(id)) || nodes.find(ok) || "";
    } else {
      to = d.id;
      from = nodes.find(id => id !== d.id && nodeInfo(id).kind === "rack" && !used.has(id)) || nodes.find(id => id !== d.id) || "";
    }
    sol.connections.push({ from, to, signal: suggestSignal(from, to) || "video" });
    S.openRows.add(`conn:${sol.connections.length - 1}@${d.id}`);
    refresh();
  });
  const cs = body.querySelector("#connSearch");
  if (cs) {
    const filter = () => {
      const q = (S.connQuery = cs.value).trim().toLowerCase();
      body.querySelectorAll("#connList .cgroup").forEach(g => {
        let any = false;
        g.querySelectorAll("[data-ci]").forEach(r => {
          const hit = !q || (g.querySelector(".cgrp").textContent + " " + r.querySelector(".head").textContent).toLowerCase().includes(q);
          r.style.display = hit ? "" : "none"; any ||= hit;
        });
        g.style.display = any ? "" : "none";
      });
    };
    cs.oninput = filter; filter();
  }
  const toAll = body.querySelector("#toAllConns");
  if (toAll) toAll.onclick = ev => { ev.preventDefault(); switchTab("job"); renderPanel(); setTimeout(() => $("#allConns")?.scrollIntoView({ block: "start", behavior: "smooth" }), 30); };

  /* job */
  on(".jclient", el => { S.job.job.client.name = el.value; });
  on(".jaddr", el => { S.job.job.client.address = el.value; });
  on(".jdrawn", el => { S.job.job.drawnBy = el.value; });
  /* rack tab */
  const rackOf = id => (S.job.solutions[S.sol].racks || []).find(r => r.id === id);
  on(".rsize", el => { const r = rackOf(el.dataset.rack); if (r) r.units = +el.value; });
  on(".rpart", el => {
    const r = rackOf(el.dataset.rack), v = el.value.trim();
    if (el.dataset.key === "rack" && r) { if (v) r.partNo = v; else delete r.partNo; return; }
    const parts = (S.job.job.rackParts ||= {});
    if (v) parts[el.dataset.key] = v; else delete parts[el.dataset.key];
  });
  on(".rspec", el => {
    const d = (S.job.solutions[S.sol].racks || []).flatMap(r => r.devices || []).find(x => x.id === el.dataset.dev);
    if (!d) return;
    const k = el.dataset.k, v = el.value.trim();
    const base = specFor({ ...d, [k]: null }, effectiveCatalog())?.[k];
    if (v === "" || (base != null && +v === +base) || !isFinite(+v)) delete d[k]; else d[k] = +v;
  });
  on(".jgroup", el => { if (el.value === "type") delete S.job.job.zoneGrouping; else S.job.job.zoneGrouping = el.value; });
  on(".solname", el => { S.job.solutions[S.sol].name = el.value; });
  on(".solplat", el => { S.job.solutions[S.sol].platforms = el.value ? [el.value] : []; });
  on(".solnet", el => { const sol = S.job.solutions[S.sol]; if (el.value) sol.audioNetwork = el.value; else delete sol.audioNetwork; });
  on(".pgflag", el => { (S.job.job.pages ||= {})[el.dataset.pg] = el.checked; });
  const updCat = body.querySelector("#updCat");
  if (updCat) updCat.onclick = () => {
    const d = catalogDrift(S.job, SETTINGS.catalog);
    if (!confirm(`Update ${d.length} device spec${d.length > 1 ? "s" : ""} on this job to the current catalog?\n\n${d.map(x => x.model).join("\n")}\n\nPort budgets and advice may change.`)) return;
    refreshCatalogLock(S.job, SETTINGS.catalog);
    refresh();
  };
  const addRev = body.querySelector("#addRev");
  if (addRev) addRev.onclick = () => {
    const desc = prompt("Revision note:"); if (!desc) return;
    const revs = S.job.job.revisions ||= [];
    revs.push({ rev: revs.length + 1, date: new Date().toISOString().slice(0, 10), description: desc, by: S.job.job.drawnBy?.slice(0, 2).toUpperCase() || "SP" });
    refresh();
  };
}

/* ============ boot ============ */
{
  const jobs = (await dbAll()).sort((a, b) => b.updated - a.updated);
  if (jobs.length) { S.id = jobs[0].id; S.job = jobs[0].data; }
  else {
    const raw = await (await fetch("./mock-system-residence.json")).json().catch(() => null);
    S.job = raw || blankJob("Sample Residence");
    S.id = uid("job");
    await dbPut({ id: S.id, updated: Date.now(), data: S.job });
  }
  await renderJobsSel();
  refresh(false);
}

/* AVWalk "Send to SignalPath": the survey rides in the #fragment. Take it,
   clear it from the address bar (and this history entry) at once, then land
   on the normal import review — nothing touches a job until you choose. */
async function takeHandoff() {
  if (!location.hash.startsWith("#avwalk=")) return;
  const hash = location.hash;
  history.replaceState(null, "", location.pathname + location.search);
  try { await showReview(importAny(await decodeHandoff(hash))); }
  catch (err) { alert("Couldn't open the AVWalk survey: " + err.message); }
}
addEventListener("hashchange", takeHandoff);
await takeHandoff();
</script>
